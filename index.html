<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7010B0">
  <meta name="description" content="Looply — Cartas aos amigos ;)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/splash-login.css">
  <script type="module" src="assets/js/theme.js"></script>
  <title>Looply</title>
</head>
<body class="splash-page">
  <main class="splash" aria-labelledby="splashTitle">
    <h1 class="splash-title" id="splashTitle">Looply</h1>
    <div class="splash-logo" aria-label="Logo Looply em rotação">
      <div class="circle" aria-hidden="true">
        <svg viewBox="0 0 100 100" fill="none">
          <path d="M50 15A35 35 0 0 1 85 50" stroke="currentColor" stroke-width="5"/>
        </svg>
      </div>
    </div>
    <p class="splash-message">Cartas aos amigos ;)</p>
    <p class="splash-company"><strong>MoissWorld</strong></p>
  </main>
  <script type="module">
    import { resolveStartupSession } from "./assets/js/startup.js";

    const SPLASH_DURATION = 7000;
    const startedAt = performance.now();
    const sessionPromise = resolveStartupSession().catch((error) => {
      console.error("Looply: erro ao verificar sessão inicial.", error);
      return null;
    });

    window.addEventListener("load", async () => {
      const remaining = Math.max(0, SPLASH_DURATION - (performance.now() - startedAt));
      await new Promise((resolve) => window.setTimeout(resolve, remaining));
      const session = await sessionPromise;
      window.location.replace(session
        ? (session.role === "admin" ? "admin.html" : "home.html")
        : "login.html");
    }, { once: true });
  </script>
</body>
</html>
