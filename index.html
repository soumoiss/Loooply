<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7010B0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<title>Looply</title>

<link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch&display=swap" rel="stylesheet">

<style>

:root {
  --primary: #7010B0;
  --primary-dark: #6010A0;
  --primary-deep: #503090;
  --deep-purple: #302050;

  --white: #FFFFFF;

  --surface: #F5F0FA;
  --surface-lilac: #F0E0F0;

  --text-primary: #403050;
  --text-secondary: #7010B0;
  --text-muted: #AAA2B0;

  --border: #DED6E5;

  --success: #35C878;
  --error: #E63232;

  --logo-color: #7010B0;
  --logo-glow: rgba(112,16,176,.70);
  --logo-glow-soft: rgba(112,16,176,.35);

  --radius-sm: 12px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-xl: 32px;
  --radius-pill: 999px;

  --shadow-soft: 0 8px 24px rgba(70,30,100,.10);
  --shadow-logo: 0 0 12px rgba(112,16,176,.45);
}


* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}


html {
  width: 100%;
  height: 100%;
}


body {
  width: 100%;
  min-width: 100%;
  height: 100%;
  min-height: 100svh;

  margin: 0;
  padding: 0;

  overflow: hidden;

  position: relative;

  display: flex;
  align-items: center;
  justify-content: center;

  font-family: 'Cabin Sketch', cursive;

  text-align: center;

  color: var(--text-primary);

  background:
    linear-gradient(
      180deg,
      var(--primary) 0%,
      var(--primary-dark) 48%,
      var(--surface) 48%,
      var(--surface) 100%
    );

  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;

  text-rendering: optimizeLegibility;
}


body::before {
  content: "";

  position: absolute;

  width: 150%;
  height: 62%;

  left: -25%;
  top: 34%;

  background: var(--surface);

  border-radius:
    50% 50% 0 0 /
    18% 18% 0 0;

  z-index: -2;

  pointer-events: none;
}


body::after {
  content: "";

  position: absolute;

  inset: 0;

  pointer-events: none;

  background:
    radial-gradient(
      circle at 50% 20%,
      rgba(255,255,255,.10),
      transparent 30%
    );

  z-index: -1;
}


.logo-container {
  position: absolute;

  top: 50%;
  left: 50%;

  transform:
    translate(-50%, -50%);

  width: min(90vw, 520px);

  padding:
    clamp(20px, 5vw, 38px)
    clamp(18px, 5vw, 34px);

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  animation:
    logoAnimation 2s forwards;

  transform-origin: center center;

  z-index: 2;

  user-select: none;
}


.logo-circle {
  position: relative;

  width: 100px;
  height: 100px;

  flex-shrink: 0;

  border:
    10px solid var(--logo-color);

  border-radius: 50%;

  display: flex;

  align-items: center;
  justify-content: center;

  background:
    rgba(112,16,176,.025);

  animation:
    spin 3s linear infinite;

  box-shadow:
    0 0 8px rgba(112,16,176,.85),
    0 0 18px rgba(112,16,176,.55),
    0 0 32px rgba(112,16,176,.35),
    0 0 50px rgba(112,16,176,.18),
    inset 0 0 18px rgba(112,16,176,.10);

  transform-origin: center center;

  will-change: transform;
}


.logo-circle::before {
  content: "";

  position: absolute;

  width: 100px;
  height: 100px;

  top: 50%;
  left: 50%;

  transform:
    translate(-50%, -50%);

  border-radius: 50%;

  border:
    1px solid rgba(112,16,176,.35);

  opacity: .18;

  animation:
    logoGlow 2.5s ease-in-out infinite;

  pointer-events: none;
}


.logo-circle::after {
  content: "";

  position: absolute;

  width: 118px;
  height: 118px;

  top: 50%;
  left: 50%;

  transform:
    translate(-50%, -50%);

  border-radius: 50%;

  border:
    1px solid rgba(112,16,176,.12);

  opacity: .35;

  pointer-events: none;
}


.logo-circle svg {
  position: relative;

  z-index: 2;

  width: 50px;
  height: 50px;

  flex-shrink: 0;

  display: block;

  overflow: visible;

  filter:
    drop-shadow(0 0 6px rgba(112,16,176,.80))
    drop-shadow(0 0 13px rgba(112,16,176,.42));
}


.logo-circle path {
  stroke: #7010B0 !important;

  fill: none;

  stroke-width: 5;

  stroke-linecap: round;

  vector-effect: non-scaling-stroke;
}


.logo-text {
  margin-top: 20px;

  padding: 0;

  font-size:
    clamp(42px, 11vw, 48px);

  line-height: 1;

  font-weight: bold;

  letter-spacing: 0;

  color: #7010B0 !important;

  text-align: center;

  white-space: nowrap;

  text-shadow:
    0 2px 8px rgba(48,32,80,.16),
    0 0 10px rgba(112,16,176,.38),
    0 0 20px rgba(112,16,176,.20);

  user-select: none;
}


.message {
  position: absolute;

  left: 50%;

  bottom:
    clamp(78px, 11vh, 105px);

  width:
    min(90vw, 560px);

  margin: 0;
  padding: 0;

  transform:
    translateX(-50%);

  font-size:
    clamp(20px, 5vw, 25px);

  line-height: 1.2;

  font-weight: bold;

  color: var(--primary-deep);

  text-align: center;

  text-shadow:
    0 2px 10px rgba(80,48,144,.10);

  opacity: 0;

  animation:
    messageAppear
    .8s
    ease
    .35s
    forwards;

  z-index: 3;

  user-select: none;
}


.company-name {
  position: absolute;

  left: 50%;

  bottom:
    clamp(18px, 4vh, 30px);

  transform:
    translateX(-50%);

  margin: 0;
  padding: 0;

  color: #7010B0;

  font-size:
    clamp(13px, 3.5vw, 18px);

  line-height: 1;

  letter-spacing: .03em;

  white-space: nowrap;

  text-align: center;

  z-index: 3;

  user-select: none;

  text-shadow:
    0 1px 5px rgba(112,16,176,.15);
}


.company-name h6 {
  margin: 0;
  padding: 0;

  font-size: inherit;

  line-height: inherit;

  font-weight: normal;

  color: #7010B0;
}


@keyframes spin {

  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }

}


@keyframes logoAnimation {

  0% {
    transform:
      translate(-50%, -50%)
      scale(0);

    opacity: 0;
  }

  50% {
    transform:
      translate(-50%, -50%)
      scale(1);

    opacity: 1;
  }

  100% {
    transform:
      translate(-50%, -50%)
      scale(1.2);

    opacity: 1;
  }

}


@keyframes messageAppear {

  from {
    opacity: 0;

    transform:
      translateX(-50%)
      translateY(10px);
  }

  to {
    opacity: 1;

    transform:
      translateX(-50%)
      translateY(0);
  }

}


@keyframes logoGlow {

  0%,
  100% {
    opacity: .12;

    transform:
      translate(-50%, -50%)
      scale(1);
  }

  50% {
    opacity: .035;

    transform:
      translate(-50%, -50%)
      scale(1.08);
  }

}


@media (max-width: 520px) {

  .logo-container {
    width: 90vw;

    padding:
      28px
      15px;
  }


  .logo-circle {
    width: 88px;
    height: 88px;

    border-width: 8px;
  }


  .logo-circle::before {
    width: 88px;
    height: 88px;
  }


  .logo-circle::after {
    width: 104px;
    height: 104px;
  }


  .logo-circle svg {
    width: 44px;
    height: 44px;
  }


  .logo-text {
    margin-top: 17px;

    font-size:
      clamp(40px, 12vw, 48px);
  }


  .message {
    bottom: 82px;

    font-size:
      clamp(19px, 5.5vw, 23px);
  }


  .company-name {
    bottom: 18px;
  }

}


@media (max-height: 620px) {

  .logo-container {
    padding:
      16px
      25px;
  }


  .logo-circle {
    width: 78px;
    height: 78px;

    border-width: 7px;
  }


  .logo-circle::before {
    width: 78px;
    height: 78px;
  }


  .logo-circle::after {
    width: 92px;
    height: 92px;
  }


  .logo-circle svg {
    width: 39px;
    height: 39px;
  }


  .logo-text {
    font-size: 42px;

    margin-top: 13px;
  }


  .message {
    bottom: 58px;

    font-size: 19px;
  }


  .company-name {
    bottom: 14px;
  }

}


@media (max-width: 360px) {

  .logo-container {
    width: 92vw;

    padding:
      24px
      10px;
  }


  .logo-circle {
    width: 74px;
    height: 74px;

    border-width: 7px;
  }


  .logo-circle::before {
    width: 74px;
    height: 74px;
  }


  .logo-circle::after {
    width: 88px;
    height: 88px;
  }


  .logo-circle svg {
    width: 37px;
    height: 37px;
  }


  .logo-text {
    font-size: 37px;
  }


  .message {
    font-size: 18px;
  }

}


@media (min-width: 768px) {

  .logo-circle {
    width: 100px;
    height: 100px;

    border-width: 10px;
  }


  .logo-circle::before {
    width: 100px;
    height: 100px;
  }


  .logo-circle::after {
    width: 118px;
    height: 118px;
  }


  .logo-circle svg {
    width: 50px;
    height: 50px;
  }


  .logo-text {
    font-size: 48px;
  }

}


@media (min-width: 1024px) {

  .logo-container {
    width: 520px;
  }


  .logo-circle {
    width: 100px;
    height: 100px;
  }


  .logo-text {
    font-size: 48px;
  }

}


@media (orientation: landscape) and (max-height: 500px) {

  .logo-container {
    padding:
      10px
      20px;
  }


  .logo-circle {
    width: 70px;
    height: 70px;

    border-width: 6px;
  }


  .logo-circle::before {
    width: 70px;
    height: 70px;
  }


  .logo-circle::after {
    width: 82px;
    height: 82px;
  }


  .logo-circle svg {
    width: 35px;
    height: 35px;
  }


  .logo-text {
    margin-top: 9px;

    font-size: 34px;
  }


  .message {
    bottom: 38px;

    font-size: 17px;
  }


  .company-name {
    bottom: 9px;

    font-size: 12px;
  }

}


@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;

    animation-iteration-count: 1 !important;

    scroll-behavior: auto !important;
  }

}


@supports (height: 100dvh) {

  body {
    min-height: 100dvh;
  }

}


@supports (padding: max(0px)) {

  body {
    padding-top:
      env(safe-area-inset-top);

    padding-bottom:
      env(safe-area-inset-bottom);

    padding-left:
      env(safe-area-inset-left);

    padding-right:
      env(safe-area-inset-right);
  }

}


@media (hover: none) {

  .logo-circle {
    cursor: default;
  }

}


@media (pointer: coarse) {

  .logo-circle {
    -webkit-user-select: none;
    user-select: none;
  }


  .logo-text {
    -webkit-user-select: none;
    user-select: none;
  }

}

</style>
</head>

<body>

<div class="logo-container">

  <div class="logo-circle">

    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 100 100"
      width="50"
      height="50"
      aria-hidden="true"
    >

      <path
        d="M50 15 A35 35 0 0 1 85 50"
        stroke="#7010B0"
        stroke-width="5"
        fill="none"
      />

    </svg>

  </div>

  <div class="logo-text">
    Looply
  </div>

</div>


<div
  class="message"
  id="message"
  style="display: none;"
>
  Cartas aos amigos ;)
</div>


<div class="company-name">

  <h6>
    MoissWorld
  </h6>

</div>


<script>

let soundPlayed = false;

let startupAudio = null;


window.addEventListener("load", () => {

  const isLoggedIn =
    localStorage.getItem("isLoggedIn") === "true";


  if (isLoggedIn) {

    window.location.replace("home.html");

    return;

  }


  const message =
    document.getElementById("message");


  if (message) {

    message.style.display = "block";

  }


  setTimeout(() => {

    window.location.replace("login.html");

  }, 7000);


  playStartupSound();

});


function playStartupSound() {

  if (soundPlayed) {

    return;

  }


  soundPlayed = true;


  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContext) {

      soundPlayed = false;

      return;

    }


    const audio =
      new AudioContext();


    startupAudio = audio;


    if (audio.state === "suspended") {

      audio.resume().catch(() => {});

    }


    const now =
      audio.currentTime;


    const compressor =
      audio.createDynamicsCompressor();


    compressor.threshold.value =
      -18;


    compressor.knee.value =
      12;


    compressor.ratio.value =
      5;


    compressor.attack.value =
      0.003;


    compressor.release.value =
      0.25;


    compressor.connect(
      audio.destination
    );


    createNote(
      audio,
      compressor,
      1046.50,
      now,
      0.48,
      0.15
    );


    createNote(
      audio,
      compressor,
      1318.51,
      now + 0.13,
      0.52,
      0.13
    );


    createNote(
      audio,
      compressor,
      1567.98,
      now + 0.27,
      0.62,
      0.16
    );


    createNote(
      audio,
      compressor,
      2093.00,
      now + 0.43,
      0.82,
      0.12
    );


    createNote(
      audio,
      compressor,
      2637.02,
      now + 0.46,
      0.65,
      0.045
    );


    setTimeout(() => {

      if (!startupAudio) {

        return;

      }


      try {

        startupAudio.close();

      } catch (error) {

      }


      startupAudio = null;

    }, 1800);


  } catch (error) {

    soundPlayed = false;

  }

}


function createNote(
  audio,
  destination,
  frequency,
  start,
  duration,
  volume
) {

  const oscillator =
    audio.createOscillator();


  const harmonic =
    audio.createOscillator();


  const gain =
    audio.createGain();


  const harmonicGain =
    audio.createGain();


  oscillator.type =
    "sine";


  harmonic.type =
    "triangle";


  oscillator.frequency.setValueAtTime(
    frequency,
    start
  );


  harmonic.frequency.setValueAtTime(
    frequency * 2,
    start
  );


  gain.gain.setValueAtTime(
    0.0001,
    start
  );


  gain.gain.exponentialRampToValueAtTime(
    volume,
    start + 0.018
  );


  gain.gain.exponentialRampToValueAtTime(
    volume * 0.62,
    start + duration * 0.38
  );


  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    start + duration
  );


  harmonicGain.gain.setValueAtTime(
    0.0001,
    start
  );


  harmonicGain.gain.exponentialRampToValueAtTime(
    volume * 0.12,
    start + 0.015
  );


  harmonicGain.gain.exponentialRampToValueAtTime(
    0.0001,
    start + duration * 0.85
  );


  oscillator.connect(
    gain
  );


  harmonic.connect(
    harmonicGain
  );


  gain.connect(
    destination
  );


  harmonicGain.connect(
    destination
  );


  oscillator.start(
    start
  );


  harmonic.start(
    start
  );


  oscillator.stop(
    start + duration + 0.05
  );


  harmonic.stop(
    start + duration + 0.05
  );

}


const interactionEvents = [
  "pointerdown",
  "touchstart",
  "keydown"
];


interactionEvents.forEach(
  eventName => {

    window.addEventListener(
      eventName,
      () => {

        if (!soundPlayed) {

          playStartupSound();

        }

      },
      {
        once: true,
        passive: true
      }
    );

  }
);

</script>

</body>
</html>
