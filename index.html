<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07030d">
  <meta name="description" content="Looply — Cartas aos amigos.">
  <title>Looply</title>
  <link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#07030d;
      --bg-2:#12051d;
      --neon:#b84dff;
      --neon-2:#d78aff;
      --neon-3:#8b2be2;
      --text:#fff;
      --muted:rgba(255,255,255,.58);
      --glass:rgba(255,255,255,.045);
      --border:rgba(216,138,255,.25);
    }

    *{box-sizing:border-box}

    html,body{
      width:100%;
      min-height:100%;
      margin:0;
    }

    body{
      min-height:100svh;
      padding:clamp(18px,4vw,40px);
      overflow:hidden;
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
      isolation:isolate;
      background:
        radial-gradient(circle at 50% 42%, rgba(184,77,255,.17), transparent 24%),
        radial-gradient(circle at 15% 15%, rgba(139,43,226,.11), transparent 28%),
        radial-gradient(circle at 85% 85%, rgba(215,138,255,.08), transparent 30%),
        linear-gradient(145deg,var(--bg),var(--bg-2));
      color:var(--text);
      font-family:'Cabin Sketch',cursive;
      text-align:center;
    }

    /* Ambient depth */
    body::before,
    body::after{
      content:"";
      position:absolute;
      inset:-30%;
      z-index:-3;
      pointer-events:none;
    }

    body::before{
      background:
        radial-gradient(circle, rgba(184,77,255,.11) 0 1px, transparent 1.5px);
      background-size:34px 34px;
      opacity:.34;
      transform:rotate(8deg);
      animation:drift 18s linear infinite;
    }

    body::after{
      background:
        conic-gradient(from 180deg at 50% 50%,
          transparent 0deg,
          rgba(184,77,255,.06) 80deg,
          transparent 150deg,
          rgba(215,138,255,.04) 230deg,
          transparent 320deg);
      filter:blur(12px);
      animation:aurora 10s ease-in-out infinite alternate;
    }

    .orb{
      position:absolute;
      width:clamp(180px,28vw,360px);
      aspect-ratio:1;
      border-radius:50%;
      filter:blur(60px);
      opacity:.13;
      pointer-events:none;
      z-index:-2;
      animation:float 8s ease-in-out infinite;
    }

    .orb.one{background:var(--neon);top:-12%;left:-8%}
    .orb.two{background:#7b20cc;right:-12%;bottom:-18%;animation-delay:-3s}
    .orb.three{background:#e3a5ff;left:35%;bottom:-25%;width:220px;opacity:.07;animation-delay:-5s}

    .top-line{
      position:absolute;
      top:clamp(16px,4vw,34px);
      left:50%;
      width:min(86vw,520px);
      height:1px;
      transform:translateX(-50%);
      background:linear-gradient(90deg,transparent,rgba(215,138,255,.65),transparent);
      opacity:.55;
    }

    .logo-container{
      position:relative;
      width:min(90vw,520px);
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      padding:clamp(22px,6vw,44px);
      border:1px solid var(--border);
      border-radius:32px;
      background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.018));
      box-shadow:
        0 30px 90px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.08),
        0 0 45px rgba(184,77,255,.07);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      animation:logoAnimation 1.25s cubic-bezier(.16,1,.3,1) forwards;
    }

    .logo-container::before{
      content:"";
      position:absolute;
      inset:1px;
      border-radius:31px;
      pointer-events:none;
      background:linear-gradient(135deg,rgba(255,255,255,.07),transparent 42%,rgba(184,77,255,.05));
    }

    .logo-circle{
      width:clamp(92px,24vw,132px);
      height:clamp(92px,24vw,132px);
      position:relative;
      display:flex;
      justify-content:center;
      align-items:center;
      border:clamp(5px,1vw,8px) solid var(--neon);
      border-radius:50%;
      box-shadow:
        0 0 8px rgba(184,77,255,.9),
        0 0 28px rgba(184,77,255,.55),
        0 0 65px rgba(184,77,255,.18),
        inset 0 0 24px rgba(184,77,255,.16);
      animation:spin 3s linear infinite;
      background:radial-gradient(circle,rgba(184,77,255,.12),transparent 65%);
    }

    .logo-circle::before{
      content:"";
      position:absolute;
      inset:-15px;
      border:1px solid rgba(215,138,255,.22);
      border-radius:50%;
      animation:pulseRing 2.2s ease-in-out infinite;
    }

    .logo-circle::after{
      content:"";
      position:absolute;
      width:8px;
      height:8px;
      top:-7px;
      left:50%;
      transform:translateX(-50%);
      border-radius:50%;
      background:var(--neon-2);
      box-shadow:0 0 14px var(--neon-2),0 0 30px var(--neon);
    }

    .logo-circle svg{
      width:46%;
      height:46%;
      filter:drop-shadow(0 0 8px var(--neon));
    }

    .logo-circle path{
      stroke:var(--neon-2);
    }

    .logo-text{
      margin-top:clamp(18px,4vw,25px);
      font-size:clamp(42px,11vw,68px);
      line-height:1;
      font-weight:bold;
      letter-spacing:.02em;
      color:var(--neon-2);
      text-shadow:
        0 0 5px rgba(215,138,255,.9),
        0 0 18px rgba(184,77,255,.65),
        0 0 42px rgba(184,77,255,.25);
    }

    .message{
      position:absolute;
      left:50%;
      bottom:clamp(76px,12vh,104px);
      width:min(90vw,560px);
      transform:translateX(-50%);
      font-size:clamp(20px,5vw,27px);
      line-height:1.2;
      color:var(--neon-2);
      font-weight:bold;
      text-shadow:0 0 12px rgba(184,77,255,.65);
      opacity:0;
      animation:messageIn .9s ease .55s forwards;
    }

    .company-name{
      position:absolute;
      left:50%;
      bottom:clamp(20px,4vh,34px);
      transform:translateX(-50%);
      color:var(--muted);
      font-size:clamp(13px,3.5vw,17px);
      letter-spacing:.16em;
      text-transform:uppercase;
    }

    .company-name h6{
      margin:0;
      font-size:inherit;
      font-weight:normal;
    }

    .loading{
      position:absolute;
      bottom:clamp(52px,8vh,70px);
      left:50%;
      transform:translateX(-50%);
      width:min(62vw,250px);
      height:2px;
      overflow:hidden;
      border-radius:10px;
      background:rgba(255,255,255,.08);
    }

    .loading::after{
      content:"";
      position:absolute;
      left:0;
      top:0;
      height:100%;
      width:100%;
      transform-origin:left;
      background:linear-gradient(90deg,var(--neon-3),var(--neon-2));
      box-shadow:0 0 12px var(--neon);
      animation:progress 4.9s cubic-bezier(.4,0,.2,1) forwards;
    }

    @keyframes spin{
      from{transform:rotate(0deg)}
      to{transform:rotate(360deg)}
    }

    @keyframes logoAnimation{
      0%{transform:translateY(24px) scale(.68);opacity:0;filter:blur(10px)}
      65%{transform:translateY(0) scale(1.025);opacity:1;filter:blur(0)}
      100%{transform:translateY(0) scale(1);opacity:1;filter:blur(0)}
    }

    @keyframes messageIn{
      from{opacity:0;transform:translate(-50%,10px)}
      to{opacity:1;transform:translate(-50%,0)}
    }

    @keyframes pulseRing{
      0%,100%{transform:scale(1);opacity:.35}
      50%{transform:scale(1.08);opacity:.08}
    }

    @keyframes drift{
      from{transform:translate3d(0,0,0) rotate(8deg)}
      to{transform:translate3d(34px,22px,0) rotate(8deg)}
    }

    @keyframes aurora{
      from{transform:rotate(-4deg) scale(1)}
      to{transform:rotate(4deg) scale(1.08)}
    }

    @keyframes float{
      0%,100%{transform:translate3d(0,0,0)}
      50%{transform:translate3d(0,-22px,0)}
    }

    @keyframes progress{
      from{transform:scaleX(0)}
      to{transform:scaleX(1)}
    }

    @media (max-width:520px){
      .logo-container{
        border-radius:25px;
        padding:34px 20px;
      }

      .logo-container::before{border-radius:24px}

      .logo-circle::before{inset:-11px}

      .message{
        bottom:82px;
      }
    }

    @media (max-height:620px){
      .logo-container{padding:18px 28px}
      .logo-circle{
        width:78px;
        height:78px;
      }
      .logo-text{font-size:42px;margin-top:13px}
      .message{bottom:58px}
      .company-name{bottom:14px}
      .loading{bottom:43px}
    }

    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        scroll-behavior:auto !important;
      }
    }
  </style>
</head>

<body>
  <div class="orb one"></div>
  <div class="orb two"></div>
  <div class="orb three"></div>
  <div class="top-line"></div>

  <div class="logo-container">
    <div class="logo-circle">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M50 15 A35 35 0 0 1 85 50" stroke="#b84dff" stroke-width="5" fill="none"/>
      </svg>
    </div>
    <div class="logo-text">Looply</div>
  </div>

  <div class="message" id="message" style="display:none;">
    Cartas aos amigos ;)
  </div>

  <div class="loading" aria-hidden="true"></div>

  <div class="company-name">
    <h6>MoissWorld</h6>
  </div>

  <script>
    window.addEventListener('load', () => {
      /*
       * Mantida a lógica original, mas corrigida para a chave usada
       * pelo login atual: "isLoggedIn".
       *
       * Redirecionamento original: 7 segundos.
       * Novo redirecionamento: 4 segundos (redução de 3 segundos).
       */
      if (localStorage.getItem("isLoggedIn") === "true") {
        window.location.replace("home.html");
      } else {
        document.getElementById("message").style.display = "block";

        setTimeout(() => {
          window.location.replace("login.html");
        }, 4000);
      }
    });
  </script>
</body>
</html>
