<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home - MoissWorld</title>

    <!--
        QUILLEN
        A família Quillen é de Storytype Studio / Heru Utama Putra.
        Para usar a fonte localmente, coloque "Quillen.otf" na mesma
        pasta deste HTML. A página também possui fallback elegante.
        Fonte consultada: Fonts2u / FontSpace.
    -->

    <style>
        /* =========================================================
           FONTE
           ========================================================= */

        @font-face {
            font-family: "Quillen";
            src:
                local("Quillen"),
                url("Quillen.otf") format("opentype");
            font-display: swap;
            font-style: normal;
            font-weight: 400;
        }


        /* =========================================================
           CONFIGURAÇÃO GERAL
           ========================================================= */

        :root {
            --bg: #05030a;
            --bg-soft: #0b0712;

            --neon: #b84dff;
            --neon-strong: #d78aff;
            --neon-soft: rgba(184, 77, 255, 0.14);
            --neon-border: rgba(184, 77, 255, 0.65);

            --text: #f6eaff;
            --muted: #bda9c9;

            --danger: #ff526d;

            --glass: rgba(12, 7, 19, 0.82);
            --glass-strong: rgba(10, 5, 16, 0.96);

            --radius: 22px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(184, 77, 255, 0.20),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 0% 100%,
                    rgba(126, 42, 255, 0.12),
                    transparent 35%
                ),
                var(--bg);

            color: var(--text);

            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            padding:
                max(24px, env(safe-area-inset-top))
                max(14px, env(safe-area-inset-right))
                max(90px, env(safe-area-inset-bottom))
                max(14px, env(safe-area-inset-left));

            overflow-x: hidden;
        }


        /* brilho ambiente */

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    120deg,
                    transparent 0%,
                    rgba(184, 77, 255, 0.025) 50%,
                    transparent 100%
                );

            z-index: -1;
        }


        /* =========================================================
           CONTAINER PRINCIPAL
           ========================================================= */

        .container {
            width: min(100%, 680px);

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.035),
                    rgba(255,255,255,0.012)
                ),
                var(--glass);

            border:
                1px solid
                var(--neon-border);

            border-radius: var(--radius);

            padding: clamp(20px, 5vw, 34px);

            box-shadow:
                0 0 0 1px rgba(184, 77, 255, 0.04),
                0 0 35px rgba(184, 77, 255, 0.12),
                0 25px 80px rgba(0, 0, 0, 0.55);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            text-align: center;

            animation: aparecer 0.45s ease both;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =========================================================
           FOTO DO USUÁRIO
           ========================================================= */

        .profile-wrap {
            display: flex;
            justify-content: center;
            align-items: center;

            margin-bottom: 15px;
        }

        .profile-ring {
            position: relative;

            width: clamp(128px, 27vw, 170px);
            height: clamp(128px, 27vw, 170px);

            padding: 5px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    var(--neon-strong),
                    var(--neon),
                    #6f19c9
                );

            box-shadow:
                0 0 18px rgba(184, 77, 255, 0.55),
                0 0 50px rgba(184, 77, 255, 0.18);
        }

        .profile-ring::after {
            content: "";

            position: absolute;
            inset: -7px;

            border-radius: 50%;

            border:
                1px solid
                rgba(216, 138, 255, 0.22);

            animation: pulsar 2.8s ease-in-out infinite;
        }

        @keyframes pulsar {
            0%, 100% {
                opacity: 0.35;
                transform: scale(0.98);
            }

            50% {
                opacity: 0.8;
                transform: scale(1.025);
            }
        }

        .profile-pic {
            display: block;

            width: 100%;
            height: 100%;

            border-radius: 50%;

            object-fit: cover;

            background: #10091a;

            border: 3px solid #09040d;
        }


        /* =========================================================
           CABEÇALHO
           ========================================================= */

        .eyebrow {
            color: var(--neon-strong);

            font-size: 12px;
            font-weight: 700;

            letter-spacing: 0.20em;
            text-transform: uppercase;

            margin-bottom: 6px;

            opacity: 0.9;
        }

        h2 {
            color: var(--text);

            font-size: clamp(25px, 6vw, 34px);

            line-height: 1.1;

            margin-bottom: 8px;

            text-shadow:
                0 0 18px rgba(184, 77, 255, 0.28);
        }

        .subtitulo {
            color: var(--muted);

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 24px;
        }


        /* =========================================================
           CABEÇALHO DA LISTA
           ========================================================= */

        .lista-topo {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 12px;

            margin-bottom: 10px;
        }

        .lista-titulo {
            color: var(--text);

            font-size: 14px;
            font-weight: 700;

            letter-spacing: 0.05em;

            text-align: left;
        }

        .contador {
            flex-shrink: 0;

            color: var(--neon-strong);

            background: var(--neon-soft);

            border:
                1px solid
                rgba(184, 77, 255, 0.30);

            border-radius: 999px;

            padding: 5px 10px;

            font-size: 12px;
            font-weight: 700;
        }


        /* =========================================================
           LISTA DE CARTAS
           ========================================================= */

        .cartas-container {
            width: 100%;

            max-height: min(55vh, 540px);

            overflow-y: auto;
            overflow-x: hidden;

            padding: 3px 4px 3px 1px;

            scrollbar-width: thin;
            scrollbar-color:
                var(--neon)
                transparent;
        }

        .cartas-container::-webkit-scrollbar {
            width: 6px;
        }

        .cartas-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .cartas-container::-webkit-scrollbar-thumb {
            background: var(--neon);
            border-radius: 999px;
        }


        /* =========================================================
           CARTA DA LISTA
           ========================================================= */

        .carta {
            position: relative;

            width: 100%;

            display: flex;

            align-items: center;

            gap: 14px;

            background:
                linear-gradient(
                    105deg,
                    rgba(184, 77, 255, 0.10),
                    rgba(255,255,255,0.018)
                );

            border:
                1px solid
                rgba(184, 77, 255, 0.34);

            border-radius: 16px;

            padding: 14px 14px 14px 16px;

            margin-bottom: 9px;

            cursor: pointer;

            color: var(--text);

            text-align: left;

            transition:
                transform 0.18s ease,
                border-color 0.18s ease,
                background 0.18s ease,
                box-shadow 0.18s ease;
        }

        .carta::before {
            content: "";

            width: 3px;
            min-width: 3px;
            height: 32px;

            border-radius: 999px;

            background:
                linear-gradient(
                    to bottom,
                    var(--neon-strong),
                    var(--neon)
                );

            opacity: 0.55;

            transition:
                height 0.18s ease,
                opacity 0.18s ease;
        }

        .carta:hover {
            transform: translateY(-2px);

            background:
                linear-gradient(
                    105deg,
                    rgba(184, 77, 255, 0.18),
                    rgba(255,255,255,0.03)
                );

            border-color:
                rgba(216, 138, 255, 0.75);

            box-shadow:
                0 7px 25px rgba(184, 77, 255, 0.10);
        }

        .carta:hover::before {
            height: 42px;
            opacity: 1;
        }

        .carta:active {
            transform: scale(0.985);
        }

        .carta-info {
            flex: 1;
            min-width: 0;
        }

        .carta-numero {
            display: block;

            color: var(--neon-strong);

            font-family:
                system-ui,
                -apple-system,
                sans-serif;

            font-size: 10px;
            font-weight: 800;

            letter-spacing: 0.14em;

            margin-bottom: 4px;

            opacity: 0.85;
        }

        .carta-titulo {
            display: block;

            color: var(--text);

            /*
             * Quillen é aplicada principalmente ao título
             * da carta, como solicitado.
             */
            font-family:
                "Quillen",
                Georgia,
                "Times New Roman",
                serif;

            font-size: clamp(17px, 4vw, 21px);

            line-height: 1.25;

            letter-spacing: 0.01em;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }


        /* =========================================================
           CHECK
           ========================================================= */

        .check {
            width: 34px;
            height: 34px;

            min-width: 34px;

            display: grid;
            place-items: center;

            border-radius: 50%;

            color: #7b667f;

            background: rgba(255,255,255,0.035);

            border:
                1px solid
                rgba(255,255,255,0.07);

            font-size: 15px;

            transition:
                0.2s ease;
        }

        .check.lida {
            color: #fff;

            background:
                rgba(184, 77, 255, 0.22);

            border-color:
                rgba(216, 138, 255, 0.65);

            box-shadow:
                0 0 12px rgba(184, 77, 255, 0.30);
        }


        /* =========================================================
           RODAPÉ / BOTÃO SAIR
           ========================================================= */

        .acoes {
            display: flex;

            justify-content: center;

            margin-top: 22px;
        }

        .btn-logout {
            min-width: 140px;

            padding: 12px 22px;

            font-size: 15px;
            font-weight: 800;

            border:
                1px solid
                rgba(216, 138, 255, 0.70);

            background:
                rgba(184, 77, 255, 0.14);

            color: #f9eaff;

            cursor: pointer;

            border-radius: 999px;

            font-family:
                system-ui,
                -apple-system,
                sans-serif;

            transition:
                0.2s ease;
        }

        .btn-logout:hover {
            background:
                var(--neon);

            color: #fff;

            box-shadow:
                0 0 22px rgba(184, 77, 255, 0.38);
        }


        /* =========================================================
           BOTÃO FOR YOU
           ========================================================= */

        .btn-para-voce {
            position: fixed;

            right: max(16px, env(safe-area-inset-right));
            bottom: max(16px, env(safe-area-inset-bottom));

            min-height: 48px;

            padding: 0 19px;

            font-size: 14px;
            font-weight: 800;

            border:
                1px solid
                rgba(216, 138, 255, 0.75);

            background:
                rgba(10, 5, 16, 0.88);

            color: var(--neon-strong);

            cursor: pointer;

            border-radius: 999px;

            font-family:
                system-ui,
                -apple-system,
                sans-serif;

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            box-shadow:
                0 8px 30px rgba(0,0,0,0.35);

            transition:
                0.2s ease;

            z-index: 100;
        }

        .btn-para-voce:hover {
            background: var(--neon);

            color: #fff;

            box-shadow:
                0 0 24px rgba(184, 77, 255, 0.45);
        }


        /* =========================================================
           MODAL
           ========================================================= */

        .modal {
            position: fixed;

            inset: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 16px;

            background:
                rgba(2, 1, 4, 0.78);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            opacity: 0;
            visibility: hidden;

            pointer-events: none;

            transition:
                opacity 0.22s ease,
                visibility 0.22s ease;

            z-index: 1000;
        }

        .modal.aberto {
            opacity: 1;

            visibility: visible;

            pointer-events: auto;
        }


        /* =========================================================
           JANELA DA CARTA
           ========================================================= */

        .modal-content {
            width: min(100%, 720px);

            max-height: min(88vh, 820px);

            display: flex;

            flex-direction: column;

            background:
                linear-gradient(
                    145deg,
                    rgba(23, 12, 32, 0.98),
                    rgba(6, 3, 10, 0.99)
                );

            border:
                1px solid
                rgba(216, 138, 255, 0.60);

            border-radius: 24px;

            box-shadow:
                0 0 0 1px rgba(184, 77, 255, 0.06),
                0 0 60px rgba(184, 77, 255, 0.18),
                0 30px 100px rgba(0,0,0,0.75);

            overflow: hidden;

            transform:
                translateY(15px)
                scale(0.97);

            transition:
                transform 0.24s ease;
        }

        .modal.aberto .modal-content {
            transform:
                translateY(0)
                scale(1);
        }


        /* =========================================================
           CABEÇALHO DO MODAL
           ========================================================= */

        .modal-header {
            display: flex;

            align-items: flex-start;

            justify-content: space-between;

            gap: 16px;

            padding:
                20px
                20px
                15px;

            border-bottom:
                1px solid
                rgba(184, 77, 255, 0.16);
        }

        .modal-label {
            color: var(--neon-strong);

            font-family:
                system-ui,
                -apple-system,
                sans-serif;

            font-size: 10px;
            font-weight: 800;

            letter-spacing: 0.16em;

            text-transform: uppercase;

            margin-bottom: 6px;
        }

        .modal-content h3 {
            color: #fff;

            font-family:
                "Quillen",
                Georgia,
                serif;

            font-size: clamp(23px, 5vw, 32px);

            line-height: 1.15;

            font-weight: 400;

            margin: 0;
        }


        /* =========================================================
           BOTÃO X
           ========================================================= */

        .modal-fechar-x {
            flex-shrink: 0;

            width: 40px;
            height: 40px;

            border-radius: 50%;

            border:
                1px solid
                rgba(216, 138, 255, 0.25);

            background:
                rgba(255,255,255,0.035);

            color: var(--muted);

            cursor: pointer;

            font-size: 22px;

            display: grid;
            place-items: center;

            transition: 0.18s ease;
        }

        .modal-fechar-x:hover {
            color: #fff;

            background:
                rgba(184, 77, 255, 0.18);

            border-color:
                rgba(216, 138, 255, 0.65);
        }


        /* =========================================================
           TEXTO DA CARTA
           ========================================================= */

        .modal-texto {
            color: #f5edf9;

            /*
             * Quillen também é usada no conteúdo.
             * Se o arquivo de fonte não estiver presente,
             * Georgia assume automaticamente.
             */
            font-family:
                "Quillen",
                Georgia,
                "Times New Roman",
                serif;

            font-size: clamp(17px, 4vw, 20px);

            line-height: 1.75;

            white-space: pre-wrap;

            overflow-y: auto;

            flex: 1;

            min-height: 0;

            padding:
                22px 22px 12px;

            word-wrap: break-word;

            overflow-wrap: anywhere;

            scrollbar-width: thin;

            scrollbar-color:
                var(--neon)
                transparent;
        }

        .modal-texto::-webkit-scrollbar {
            width: 6px;
        }

        .modal-texto::-webkit-scrollbar-track {
            background: transparent;
        }

        .modal-texto::-webkit-scrollbar-thumb {
            background: var(--neon);
            border-radius: 999px;
        }


        /* =========================================================
           RODAPÉ DO MODAL
           ========================================================= */

        .modal-footer {
            display: flex;

            justify-content: flex-end;

            padding:
                14px
                20px
                20px;

            border-top:
                1px solid
                rgba(184, 77, 255, 0.12);
        }

        .fechar button {
            min-height: 44px;

            padding: 0 20px;

            border:
                1px solid
                rgba(216, 138, 255, 0.65);

            background:
                var(--neon);

            color: #fff;

            border-radius: 999px;

            cursor: pointer;

            font-family:
                system-ui,
                -apple-system,
                sans-serif;

            font-size: 14px;

            font-weight: 800;

            transition: 0.18s ease;
        }

        .fechar button:hover {
            background:
                var(--neon-strong);

            box-shadow:
                0 0 20px rgba(184, 77, 255, 0.35);
        }


        /* =========================================================
           CARREGAMENTO
           ========================================================= */

        .carregando {
            color: var(--neon-strong);

            padding: 25px;

            text-align: center;

            font-family:
                system-ui,
                -apple-system,
                sans-serif;
        }


        /* =========================================================
           ERRO
           ========================================================= */

        .erro-carta {
            color: #ff9aaa !important;

            font-family:
                system-ui,
                -apple-system,
                sans-serif !important;

            font-size: 14px !important;

            line-height: 1.6 !important;
        }


        /* =========================================================
           CELULAR
           ========================================================= */

        @media (max-width: 600px) {

            body {
                padding-top: 18px;
            }

            .container {
                border-radius: 19px;

                padding: 20px 14px;
            }

            .profile-ring {
                width: 142px;
                height: 142px;
            }

            .cartas-container {
                max-height: 57vh;
            }

            .carta {
                padding: 13px 11px 13px 12px;

                gap: 9px;

                border-radius: 14px;
            }

            .carta-titulo {
                font-size: 17px;
            }

            .check {
                width: 32px;
                height: 32px;
                min-width: 32px;
            }

            .modal {
                padding: 9px;
            }

            .modal-content {
                max-height: 92vh;

                border-radius: 20px;
            }

            .modal-header {
                padding:
                    16px
                    15px
                    13px;
            }

            .modal-texto {
                padding:
                    18px
                    15px
                    10px;

                font-size: 17px;

                line-height: 1.68;
            }

            .modal-footer {
                padding:
                    11px
                    15px
                    15px;
            }

            .fechar button {
                width: 100%;
            }

            .btn-para-voce {
                min-height: 45px;

                padding: 0 16px;
            }
        }


        /* =========================================================
           REDUÇÃO DE MOVIMENTO
           ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;

                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;

                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================================
         CONTAINER PRINCIPAL
         ========================================================= -->

    <div class="container">

        <div class="profile-wrap">
            <div class="profile-ring">

                <img
                    src=""
                    alt="Foto de Perfil"
                    class="profile-pic"
                    id="profilePic"
                >

            </div>
        </div>


        <div class="eyebrow">
            MoissWorld
        </div>

        <h2 id="welcomeMessage"></h2>

        <p class="subtitulo">
            Taí as cartas que te escrevi, best(a)
        </p>


        <!-- =====================================================
             TOPO DA LISTA
             ===================================================== -->

        <div class="lista-topo">

            <span class="lista-titulo">
                SUAS CARTAS
            </span>

            <span
                class="contador"
                id="contador"
            >
                0/50 lidas
            </span>

        </div>


        <!-- =====================================================
             LISTA DE CARTAS
             ===================================================== -->

        <div
            class="cartas-container"
            id="cartasContainer"
        >
            <div class="carregando">
                Carregando cartas...
            </div>
        </div>


        <!-- =====================================================
             BOTÃO SAIR
             ===================================================== -->

        <div class="acoes">

            <button
                class="btn-logout"
                onclick="logout()"
            >
                Sair
            </button>

        </div>

    </div>


    <!-- =========================================================
         BOTÃO FOR YOU
         ========================================================= -->

    <button
        class="btn-para-voce"
        onclick="redirectToYou()"
    >
        for you
    </button>


    <!-- =========================================================
         MODAL DA CARTA
         ========================================================= -->

    <div
        class="modal"
        id="modal"
        onclick="fecharAoClicarFora(event)"
        aria-hidden="true"
    >

        <div
            class="modal-content"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modalTitulo"
            onclick="event.stopPropagation()"
        >

            <div class="modal-header">

                <div>

                    <div class="modal-label">
                        Carta
                    </div>

                    <h3 id="modalTitulo">
                        Carregando...
                    </h3>

                </div>

                <button
                    class="modal-fechar-x"
                    onclick="fecharCarta()"
                    aria-label="Fechar carta"
                >
                    ×
                </button>

            </div>


            <div
                class="modal-texto"
                id="modalTexto"
            >
                Carregando carta...
            </div>


            <div class="modal-footer">

                <div class="fechar">

                    <button
                        onclick="fecharCarta()"
                    >
                        Fechar carta
                    </button>

                </div>

            </div>

        </div>

    </div>


    <script>

        /* =========================================================
           CONFIGURAÇÃO
           ========================================================= */

        const TOTAL_CARTAS = 50;

        /*
         * O estado das cartas é salvo no localStorage.
         *
         * Isso é deliberado: uma página web não pode criar/
         * alterar silenciosamente um arquivo no dispositivo do
         * usuário. O localStorage é o armazenamento persistente
         * próprio do navegador e continua existindo depois que
         * a página é fechada.
         */

        const STORAGE_PREFIX =
            "moissworld_cartas_lidas_";


        /* =========================================================
           INICIALIZAÇÃO
           ========================================================= */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                /*
                 * Verifica se o usuário está logado.
                 */

                if (
                    !localStorage.getItem(
                        "isLoggedIn"
                    )
                ) {

                    window.location.href =
                        "login.html";

                    return;
                }


                /*
                 * Obtém os dados do usuário.
                 */

                const username =
                    localStorage.getItem(
                        "username"
                    );

                const profilePic =
                    localStorage.getItem(
                        "profilePic"
                    );


                /*
                 * Atualiza a interface.
                 */

                document.getElementById(
                    "welcomeMessage"
                ).innerText =
                    `Bem-vindo(a), ${username}`;


                /*
                 * Foto do usuário.
                 */

                if (profilePic) {

                    document.getElementById(
                        "profilePic"
                    ).src = profilePic;

                }


                /*
                 * Carrega as 50 cartas.
                 */

                carregarCartas(username);

            }
        );


        /* =========================================================
           CHAVE DE PERSISTÊNCIA
           ========================================================= */

        function obterChaveStorage(username) {

            return (
                STORAGE_PREFIX +
                encodeURIComponent(username || "usuario")
            );

        }


        /* =========================================================
           LER ESTADO DAS CARTAS
           ========================================================= */

        function obterCartasLidas(username) {

            const chave =
                obterChaveStorage(username);

            try {

                const salvo =
                    localStorage.getItem(chave);

                if (!salvo) {
                    return {};
                }

                const dados =
                    JSON.parse(salvo);

                if (
                    dados &&
                    typeof dados === "object"
                ) {
                    return dados;
                }

                return {};

            } catch (erro) {

                console.warn(
                    "Não foi possível ler o estado das cartas:",
                    erro
                );

                return {};
            }
        }


        /* =========================================================
           SALVAR ESTADO DAS CARTAS
           ========================================================= */

        function salvarCartasLidas(
            username,
            cartasLidas
        ) {

            const chave =
                obterChaveStorage(username);

            try {

                /*
                 * Salva imediatamente.
                 */

                localStorage.setItem(
                    chave,
                    JSON.stringify(cartasLidas)
                );

                atualizarContador(
                    cartasLidas
                );

            } catch (erro) {

                console.error(
                    "Não foi possível salvar o estado das cartas:",
                    erro
                );

            }
        }


        /* =========================================================
           MARCAR COMO LIDA
           ========================================================= */

        function marcarComoLida(
            username,
            numero
        ) {

            const cartasLidas =
                obterCartasLidas(username);

            cartasLidas[numero] = true;

            /*
             * Salvamento instantâneo.
             */

            salvarCartasLidas(
                username,
                cartasLidas
            );

            const check =
                document.getElementById(
                    `check${numero}`
                );

            if (check) {

                check.classList.add(
                    "lida"
                );

            }
        }


        /* =========================================================
           CONTADOR
           ========================================================= */

        function atualizarContador(
            cartasLidas
        ) {

            const contador =
                document.getElementById(
                    "contador"
                );

            if (!contador) {
                return;
            }

            const quantidade =
                Object.keys(cartasLidas)
                    .filter(
                        numero =>
                            cartasLidas[numero] === true
                    )
                    .length;

            contador.innerText =
                `${quantidade}/${TOTAL_CARTAS} lidas`;

        }


        /* =========================================================
           CARREGAR LISTA DE CARTAS
           ========================================================= */

        function carregarCartas(username) {

            const cartasContainer =
                document.getElementById(
                    "cartasContainer"
                );


            /*
             * Recupera imediatamente o estado salvo.
             */

            const cartasLidas =
                obterCartasLidas(username);


            /*
             * Atualiza contador.
             */

            atualizarContador(
                cartasLidas
            );


            /*
             * Limpa o carregamento.
             */

            cartasContainer.innerHTML = "";


            /*
             * Mantém exatamente o padrão original:
             *
             * usuarioCarta1.txt
             * usuarioCarta2.txt
             * ...
             * usuarioCarta50.txt
             */

            for (
                let i = 1;
                i <= TOTAL_CARTAS;
                i++
            ) {

                const cartaDiv =
                    document.createElement("div");


                cartaDiv.className =
                    "carta";


                cartaDiv.dataset.numero =
                    i;


                /*
                 * Estado persistente.
                 */

                const lida =
                    cartasLidas[i] === true;


                /*
                 * Começamos mostrando Carta XX.
                 * Assim que o TXT for carregado,
                 * o título passa a ser o começo da carta.
                 */

                cartaDiv.innerHTML = `

                    <div class="carta-info">

                        <span class="carta-numero">
                            CARTA ${String(i).padStart(2, "0")}
                        </span>

                        <span
                            class="carta-titulo"
                            id="tituloCarta${i}"
                        >
                            Carregando título...
                        </span>

                    </div>

                    <span
                        class="check ${lida ? "lida" : ""}"
                        id="check${i}"
                        aria-label="${lida ? "Carta lida" : "Carta não lida"}"
                    >
                        ✔
                    </span>

                `;


                /*
                 * Clique abre a carta no modal.
                 */

                cartaDiv.addEventListener(
                    "click",
                    function () {

                        const nomeArquivo =
                            `${username}carta${i}.txt`;

                        abrirCarta(
                            i,
                            nomeArquivo
                        );

                    }
                );


                cartasContainer.appendChild(
                    cartaDiv
                );


                /*
                 * O título é buscado do TXT sem impedir
                 * o restante da página de funcionar.
                 */

                carregarTituloDaCarta(
                    i,
                    `${username}carta${i}.txt`
                );

            }

        }


        /* =========================================================
           EXTRAIR TÍTULO DO COMEÇO DA CARTA
           ========================================================= */

        function gerarTituloDoTexto(texto) {

            /*
             * Remove espaços/quebras desnecessárias do início.
             */

            const limpo =
                texto
                    .replace(/^\s+/, "")
                    .replace(/\r/g, "");


            if (!limpo) {

                return "Carta sem conteúdo";

            }


            /*
             * A regra solicitada:
             *
             * pula aproximadamente as primeiras 5–7 palavras.
             *
             * Aqui usamos 6 como ponto central.
             */

            const palavras =
                limpo
                    .split(/\s+/)
                    .filter(Boolean);


            if (palavras.length <= 6) {

                return palavras
                    .slice(0, 9)
                    .join(" ");

            }


            /*
             * Pula as primeiras seis palavras
             * e usa as próximas até formar um título.
             */

            let titulo =
                palavras
                    .slice(6, 14)
                    .join(" ");


            /*
             * Limpeza visual.
             */

            titulo =
                titulo
                    .replace(/\s+/g, " ")
                    .trim();


            /*
             * Evita título vazio.
             */

            if (!titulo) {

                titulo =
                    palavras
                        .slice(0, 8)
                        .join(" ");

            }


            /*
             * Mantém pontuação e acentos originais.
             * Só acrescentamos reticências quando
             * realmente cortamos o trecho.
             */

            const houveCorte =
                palavras.length > 14;

            if (
                houveCorte &&
                !/[.!?…]$/.test(titulo)
            ) {

                titulo += "…";

            }


            return titulo;

        }


        /* =========================================================
           CARREGAR TÍTULO DO TXT
           ========================================================= */

        async function carregarTituloDaCarta(
            numero,
            nomeArquivo
        ) {

            const elemento =
                document.getElementById(
                    `tituloCarta${numero}`
                );


            if (!elemento) {
                return;
            }


            try {

                const resposta =
                    await fetch(
                        encodeURI(nomeArquivo),
                        {
                            method: "GET",
                            cache: "no-cache"
                        }
                    );


                if (!resposta.ok) {

                    throw new Error(
                        `HTTP ${resposta.status}`
                    );

                }


                const conteudo =
                    await resposta.text();


                const titulo =
                    gerarTituloDoTexto(
                        conteudo
                    );


                elemento.innerText =
                    titulo;


            } catch (erro) {

                /*
                 * Se não conseguir ler o arquivo,
                 * não quebramos a carta.
                 */

                elemento.innerText =
                    "Carta " +
                    String(numero).padStart(2, "0");

            }

        }


        /* =========================================================
           ABRIR CARTA
           ========================================================= */

        async function abrirCarta(
            numero,
            nomeArquivo
        ) {

            const modal =
                document.getElementById(
                    "modal"
                );

            const titulo =
                document.getElementById(
                    "modalTitulo"
                );

            const texto =
                document.getElementById(
                    "modalTexto"
                );


            /*
             * Abre imediatamente a janela.
             */

            modal.classList.add(
                "aberto"
            );

            modal.setAttribute(
                "aria-hidden",
                "false"
            );


            /*
             * Título temporário.
             */

            titulo.innerText =
                `Carta ${String(numero).padStart(2, "0")}`;


            /*
             * Estado de carregamento.
             */

            texto.className =
                "modal-texto";

            texto.innerText =
                "Carregando carta...";


            /*
             * Marca como lida e salva imediatamente.
             */

            const username =
                localStorage.getItem(
                    "username"
                );

            marcarComoLida(
                username,
                numero
            );


            /*
             * Busca o TXT dentro do próprio site.
             */

            try {

                const resposta =
                    await fetch(
                        encodeURI(nomeArquivo),
                        {
                            method: "GET",
                            cache: "no-cache"
                        }
                    );


                if (!resposta.ok) {

                    throw new Error(
                        `Arquivo não encontrado (${resposta.status})`
                    );

                }


                /*
                 * Extrai o texto do arquivo.
                 */

                const conteudo =
                    await resposta.text();


                /*
                 * Mostra o conteúdo.
                 *
                 * textContent preserva o texto como texto,
                 * sem executar HTML que esteja dentro do TXT.
                 */

                texto.textContent =
                    conteudo;


                /*
                 * O título do modal usa o mesmo começo
                 * que aparece na lista.
                 */

                titulo.innerText =
                    gerarTituloDoTexto(
                        conteudo
                    );


            } catch (erro) {

                console.error(
                    "Erro ao carregar carta:",
                    erro
                );


                texto.className =
                    "modal-texto erro-carta";


                texto.innerText =
                    `Não foi possível carregar esta carta.

Arquivo procurado:
${nomeArquivo}

Verifique se o arquivo .txt está no mesmo local desta página.

Erro:
${erro.message}`;

            }

        }


        /* =========================================================
           FECHAR CARTA
           ========================================================= */

        function fecharCarta() {

            const modal =
                document.getElementById(
                    "modal"
                );


            modal.classList.remove(
                "aberto"
            );

            modal.setAttribute(
                "aria-hidden",
                "true"
            );

        }


        /* =========================================================
           FECHAR CLICANDO FORA
           ========================================================= */

        function fecharAoClicarFora(
            event
        ) {

            if (
                event.target.id === "modal"
            ) {

                fecharCarta();

            }

        }


        /* =========================================================
           TECLA ESC
           ========================================================= */

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Escape"
                ) {

                    fecharCarta();

                }

            }
        );


        /* =========================================================
           LOGOUT
           ========================================================= */

        function logout() {

            /*
             * Mantém o comportamento original:
             * limpar a sessão e voltar ao login.
             *
             * O estado das cartas NÃO é apagado,
             * porque fica em uma chave separada.
             */

            localStorage.removeItem(
                "isLoggedIn"
            );

            localStorage.removeItem(
                "username"
            );

            localStorage.removeItem(
                "profilePic"
            );

            window.location.href =
                "login.html";

        }


        /* =========================================================
           BOTÃO FOR YOU
           ========================================================= */

        function redirectToYou() {

            window.location.href =
                "https://youtu.be/xkKzaTt3D3g?si=ldu3R8m5bnH9u9Lu";

        }


        /* =========================================================
           VOLTAR PARA O TOPO DO TEXTO AO ABRIR
           ========================================================= */

        document.addEventListener(
            "click",
            function (event) {

                const botao =
                    event.target.closest(
                        ".carta"
                    );

                if (!botao) {
                    return;
                }

                setTimeout(
                    function () {

                        const texto =
                            document.getElementById(
                                "modalTexto"
                            );

                        if (texto) {
                            texto.scrollTop = 0;
                        }

                    },
                    50
                );

            }
        );

    </script>
