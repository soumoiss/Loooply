<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f0ff">
<meta name="color-scheme" content="light">
<title>Momentos</title>
<link rel="preconnect" href="https://raw.githubusercontent.com">
<link rel="preconnect" href="https://api.github.com">

<style>
@font-face {
    font-family: "Quillen";
    src: local("Quillen"), url("Quillen.otf") format("opentype");
    font-display: swap;
    font-style: normal;
    font-weight: 400;
}

:root {
    --bg: #f4f0ff;
    --bg-2: #eee8ff;
    --surface: rgba(255,255,255,.93);
    --surface-soft: #f8f5ff;
    --primary: #9b5de5;
    --primary-strong: #8750cf;
    --primary-pale: #f4edff;
    --text: #29252f;
    --muted: #817b89;
    --line: rgba(102,82,126,.12);
    --shadow-sm: 0 5px 18px rgba(80,56,115,.07);
    --shadow-md: 0 16px 38px rgba(80,56,115,.11);
    --shadow-lg: 0 28px 80px rgba(65,45,94,.18);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    min-height: 100%;
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    color: var(--text);
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
        radial-gradient(circle at 10% -8%, rgba(177,131,255,.22), transparent 31%),
        radial-gradient(circle at 94% 8%, rgba(220,204,255,.48), transparent 28%),
        linear-gradient(135deg, var(--bg), var(--bg-2));
    padding:
        max(18px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        max(30px, env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    opacity: .34;
    background-image:
        linear-gradient(rgba(255,255,255,.35) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.25) 1px, transparent 1px);
    background-size: 38px 38px;
    mask-image: linear-gradient(to bottom, black, transparent 76%);
    -webkit-mask-image: linear-gradient(to bottom, black, transparent 76%);
}

button,
a {
    font: inherit;
    -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
a:focus-visible,
[tabindex]:focus-visible {
    outline: 3px solid rgba(155,93,229,.30);
    outline-offset: 3px;
}

button {
    border: 0;
}

.app-shell {
    width: min(100%, 1180px);
    margin: 0 auto;
    animation: pageIn .45s ease both;
}

@keyframes pageIn {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.topbar {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
}

.navigation-button,
.music-button {
    min-height: 46px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: rgba(255,255,255,.82);
    color: var(--primary-strong);
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
}

.navigation-button {
    min-width: 46px;
    padding: 7px 10px;
    display: inline-flex;
    align-items: center;
    justify-content: flex-start;
    gap: 7px;
    overflow: hidden;
}

.navigation-button:hover,
.music-button:hover {
    transform: translateY(-2px);
    background: #fff;
    box-shadow: var(--shadow-md);
}

.navigation-button:active,
.music-button:active {
    transform: scale(.96);
}

.navigation-button svg {
    width: 21px;
    height: 21px;
    flex: 0 0 21px;
}

.navigation-label {
    max-width: 0;
    overflow: hidden;
    opacity: 0;
    white-space: nowrap;
    font-size: 11px;
    font-weight: 800;
    transition: max-width .20s ease, opacity .20s ease;
}

.navigation-button:hover .navigation-label,
.navigation-button:focus-visible .navigation-label {
    max-width: 90px;
    opacity: 1;
}

.music-button {
    padding: 0 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-size: 12px;
    font-weight: 800;
}

.music-button svg {
    width: 19px;
    height: 19px;
    flex: 0 0 19px;
}

.container {
    width: 100%;
    padding: clamp(20px,4vw,34px);
    border: 1px solid rgba(120,92,155,.10);
    border-radius: 28px;
    background: var(--surface);
    box-shadow: var(--shadow-lg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
}

.hero {
    text-align: center;
    margin-bottom: 25px;
}

.hero h1 {
    font-family: "Quillen", Georgia, "Times New Roman", serif;
    font-size: clamp(38px,8vw,62px);
    font-weight: 400;
    line-height: 1.05;
    letter-spacing: .01em;
}

.overview {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    margin-bottom: 15px;
}

.contador {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 118px;
    padding: 10px 13px;
    border-radius: 15px;
    background: var(--primary-pale);
    border: 1px solid rgba(155,93,229,.14);
    color: var(--primary-strong);
    font-size: 13px;
    font-weight: 800;
}

.media-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 17px;
}

.media-tab {
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 0 15px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: rgba(255,255,255,.84);
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    font-weight: 800;
    box-shadow: 0 3px 12px rgba(80,56,115,.04);
    transition: transform .18s ease, background .18s ease, color .18s ease, border-color .18s ease, box-shadow .18s ease;
}

.media-tab:hover {
    transform: translateY(-1px);
    color: var(--primary-strong);
    border-color: rgba(155,93,229,.20);
}

.media-tab.active {
    color: #fff;
    background: var(--primary);
    border-color: var(--primary);
    box-shadow: 0 8px 20px rgba(155,93,229,.20);
}

.media-tab svg {
    width: 17px;
    height: 17px;
}

.section {
    display: none;
}

.section.active {
    display: block;
    animation: sectionIn .25s ease both;
}

@keyframes sectionIn {
    from {
        opacity: .2;
        transform: translateY(4px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 3px 1px 13px;
}

.section-head h2 {
    font-size: 20px;
    letter-spacing: -.02em;
}

.section-head p {
    color: var(--muted);
    font-size: 12px;
}

.galeria {
    column-count: 5;
    column-gap: 15px;
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 1px;
}

.media-card {
    position: relative;
    display: block;
    break-inside: avoid;
    margin: 0 0 15px;
    cursor: zoom-in;
    animation: mediaIn .35s ease both;
}

@keyframes mediaIn {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.photo-shell {
    position: relative;
    overflow: hidden;
    border-radius: 18px;
    background: linear-gradient(135deg,#f1eaff,#fff);
    border: 1px solid rgba(102,82,126,.10);
    box-shadow: 0 7px 18px rgba(80,56,115,.08);
}

.photo-shell img {
    width: 100%;
    height: auto;
    display: block;
    object-fit: contain;
    transition: transform .30s ease, opacity .30s ease;
}

.media-card:hover .photo-shell img,
.media-card:focus-visible .photo-shell img {
    transform: scale(1.018);
    opacity: .94;
}

.photo-overlay {
    position: absolute;
    inset: auto 0 0 0;
    padding: 30px 11px 11px;
    opacity: 0;
    transform: translateY(5px);
    background: linear-gradient(transparent,rgba(35,26,46,.55));
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    transition: opacity .22s ease, transform .22s ease;
    pointer-events: none;
}

.media-card:hover .photo-overlay,
.media-card:focus-visible .photo-overlay {
    opacity: 1;
    transform: translateY(0);
}

.media-grid {
    display: grid;
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 13px;
}

.media-panel {
    min-width: 0;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 20px;
    background: linear-gradient(135deg,#fff,#fbf9ff);
    box-shadow: var(--shadow-sm);
}

.media-panel h3 {
    font-family: "Quillen",Georgia,serif;
    font-size: 23px;
    font-weight: 400;
    margin-bottom: 12px;
}

.audio-item,
.video-item,
.exclusive-item {
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--surface-soft);
    padding: 12px;
    margin-bottom: 9px;
}

.audio-item:last-child,
.video-item:last-child,
.exclusive-item:last-child {
    margin-bottom: 0;
}

.media-name {
    display: block;
    color: var(--text);
    font-size: 12px;
    font-weight: 800;
    line-height: 1.4;
    overflow-wrap: anywhere;
    margin-bottom: 8px;
}

audio,
video {
    width: 100%;
    display: block;
    border-radius: 12px;
}

audio {
    min-height: 42px;
}

video {
    background: #151018;
    max-height: 460px;
    object-fit: contain;
}

.exclusive-content {
    display: grid;
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 13px;
}

.exclusive-item img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 12px;
}

.exclusive-item video {
    max-height: 500px;
}

.error-state {
    display: grid;
    gap: 7px;
    margin: 0 0 17px;
    padding: 18px 16px;
    border: 1px solid rgba(190,72,106,.18);
    border-radius: 18px;
    background: rgba(255,244,248,.88);
    color: #75616a;
    text-align: center;
}

.error-state[hidden] {
    display: none;
}

.error-state strong {
    color: #6f3047;
    font-family: "Quillen", Georgia, serif;
    font-size: 20px;
    font-weight: 400;
}

.error-state span {
    font-size: 12px;
    line-height: 1.5;
}

.error-state button {
    justify-self: center;
    min-height: 40px;
    padding: 0 15px;
    border: 1px solid rgba(155,93,229,.18);
    border-radius: 13px;
    background: #fff;
    color: var(--primary-strong);
    cursor: pointer;
    font-size: 12px;
    font-weight: 800;
}

.loading-state {
    min-height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.loader-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--primary);
    animation: pulse 1s ease-in-out infinite;
}

@keyframes pulse {
    0%,100% {
        opacity: .35;
        transform: scale(.85);
    }
    50% {
        opacity: 1;
        transform: scale(1);
    }
}

.empty-state {
    display: none;
    padding: 30px 16px;
    text-align: center;
    color: var(--muted);
    border: 1px dashed rgba(117,101,132,.16);
    border-radius: 18px;
    background: rgba(255,255,255,.48);
}

.empty-state.visible {
    display: block;
}

.empty-state strong {
    display: block;
    color: var(--text);
    font-family: "Quillen",Georgia,serif;
    font-size: 20px;
    font-weight: 400;
}

.lightbox {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
    background: rgba(41,33,51,.80);
    backdrop-filter: blur(13px);
    -webkit-backdrop-filter: blur(13px);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .24s ease,visibility .24s ease;
}

.lightbox.aberto {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

.lightbox-content {
    position: relative;
    width: min(96vw,1400px);
    max-height: 94vh;
    max-height: 94dvh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.lightbox-img {
    max-width: 96vw;
    max-height: 88vh;
    max-height: 88dvh;
    width: auto;
    height: auto;
    object-fit: contain;
    border-radius: 12px;
    box-shadow: 0 28px 80px rgba(0,0,0,.40);
}

.lightbox-close {
    position: fixed;
    top: max(16px,env(safe-area-inset-top));
    right: max(16px,env(safe-area-inset-right));
    width: 46px;
    height: 46px;
    border: 1px solid rgba(255,255,255,.30);
    border-radius: 50%;
    background: rgba(255,255,255,.12);
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 25px;
    line-height: 1;
    cursor: pointer;
    z-index: 3;
}

.lightbox-caption {
    position: fixed;
    left: 50%;
    bottom: max(16px,env(safe-area-inset-bottom));
    transform: translateX(-50%);
    max-width: min(90vw,760px);
    padding: 9px 14px;
    border-radius: 999px;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.18);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    text-align: center;
    overflow-wrap: anywhere;
}

@media (max-width:1180px) {
    .galeria {
        column-count: 4;
    }
}

@media (max-width:900px) {
    .galeria {
        column-count: 3;
    }

    .media-grid,
    .exclusive-content {
        grid-template-columns: 1fr;
    }
}

@media (max-width:680px) {
    body {
        padding-top: max(12px,env(safe-area-inset-top));
    }

    .container {
        padding: 19px 13px 16px;
        border-radius: 24px;
    }

    .topbar {
        margin-bottom: 9px;
    }

    .navigation-button,
    .music-button {
        min-width: 43px;
        width: 43px;
        min-height: 43px;
        height: 43px;
        border-radius: 14px;
    }

    .navigation-label {
        display: none;
    }

    .music-button {
        padding: 0;
    }

    .music-button span {
        display: none;
    }

    .galeria {
        column-count: 2;
        column-gap: 9px;
        padding: 0;
    }

    .media-card {
        margin-bottom: 9px;
    }

    .photo-shell {
        border-radius: 14px;
    }

    .overview {
        justify-content: flex-start;
    }

    .media-tab {
        flex: 1 1 calc(50% - 8px);
    }
}

@media (max-width:390px) {
    .galeria {
        column-count: 1;
    }

    .media-tab {
        flex-basis: 100%;
    }

    .hero h1 {
        font-size: 39px;
    }
}
</style>
</head>

<body>

<main class="app-shell">

    <div class="topbar">
        <button class="navigation-button" type="button" id="btnVoltar" aria-label="Voltar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5"></path>
                <path d="m12 19-7-7 7-7"></path>
            </svg>
            <span class="navigation-label">Voltar</span>
        </button>

        <button class="music-button" type="button" id="btnMusica" aria-label="Continuar música" title="Continuar música">
            <svg id="iconeMusica" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="m7 4 12 8-12 8z"></path>
            </svg>
            <span id="textoMusica">Música</span>
        </button>
    </div>

    <section class="container">

        <header class="hero">
            <h1>Momentos</h1>
        </header>

        <div class="overview">
            <div class="contador" id="contador">0 mídias</div>
        </div>

        <div class="error-state" id="galleryError" role="alert" hidden>
            <strong id="galleryErrorTitle">Não foi possível carregar a galeria.</strong>
            <span id="galleryErrorText">Tente novamente.</span>
            <button type="button" id="galleryRetry">Tentar novamente</button>
        </div>

        <div class="media-tabs" id="mediaTabs" role="tablist">

            <button class="media-tab active" type="button" role="tab" aria-selected="true" data-section="fotos">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="16" rx="3"></rect>
                    <circle cx="8.5" cy="9" r="1.5"></circle>
                    <path d="m5.5 17 4.5-4.5 3.5-3.5 6 6"></path>
                </svg>
                Fotos
            </button>

            <button class="media-tab" type="button" role="tab" aria-selected="false" data-section="audios">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18V5l11-2v13"></path>
                    <circle cx="6" cy="18" r="3"></circle>
                    <circle cx="17" cy="16" r="3"></circle>
                </svg>
                Áudios
            </button>

            <button class="media-tab" type="button" role="tab" aria-selected="false" data-section="videos">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="5" width="13" height="14" rx="2"></rect>
                    <path d="m16 10 5-3v10l-5-3z"></path>
                </svg>
                Vídeos
            </button>

            <button class="media-tab" type="button" role="tab" aria-selected="false" data-section="exclusivo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="10" width="16" height="10" rx="2"></rect>
                    <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                </svg>
                Exclusivo
            </button>

        </div>

        <section class="section active" id="section-fotos" role="tabpanel">
            <div class="section-head">
                <h2>Fotos</h2>
                <p id="fotoStatus"></p>
            </div>

            <div class="galeria" id="galeria"></div>

            <div class="loading-state" id="fotoLoading">
                <span class="loader-dot"></span>
            </div>

            <div class="empty-state" id="fotoEmpty">
                <strong>Não há foto</strong>
            </div>
        </section>

        <section class="section" id="section-audios" role="tabpanel" hidden>
            <div class="section-head">
                <h2>Áudios</h2>
                <p id="audioStatus"></p>
            </div>

            <div id="audios" class="media-grid"></div>

            <div class="loading-state" id="audioLoading">
                <span class="loader-dot"></span>
            </div>

            <div class="empty-state" id="audioEmpty">
                <strong>Não há áudio</strong>
            </div>
        </section>

        <section class="section" id="section-videos" role="tabpanel" hidden>
            <div class="section-head">
                <h2>Vídeos</h2>
                <p id="videoStatus"></p>
            </div>

            <div id="videos" class="media-grid"></div>

            <div class="loading-state" id="videoLoading">
                <span class="loader-dot"></span>
            </div>

            <div class="empty-state" id="videoEmpty">
                <strong>Não há vídeo</strong>
            </div>
        </section>

        <section class="section" id="section-exclusivo" role="tabpanel" hidden>
            <div class="section-head">
                <h2>Exclusivo</h2>
                <p id="exclusiveStatus"></p>
            </div>

            <div id="exclusivo" class="exclusive-content"></div>

            <div class="loading-state" id="exclusiveLoading">
                <span class="loader-dot"></span>
            </div>

            <div class="empty-state" id="exclusiveEmpty">
                <strong>Não há conteúdo exclusivo</strong>
            </div>
        </section>

    </section>
</main>

<audio id="temaMusical" preload="auto" loop playsinline></audio>

<div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true">
    <button class="lightbox-close" type="button" id="lightboxClose" aria-label="Fechar">×</button>
    <div class="lightbox-content" id="lightboxContent"></div>
    <div class="lightbox-caption" id="lightboxCaption"></div>
</div>

<script>
"use strict";

const EXTENSOES = {
    fotos: new Set(["jpg","jpeg","png","webp","gif","avif","bmp","svg","heic","heif","jfif","tif","tiff"]),
    audios: new Set(["mp3","m4a","wav","ogg","oga","aac","flac","opus"]),
    videos: new Set(["mp4","webm","mov","m4v","ogv","avi","mkv"])
};

const MIME_POR_EXTENSAO = {
    jpg:"image/jpeg", jpeg:"image/jpeg", png:"image/png", webp:"image/webp", gif:"image/gif", avif:"image/avif", bmp:"image/bmp", svg:"image/svg+xml", heic:"image/heic", heif:"image/heif", jfif:"image/jpeg", tif:"image/tiff", tiff:"image/tiff",
    mp3:"audio/mpeg", m4a:"audio/mp4", wav:"audio/wav", ogg:"audio/ogg", oga:"audio/ogg", aac:"audio/aac", flac:"audio/flac", opus:"audio/opus",
    mp4:"video/mp4", webm:"video/webm", mov:"video/quicktime", m4v:"video/mp4", ogv:"video/ogg", avi:"video/x-msvideo", mkv:"video/x-matroska"
};

function obterUsuario(){

function normalizarCaminho(c){return String(c||"").replace(/^\/+|\/+$/g,"");}
function obterExtensao(n){const b=String(n||"").split("/").pop();const p=b.lastIndexOf(".");return p===-1?"":b.slice(p+1).toLowerCase();}
function obterNomeSemExtensao(n){const b=String(n||"").split("/").pop();const p=b.lastIndexOf(".");return p<=0?b:b.slice(0,p);}
function classificarArquivo(n){const e=obterExtensao(n);if(EXTENSOES.fotos.has(e))return"fotos";if(EXTENSOES.audios.has(e))return"audios";if(EXTENSOES.videos.has(e))return"videos";return null;}

function criarErro(codigo,mensagem,detalhes={}){const e=new Error(mensagem);e.codigo=codigo;Object.assign(e,detalhes);return e;}

function detectarRepositorioAutomaticamente(){
    const c={...REPOSITORIO};
    const host=window.location.hostname;
    const partes=window.location.pathname.split("/").filter(Boolean);
    if(!c.owner&&host.endsWith(".github.io"))c.owner=host.split(".")[0];
    if(!c.repo&&host.endsWith(".github.io")&&partes[0])c.repo=partes[0];
    return c;
}
function validarRepositorio(c){if(!c.owner||!c.repo||!c.pastaMidia)throw criarErro("CONFIG_INVALIDA","Configuração do repositório incompleta.");}

function construirRawUrl(caminho,c){
    const partes=normalizarCaminho(caminho).split("/").filter(Boolean).map(encodeURIComponent);
    if(!c.branch||!partes.length)throw criarErro("URL_INVALIDA","Branch ou caminho de mídia ausente.");
    return `https://raw.githubusercontent.com/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/${encodeURIComponent(c.branch)}/${partes.join("/")}`;
}
function construirJsDelivrUrl(caminho,c,branch=c.branch){
    const partes=normalizarCaminho(caminho).split("/").filter(Boolean).map(encodeURIComponent);
    return `https://cdn.jsdelivr.net/gh/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}@${encodeURIComponent(branch)}/${partes.join("/")}`;
}
function construirGitHubBlobUrl(caminho,c){return `https://github.com/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/blob/${encodeURIComponent(c.branch)}/${normalizarCaminho(caminho).split("/").map(encodeURIComponent).join("/")}`;}

async function fetchComTimeout(url,opcoes={},timeout=DISCOVERY_TIMEOUT){
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),timeout);
    try{return await fetch(url,{...opcoes,signal:controller.signal,cache:"no-store"});}
    catch(e){if(e?.name==="AbortError")throw criarErro("TIMEOUT",`Tempo esgotado ao acessar ${url}`,{url});throw criarErro("REDE",`Falha de rede ao acessar ${url}`,{url,causa:e});}
    finally{clearTimeout(timer);}
}
async function respostaJson(res){
    const texto=await res.text();
    if(!texto.trim())return null;
    try{return JSON.parse(texto);}catch{throw criarErro("JSON_INVALIDO","Resposta JSON inválida.",{status:res.status});}
}
async function githubFetch(url){
    const res=await fetchComTimeout(url,{headers:{Accept:"application/vnd.github+json","X-GitHub-Api-Version":API_VERSION}},DISCOVERY_TIMEOUT);
    const data=await respostaJson(res);
    if(!res.ok){const rem=res.headers.get("x-ratelimit-remaining");let codigo="HTTP";if(res.status===404)codigo="HTTP_404";else if(res.status===403&&rem==="0")codigo="RATE_LIMIT";else if(res.status===429)codigo="RATE_LIMIT";else if(res.status===403)codigo="HTTP_403";throw criarErro(codigo,String(data?.message||`GitHub HTTP ${res.status}`),{status:res.status,rateRemaining:rem});}
    return data;
}

function newArquivo(caminho,c,extra={}){
    const p=normalizarCaminho(caminho),nome=p.split("/").pop(),tipo=classificarArquivo(nome);
    if(!p||!nome||!tipo)return null;
    const raw=construirRawUrl(p,c);
    const cdn=construirJsDelivrUrl(p,c);
    return {nome,caminho:p,tipo,mime:extra.mime||MIME_POR_EXTENSAO[obterExtensao(nome)]||"",tamanho:Number(extra.size||0),sha:String(extra.sha||""),url:raw,urls:[raw,cdn],urlIndex:0,apiUrl:String(extra.url||""),origem:extra.origem||"github"};
}
function caminhoEhCompartilhado(c,pasta){const r=normalizarCaminho(c).slice(normalizarCaminho(pasta).length+1);return !!r&&!r.includes("/");}
function caminhoEhDoUsuario(c,pasta,u){if(!u)return false;const p=normalizarCaminho(c).split("/");return p.length>=3&&p[0].toLowerCase()===normalizarCaminho(pasta).toLowerCase()&&p[1].toLowerCase()===u.toLowerCase();}

function montarCatalogo(itens,c,usuario){
    const out={fotos:[],audios:[],videos:[]},ex=[];const prefix=`${normalizarCaminho(c.pastaMidia)}/`.toLowerCase();
    const tema=`${prefix}tema.mp3`;
    for(const raw of itens){
        const caminho=normalizarCaminho(raw?.path||raw?.name||"");
        if(!caminho.toLowerCase().startsWith(prefix)||caminho.toLowerCase()===tema)continue;
        const a=raw.tipo?raw:newArquivo(caminho,c,raw);if(!a)continue;
        if(caminhoEhCompartilhado(caminho,c.pastaMidia))out[a.tipo].push(a);
        else if(caminhoEhDoUsuario(caminho,c.pastaMidia,usuario))ex.push(a);
    }
    for(const k of Object.keys(out))out[k]=deduplicarArquivos(out[k]).sort(compararArquivos);
    return {compartilhado:out,exclusivo:deduplicarArquivos(ex).sort(compararArquivos)};
}

async function obterConfiguracaoGitHub(){
    const c=detectarRepositorioAutomaticamente();validarRepositorio(c);
    const d=await githubFetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`);
    if(!d?.default_branch)throw criarErro("REPOSITORIO_INVALIDO","GitHub não informou o branch padrão.");
    c.branch=String(d.default_branch);return c;
}
async function estrategiaGitTree(c,u){
    const d=await githubFetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/git/trees/${encodeURIComponent(c.branch)}?recursive=1`);
    if(!Array.isArray(d?.tree))throw criarErro("TREE_INVALIDA","Árvore Git inválida.");
    if(d.truncated)throw criarErro("TREE_TRUNCADA","Árvore Git truncada.");
    return montarCatalogo(d.tree,c,u);
}
async function listarContents(caminho,c,acumulador=new Map()){
    const url=`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${normalizarCaminho(caminho).split("/").map(encodeURIComponent).join("/")}?ref=${encodeURIComponent(c.branch)}`;
    const data=await githubFetch(url);if(!Array.isArray(data))throw criarErro("CONTENTS_INVALIDO","GitHub Contents não retornou uma lista.");
    for(const item of data){
        if(item.type==="file"){const tipo=classificarArquivo(item.name);if(tipo)acumulador.set(normalizarCaminho(item.path).toLowerCase(),item);}
        else if(item.type==="dir")await listarContents(item.path,c,acumulador);
    }
    return [...acumulador.values()];
}
async function estrategiaContents(c,u){return montarCatalogo(await listarContents(c.pastaMidia,c),c,u);}

async function obterListaJsDelivr(branch){
    const url=`https://data.jsdelivr.com/v1/package/gh/${encodeURIComponent(REPOSITORIO.owner)}/${encodeURIComponent(REPOSITORIO.repo)}@${encodeURIComponent(branch)}/flat`;
    const res=await fetchComTimeout(url,{headers:{Accept:"application/json"}},DISCOVERY_TIMEOUT);if(!res.ok)throw criarErro("JSDELIVR_HTTP",`jsDelivr HTTP ${res.status}`);
    const data=await respostaJson(res);if(!Array.isArray(data?.files))throw criarErro("JSDELIVR_INVALIDO","jsDelivr não retornou lista de arquivos.");return data.files;
}
async function estrategiaJsDelivr(branch,u){
    const c={...detectarRepositorioAutomaticamente(),branch};const files=await obterListaJsDelivr(branch);
    const itens=files.map(x=>({path:String(x.name||"").replace(/^\//,""),size:x.size,origem:"jsdelivr"}));
    const cat=montarCatalogo(itens,c,u);for(const grupo of [cat.compartilhado.fotos,cat.compartilhado.audios,cat.compartilhado.videos,cat.exclusivo])for(const a of grupo){a.url=a.urls[1];a.urls=[a.urls[1],a.urls[0]];}return cat;
}

async function estrategiaGitHubHtml(branch,u){
    const c={...detectarRepositorioAutomaticamente(),branch};
    const url=`https://github.com/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/tree/${encodeURIComponent(branch)}/${normalizarCaminho(c.pastaMidia).split("/").map(encodeURIComponent).join("/")}`;
    const res=await fetchComTimeout(url,{headers:{Accept:"text/html"}},DISCOVERY_TIMEOUT);if(!res.ok)throw criarErro("GITHUB_HTML_HTTP",`GitHub HTML HTTP ${res.status}`);
    const html=await res.text();
    const doc=new DOMParser().parseFromString(html,"text/html");
    const itens=[];const prefix=normalizarCaminho(c.pastaMidia)+"/";
    for(const a of doc.querySelectorAll('a[href*="/blob/"],a[href*="/tree/"]')){
        const href=a.getAttribute("href")||"";const m=href.match(new RegExp(`/blob/${escapeRegExp(branch)}/(.+)$`));
        if(m){const p=decodeURIComponent(m[1]);if(p.toLowerCase().startsWith(prefix.toLowerCase()))itens.push({path:p,origem:"github-html"});}
    }
    if(!itens.length)throw criarErro("GITHUB_HTML_VAZIO","GitHub HTML não expôs os arquivos.");
    return montarCatalogo(itens,c,u);
}
function escapeRegExp(s){return String(s).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}

async function descobrirCatalogo(){
    const usuario=estado.usuario;const base=detectarRepositorioAutomaticamente();validarRepositorio(base);const falhas=[];
    try{
        const c=await obterConfiguracaoGitHub();
        for(const estrategia of [()=>estrategiaGitTree(c,usuario),()=>estrategiaContents(c,usuario)]){
            try{const cat=await estrategia();if(cat&&(cat.compartilhado.fotos.length+cat.compartilhado.audios.length+cat.compartilhado.videos.length+cat.exclusivo.length)>0)return {cat,c,fonte:"github-api"};if(cat)falhas.push(criarErro("FONTE_VAZIA","GitHub respondeu, mas não encontrou mídia em midia/."));}
            catch(e){falhas.push(e);console.warn("[Galeria] Estratégia GitHub falhou:",e);}
        }
        for(const b of [c.branch,"main","master"].filter((x,i,a)=>x&&a.indexOf(x)===i)){
            try{const cat=await estrategiaJsDelivr(b,usuario);if(cat.compartilhado.fotos.length+cat.compartilhado.audios.length+cat.compartilhado.videos.length+cat.exclusivo.length)return {cat,c:{...c,branch:b},fonte:"jsdelivr"};}
            catch(e){falhas.push(e);}
            try{const cat=await estrategiaGitHubHtml(b,usuario);if(cat.compartilhado.fotos.length+cat.compartilhado.audios.length+cat.compartilhado.videos.length+cat.exclusivo.length)return {cat,c:{...c,branch:b},fonte:"github-html"};}
            catch(e){falhas.push(e);}
        }
        throw falhas.at(-1)||criarErro("SEM_RESULTADO","Nenhuma estratégia encontrou a mídia.");
    }catch(e){
        for(const b of ["main","master"]){try{const cat=await estrategiaJsDelivr(b,usuario);if(cat.compartilhado.fotos.length+cat.compartilhado.audios.length+cat.compartilhado.videos.length+cat.exclusivo.length)return {cat,c:{...base,branch:b},fonte:"jsdelivr"};}catch(err){falhas.push(err);}}

function aplicarCatalogo(resultado){

async function carregarCatalogo(opcoes={}){
    if(estado.promessaCatalogo&&!opcoes.forcar)return estado.promessaCatalogo;
    if(!opcoes.forcar&&carregarCache()){renderizarTudoInicial();configurarMusica(estado.configuracao);return estado.arquivos;}
    estado.carregamento="loading";mostrarLoading();estado.secoesRenderizadas={fotos:false,audios:false,videos:false,exclusivo:false};
    estado.promessaCatalogo=(async()=>{
        try{

            aplicarCatalogo(resultado);limparErro();salvarCache();renderizarTudoInicial();configurarMusica(estado.configuracao);return estado.arquivos;
        }catch(e){
            estado.arquivos={fotos:[],audios:[],videos:[]};estado.exclusivo=[];

    estado.secoesRenderizadas.exclusivo=true;const c=document.getElementById("exclusivo");c.replaceChildren();removerLoading("exclusiveLoading");const v=document.getElementById("exclusiveEmpty");v.classList.toggle("visible",estado.carregamento.startsWith("success")&&estado.exclusivo.length===0);if(!estado.exclusivo.length)return;
    estado.exclusivo.forEach(a=>{const item=document.createElement("article");item.className="exclusive-item";const nome=document.createElement("span");nome.className="media-name";nome.textContent=a.nome;item.appendChild(nome);
        if(a.tipo==="fotos"){const img=document.createElement("img");img.loading="lazy";img.decoding="async";img.src=a.url;img.alt=a.nome;ligarFallbackDeMidia(img,a,()=>{img.remove();const f=document.createElement("span");f.className="media-name";f.textContent="Não foi possível exibir esta imagem.";item.appendChild(f);});item.appendChild(img);}
        else if(a.tipo==="audios"){const au=document.createElement("audio");au.controls=true;au.preload="none";au.src=a.url;ligarFallbackDeMidia(au,a,()=>console.warn("[Galeria] Áudio exclusivo indisponível:",a.caminho));item.appendChild(au);}
        else{const vi=document.createElement("video");vi.controls=true;vi.preload="metadata";vi.playsInline=true;vi.src=a.url;const mime=tipoMimePorArquivo(a);if(mime)vi.setAttribute("type",mime);ligarFallbackDeMidia(vi,a,()=>console.warn("[Galeria] Vídeo exclusivo indisponível:",a.caminho));item.appendChild(vi);}
        c.appendChild(item);
    });
}

function atualizarBotaoMusica(tocando) {
    textoMusica.textContent = "Música";
    if (tocando) {
        btnMusica.title = "Pausar música";
        btnMusica.setAttribute("aria-label", "Pausar música");
        iconeMusica.innerHTML = '<rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect>';
    } else {
        btnMusica.title = "Continuar música";
        btnMusica.setAttribute("aria-label", "Continuar música");
        iconeMusica.innerHTML = '<path d="m7 4 12 8-12 8z"></path>';
    }
}

function configurarMusica(configuracao) {
    const url = construirRawUrl(`${configuracao.pastaMidia}/tema.mp3`, configuracao);
    audioTema.src = url;
    audioTema.loop = true;
    audioTema.preload = "none";
    audioTema.load();
    estado.musicaPausadaManualmente = false;
    tentarAutoplay();
}

async function tentarAutoplay() {
    if (!audioTema.src || estado.musicaPausadaManualmente) return;
    try {
        await audioTema.play();
        atualizarBotaoMusica(true);
        removerListenersDeAutoplay();
    } catch {
        atualizarBotaoMusica(false);
    }
}

function removerListenersDeAutoplay() {
    document.removeEventListener("pointerdown", lidarInteracaoAutoplay);
    document.removeEventListener("touchstart", lidarInteracaoAutoplay);
    document.removeEventListener("keydown", lidarInteracaoAutoplay);
}

function lidarInteracaoAutoplay(event) {
    if (event.target instanceof Element && event.target.closest("#btnMusica")) return;
    tentarAutoplay();
}

async function alternarMusica() {
    if (audioTema.paused) {
        estado.musicaPausadaManualmente = false;
        await tentarAutoplay();
    } else {
        estado.musicaPausadaManualmente = true;
        audioTema.pause();
        atualizarBotaoMusica(false);
    }
}

btnMusica.addEventListener("click", alternarMusica);
document.addEventListener("pointerdown", lidarInteracaoAutoplay);
document.addEventListener("touchstart", lidarInteracaoAutoplay);
document.addEventListener("keydown", lidarInteracaoAutoplay);
audioTema.addEventListener("play", () => atualizarBotaoMusica(true));
audioTema.addEventListener("pause", () => atualizarBotaoMusica(false));
audioTema.addEventListener("error", () => atualizarBotaoMusica(false));

function abrirLightbox(arquivo, origem) {
    const lightbox = document.getElementById("lightbox");
    const content = document.getElementById("lightboxContent");
    const caption = document.getElementById("lightboxCaption");
    estado.ultimaFocada = origem;
    estado.lightboxAberto = true;
    content.replaceChildren();

    const imagem = document.createElement("img");
    imagem.className = "lightbox-img";
    imagem.src = arquivo.url;
    imagem.alt = arquivo.nome;
    imagem.addEventListener("error", () => {
        content.textContent = "Não foi possível exibir esta imagem.";
        console.warn("[Galeria] Falha no lightbox:", arquivo.caminho);
    }, { once: true });

    content.appendChild(imagem);
    caption.textContent = arquivo.nome;
    lightbox.classList.add("aberto");
    lightbox.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";

    if (!history.state?.momentosLightbox) {
        history.pushState({ ...(history.state || {}), momentosLightbox: true }, "");
        estado.lightboxUsouHistorico = true;
    }
}

function fecharLightbox(viaHistorico = false) {
    const lightbox = document.getElementById("lightbox");
    if (!estado.lightboxAberto) return;
    estado.lightboxAberto = false;
    lightbox.classList.remove("aberto");
    lightbox.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    document.getElementById("lightboxContent").replaceChildren();
    document.getElementById("lightboxCaption").textContent = "";

    const foco = estado.ultimaFocada;
    estado.ultimaFocada = null;

    if (!viaHistorico && estado.lightboxUsouHistorico && history.state?.momentosLightbox) {
        estado.lightboxUsouHistorico = false;
        history.back();
        return;
    }
    estado.lightboxUsouHistorico = false;
    if (foco && typeof foco.focus === "function") requestAnimationFrame(() => foco.focus());
}

document.getElementById("lightboxClose").addEventListener("click", () => fecharLightbox());
document.getElementById("lightbox").addEventListener("click", event => {
    if (event.target.id === "lightbox") fecharLightbox();
});
document.addEventListener("keydown", event => {
    if (event.key === "Escape" && estado.lightboxAberto) fecharLightbox();
});
window.addEventListener("popstate", () => {
    if (estado.lightboxAberto) fecharLightbox(true);
});

function renderizarSecao(nome) {
    if (!String(estado.carregamento).startsWith("success")) return;
    if (estado.secoesRenderizadas[nome]) return;
    if (nome === "audios") renderizarAudios();
    else if (nome === "videos") renderizarVideos();
    else if (nome === "exclusivo") renderizarExclusivo();
}

function trocarSecao(nome) {
    document.querySelectorAll(".media-tab").forEach(botao => {
        const ativo = botao.dataset.section === nome;
        botao.classList.toggle("active", ativo);
        botao.setAttribute("aria-selected", String(ativo));
    });
    document.querySelectorAll(".section").forEach(secao => {
        const ativo = secao.id === `section-${nome}`;
        secao.classList.toggle("active", ativo);
        secao.hidden = !ativo;
    });
    renderizarSecao(nome);
}

document.querySelectorAll(".media-tab").forEach(botao => {
    botao.addEventListener("click", () => trocarSecao(botao.dataset.section));
});

document.getElementById("btnVoltar").addEventListener("click", () => {
    window.location.href = "home.html";
});

galleryRetry.addEventListener("click", () => {
    carregarCatalogo({ forcar: true }).catch(() => {});
});

async function iniciar() {
    estado.usuario = obterUsuario();
    console.info("[Galeria] Usuário normalizado:", estado.usuario || "não identificado");
    try {
        await carregarCatalogo();
    } catch {
        // O estado visual e o console já foram atualizados por carregarCatalogo().
    }
}

iniciar();
</script>
