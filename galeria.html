<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#17131c">
<title>Nossos Momentos</title>

<style>
@font-face {
    font-family: Quillen;
    src: url("Quillen.otf") format("opentype");
}

:root {
    --bg: #f8f4fb;
    --surface: #ffffff;
    --surface-soft: #fbf8fd;
    --primary: #9857dc;
    --primary-dark: #7740b6;
    --primary-soft: #f0e4fb;
    --accent: #d58fbf;
    --text: #28242d;
    --muted: #85808a;
    --border: #e8e2eb;
    --shadow: 0 12px 35px rgba(102, 58, 140, .10);
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top left, rgba(190, 137, 238, .14), transparent 32%),
        radial-gradient(circle at bottom right, rgba(222, 154, 196, .12), transparent 30%),
        var(--bg);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
}

button {
    font: inherit;
}

.app {
    width: min(100%, 760px);
    min-height: 100vh;
    margin: 0 auto;
    background: rgba(255, 255, 255, .82);
    box-shadow: 0 0 50px rgba(82, 46, 108, .08);
    overflow: hidden;
}

.topbar {
    position: sticky;
    top: 0;
    z-index: 30;
    height: 64px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 18px;
    background: rgba(255, 255, 255, .92);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(18px);
}

.back-button {
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 14px;
    display: grid;
    place-items: center;
    background: var(--primary-soft);
    color: var(--primary-dark);
    cursor: pointer;
    font-size: 24px;
    transition: .2s ease;
}

.back-button:active {
    transform: scale(.94);
}

.top-title {
    flex: 1;
    min-width: 0;
    font-family: Quillen, Georgia, serif;
    font-size: 24px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.hero {
    padding: 34px 24px 18px;
    text-align: center;
}

.hero-title {
    margin: 0;
    font-family: Quillen, Georgia, serif;
    font-size: clamp(34px, 8vw, 52px);
    line-height: 1;
    color: var(--primary-dark);
    font-weight: 400;
}

.hero-subtitle {
    max-width: 590px;
    margin: 15px auto 0;
    color: #77717c;
    font-size: 20px;
    line-height: 1.45;
}

.content {
    padding: 0 20px 40px;
}

.counter {
    width: fit-content;
    min-width: 150px;
    margin: 16px 0 22px;
    padding: 13px 25px;
    border: 1px solid #eadcf5;
    border-radius: 999px;
    background: var(--primary-soft);
    color: var(--primary-dark);
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
}

.tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 26px;
}

.tab {
    min-height: 64px;
    border: 1px solid var(--border);
    border-radius: 22px;
    background: var(--surface);
    color: #807b84;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-family: Arial, sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 5px 18px rgba(91, 50, 120, .04);
    transition: .25s ease;
}

.tab.active {
    background: linear-gradient(135deg, #a45be2, #8e4fd0);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 12px 25px rgba(142, 79, 208, .23);
}

.tab-icon {
    font-size: 23px;
    line-height: 1;
}

.section {
    display: none;
}

.section.active {
    display: block;
    animation: appear .3s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.section-title {
    margin: 0 0 7px;
    font-family: Quillen, Georgia, serif;
    font-size: 31px;
    font-weight: 400;
    color: var(--text);
}

.section-status {
    margin: 0 0 18px;
    color: var(--muted);
    font-family: Arial, sans-serif;
    font-size: 14px;
}

.photo-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}

.photo-card {
    position: relative;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    border-radius: 20px;
    background: #eee8f1;
    box-shadow: var(--shadow);
    cursor: pointer;
}

.photo-card img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    transition: transform .45s ease;
}

.photo-card:active img {
    transform: scale(1.035);
}

.media-list {
    display: grid;
    gap: 12px;
}

.audio-card,
.video-card {
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 22px;
    background: var(--surface);
    box-shadow: var(--shadow);
}

.audio-card audio {
    width: 100%;
    display: block;
}

.video-card video {
    width: 100%;
    max-height: 430px;
    display: block;
    border-radius: 15px;
    background: #111;
}

.media-name {
    margin: 0 0 12px;
    color: var(--text);
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: 700;
    word-break: break-word;
}

.empty {
    padding: 54px 20px;
    border: 1px dashed #e4dce7;
    border-radius: 24px;
    background: rgba(255, 255, 255, .55);
    text-align: center;
}

.empty-title {
    margin: 0;
    color: #302b34;
    font-size: 25px;
}

.empty-text {
    margin: 12px 0 0;
    color: var(--muted);
    font-family: Arial, sans-serif;
    font-size: 15px;
}

.exclusive-box {
    margin-bottom: 20px;
    padding: 18px;
    border: 1px solid #e7d8f2;
    border-radius: 24px;
    background: linear-gradient(145deg, #fcf8ff, #f5ecfc);
}

.exclusive-title {
    margin: 0;
    color: var(--primary-dark);
    font-family: Arial, sans-serif;
    font-size: 16px;
    font-weight: 700;
}

.exclusive-tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 14px;
}

.exclusive-tab {
    min-height: 42px;
    border: 1px solid #e3d8eb;
    border-radius: 14px;
    background: #fff;
    color: #827b87;
    font-family: Arial, sans-serif;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
}

.exclusive-tab.active {
    border-color: transparent;
    background: var(--primary);
    color: #fff;
}

.exclusive-content {
    display: none;
}

.exclusive-content.active {
    display: block;
}

.lightbox {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(20, 14, 24, .94);
    backdrop-filter: blur(12px);
}

.lightbox.active {
    display: flex;
}

.lightbox img {
    max-width: 100%;
    max-height: 88vh;
    object-fit: contain;
    border-radius: 12px;
    box-shadow: 0 20px 70px rgba(0, 0, 0, .4);
}

.lightbox-close {
    position: fixed;
    top: 18px;
    right: 18px;
    width: 46px;
    height: 46px;
    border: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, .14);
    color: #fff;
    font-size: 28px;
    cursor: pointer;
}

.home-button {
    width: 100%;
    min-height: 52px;
    margin-top: 28px;
    border: 1px solid #dfd2e7;
    border-radius: 18px;
    background: #fff;
    color: var(--primary-dark);
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
}

@media (max-width: 560px) {
    .topbar {
        padding: 0 14px;
    }

    .hero {
        padding: 28px 18px 16px;
    }

    .hero-title {
        font-size: 38px;
    }

    .hero-subtitle {
        font-size: 18px;
    }

    .content {
        padding: 0 14px 34px;
    }

    .tabs {
        grid-template-columns: 1fr;
    }

    .tab {
        min-height: 58px;
    }

    .photo-grid {
        gap: 9px;
    }

    .exclusive-tabs {
        gap: 6px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="topbar">
        <button class="back-button" type="button" onclick="window.location.href='home.html'">‹</button>
        <div class="top-title">Nossos Momentos</div>
    </header>

    <main>

        <section class="hero">
            <h1 class="hero-title">Nossos Momentos</h1>
            <p class="hero-subtitle">Pequenos pedacinhos de nós, quero deixar guardados aqui ♡</p>
        </section>

        <div class="content">

            <div class="counter" id="counter">0 mídias</div>

            <nav class="tabs">
                <button class="tab active" type="button" data-tab="fotos">
                    <span class="tab-icon">▧</span>
                    <span>Fotos</span>
                </button>

                <button class="tab" type="button" data-tab="audios">
                    <span class="tab-icon">♫</span>
                    <span>Áudios</span>
                </button>

                <button class="tab" type="button" data-tab="videos">
                    <span class="tab-icon">▹</span>
                    <span>Vídeos</span>
                </button>

                <button class="tab" type="button" data-tab="exclusivo">
                    <span class="tab-icon">♧</span>
                    <span>Exclusivo</span>
                </button>
            </nav>

            <section class="section active" id="section-fotos">
                <h2 class="section-title">Momentos</h2>
                <p class="section-status" id="foto-status">Carregando...</p>
                <div id="fotos-container"></div>
            </section>

            <section class="section" id="section-audios">
                <h2 class="section-title">Áudios</h2>
                <p class="section-status" id="audio-status">Carregando...</p>
                <div id="audios-container"></div>
            </section>

            <section class="section" id="section-videos">
                <h2 class="section-title">Vídeos</h2>
                <p class="section-status" id="video-status">Carregando...</p>
                <div id="videos-container"></div>
            </section>

            <section class="section" id="section-exclusivo">
                <div class="exclusive-box">
                    <h2 class="exclusive-title">Conteúdo Exclusivo</h2>

                    <div class="exclusive-tabs">
                        <button class="exclusive-tab active" type="button" data-exclusive="fotos">Fotos</button>
                        <button class="exclusive-tab" type="button" data-exclusive="audios">Áudios</button>
                        <button class="exclusive-tab" type="button" data-exclusive="videos">Vídeos</button>
                    </div>
                </div>

                <div class="exclusive-content active" id="exclusive-fotos">
                    <div id="exclusive-fotos-container"></div>
                </div>

                <div class="exclusive-content" id="exclusive-audios">
                    <div id="exclusive-audios-container"></div>
                </div>

                <div class="exclusive-content" id="exclusive-videos">
                    <div id="exclusive-videos-container"></div>
                </div>
            </section>

            <button class="home-button" type="button" onclick="window.location.href='home.html'">
                Voltar para home
            </button>

        </div>

    </main>
</div>

<div class="lightbox" id="lightbox">
    <button class="lightbox-close" type="button" id="lightbox-close">×</button>
    <img id="lightbox-image" src="" alt="">
</div>

    <script>
"use strict";

const REPOSITORIO = {
    owner: "",
    repo: "",
    branch: "",
    pastaMidia: "midia"
};

const EXTENSOES = {
    fotos: new Set([
        "jpg", "jpeg", "png", "webp", "gif", "avif",
        "bmp", "svg", "heic", "heif", "jfif", "tif", "tiff"
    ]),
    audios: new Set([
        "mp3", "m4a", "wav", "ogg", "oga", "aac", "flac", "opus"
    ]),
    videos: new Set([
        "mp4", "webm", "mov", "m4v", "ogv", "avi", "mkv"
    ])
};

const MIME_POR_EXTENSAO = {
    jpg: "image/jpeg",
    jpeg: "image/jpeg",
    png: "image/png",
    webp: "image/webp",
    gif: "image/gif",
    avif: "image/avif",
    bmp: "image/bmp",
    svg: "image/svg+xml",
    heic: "image/heic",
    heif: "image/heif",
    jfif: "image/jpeg",
    tif: "image/tiff",
    tiff: "image/tiff",

    mp3: "audio/mpeg",
    m4a: "audio/mp4",
    wav: "audio/wav",
    ogg: "audio/ogg",
    oga: "audio/ogg",
    aac: "audio/aac",
    flac: "audio/flac",
    opus: "audio/opus",

    mp4: "video/mp4",
    webm: "video/webm",
    mov: "video/quicktime",
    m4v: "video/mp4",
    ogv: "video/ogg",
    avi: "video/x-msvideo",
    mkv: "video/x-matroska"
};

const estado = {
    configuracao: null,

    publico: {
        fotos: [],
        audios: [],
        videos: []
    },

    exclusivo: {
        fotos: [],
        audios: [],
        videos: []
    },

    usuario: "",
    carregando: true
};

function obterExtensao(nome) {
    const base = String(nome || "").split("/").pop();
    const posicao = base.lastIndexOf(".");
    if (posicao === -1) return "";
    return base.slice(posicao + 1).toLowerCase();
}

function classificarArquivo(nome, mime = "") {
    const extensao = obterExtensao(nome);
    const tipoMime = String(mime || "").toLowerCase();

    if (tipoMime.startsWith("image/")) return "fotos";
    if (tipoMime.startsWith("audio/")) return "audios";
    if (tipoMime.startsWith("video/")) return "videos";

    if (EXTENSOES.fotos.has(extensao)) return "fotos";
    if (EXTENSOES.audios.has(extensao)) return "audios";
    if (EXTENSOES.videos.has(extensao)) return "videos";

    return null;
}

function tipoMimePorArquivo(arquivo) {
    if (arquivo.mime) return arquivo.mime;
    return MIME_POR_EXTENSAO[obterExtensao(arquivo.nome)] || "";
}

function compararNomes(a, b) {
    return String(a.nome).localeCompare(String(b.nome), "pt-BR", {
        numeric: true,
        sensitivity: "base"
    });
}

function normalizarTexto(valor) {
    return String(valor || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[\s_-]+/g, "")
        .replace(/[^a-z0-9]/g, "");
}

function extrairUsuario(valor) {
    if (!valor) return "";

    if (typeof valor === "string") {
        const texto = valor.trim();

        if (!texto) return "";

        try {
            const objeto = JSON.parse(texto);
            return extrairUsuario(objeto);
        } catch (_) {
            return texto;
        }
    }

    if (typeof valor === "object") {
        const possibilidades = [
            valor.username,
            valor.usuarioAtual,
            valor.usuarioLogado,
            valor.currentUser,
            valor.loggedUser,
            valor.usuario,
            valor.user,
            valor.nome,
            valor.name
        ];

        for (const item of possibilidades) {
            if (typeof item === "string" && item.trim()) {
                return item.trim();
            }

            if (item && typeof item === "object") {
                const resultado = extrairUsuario(item);
                if (resultado) return resultado;
            }
        }
    }

    return "";
}

function obterUsuarioAtual() {
    const chaves = [
        "username",
        "usuarioAtual",
        "usuarioLogado",
        "currentUser",
        "loggedUser",
        "usuario",
        "user"
    ];

    for (const chave of chaves) {
        try {
            const valor = localStorage.getItem(chave);
            const usuario = extrairUsuario(valor);

            if (usuario) {
                return usuario;
            }
        } catch (_) {}
    }

    for (const chave of chaves) {
        try {
            const valor = sessionStorage.getItem(chave);
            const usuario = extrairUsuario(valor);

            if (usuario) {
                return usuario;
            }
        } catch (_) {}
    }

    return "";
}

function detectarRepositorioAutomaticamente() {
    const host = window.location.hostname;
    const caminho = window.location.pathname
        .split("/")
        .filter(Boolean);

    const configuracao = { ...REPOSITORIO };
    const ehGithubPages = host.endsWith(".github.io");

    if (!configuracao.owner && ehGithubPages) {
        configuracao.owner = host.split(".")[0];
    }

    if (!configuracao.repo && ehGithubPages) {
        const primeiroSegmento = caminho[0] || "";

        const primeiroEhArquivo =
            primeiroSegmento.includes(".") ||
            primeiroSegmento.toLowerCase().endsWith(".html");

        if (primeiroSegmento && !primeiroEhArquivo) {
            configuracao.repo = primeiroSegmento;
        }
    }

    if (!configuracao.repo && ehGithubPages && configuracao.owner) {
        configuracao.repo = `${configuracao.owner}.github.io`;
    }

    return configuracao;
}

async function githubFetch(url) {
    const resposta = await fetch(url, {
        method: "GET",
        headers: {
            "Accept": "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28"
        },
        cache: "no-store"
    });

    if (!resposta.ok) {
        let detalhe = "";

        try {
            const json = await resposta.json();

            if (json && json.message) {
                detalhe = ` — ${json.message}`;
            }
        } catch (_) {}

        throw new Error(
            `GitHub respondeu HTTP ${resposta.status}${detalhe}`
        );
    }

    return resposta.json();
}

async function testarRepositorio(configuracao) {
    const url =
        `https://api.github.com/repos/` +
        `${encodeURIComponent(configuracao.owner)}/` +
        `${encodeURIComponent(configuracao.repo)}`;

    try {
        const dados = await githubFetch(url);

        if (!dados || dados.private) {
            return false;
        }

        if (!configuracao.branch) {
            configuracao.branch = dados.default_branch || "main";
        }

        return true;
    } catch (_) {
        return false;
    }
}

async function obterConfiguracaoEfetiva() {
    const configuracao = detectarRepositorioAutomaticamente();

    if (!configuracao.owner || !configuracao.repo) {
        throw new Error(
            "Não foi possível descobrir automaticamente o proprietário e o repositório do GitHub."
        );
    }

    if (await testarRepositorio(configuracao)) {
        return configuracao;
    }

    if (
        window.location.hostname.endsWith(".github.io") &&
        configuracao.repo !== `${configuracao.owner}.github.io`
    ) {
        const alternativa = {
            ...configuracao,
            repo: `${configuracao.owner}.github.io`
        };

        if (await testarRepositorio(alternativa)) {
            return alternativa;
        }
    }

    throw new Error(
        `Não foi possível acessar o repositório ${configuracao.owner}/${configuracao.repo}.`
    );
}

function construirRawUrl(caminho, configuracao) {
    const partes = String(caminho)
        .split("/")
        .map(encodeURIComponent);

    const branch = configuracao.branch || "main";

    return (
        `https://raw.githubusercontent.com/` +
        `${encodeURIComponent(configuracao.owner)}/` +
        `${encodeURIComponent(configuracao.repo)}/` +
        `${encodeURIComponent(branch)}/` +
        `${partes.join("/")}`
    );
}

function criarArquivo(item, configuracao) {
    const nome = item.name || item.path?.split("/").pop() || "";
    const tipo = classificarArquivo(
        nome,
        item.mime_type || item.mime || ""
    );

    if (!tipo) return null;

    return {
        nome,
        caminho: item.path,
        url:
            item.download_url ||
            construirRawUrl(item.path, configuracao),
        apiUrl: item.url || "",
        sha: item.sha || "",
        tamanho: Number(item.size || 0),
        mime:
            item.mime_type ||
            item.mime ||
            MIME_POR_EXTENSAO[obterExtensao(nome)] ||
            "",
        tipo
    };
}

async function listarCatalogoViaTree(configuracao) {
    const url =
        `https://api.github.com/repos/` +
        `${encodeURIComponent(configuracao.owner)}/` +
        `${encodeURIComponent(configuracao.repo)}/git/trees/` +
        `${encodeURIComponent(configuracao.branch)}?recursive=1`;

    const dados = await githubFetch(url);

    if (!dados || !Array.isArray(dados.tree)) {
        throw new Error(
            "A API do GitHub não retornou a árvore do repositório."
        );
    }

    if (dados.truncated) {
        return null;
    }

    const prefixo = `${configuracao.pastaMidia}/`;

    const resultado = {
        publico: {
            fotos: [],
            audios: [],
            videos: []
        },
        pastas: new Map()
    };

    for (const item of dados.tree) {
        if (
            !item ||
            item.type !== "blob" ||
            !item.path ||
            !item.path.startsWith(prefixo)
        ) {
            continue;
        }

        const relativo = item.path.slice(prefixo.length);

        if (!relativo || !relativo.includes("/")) {
            const arquivo = criarArquivo(
                {
                    name: item.path.split("/").pop(),
                    path: item.path,
                    url: item.url,
                    sha: item.sha,
                    size: item.size
                },
                configuracao
            );

            if (arquivo) {
                resultado.publico[arquivo.tipo].push(arquivo);
            }

            continue;
        }

        const partes = relativo.split("/");
        const pastaUsuario = partes[0];

        if (!pastaUsuario) continue;

        const arquivo = criarArquivo(
            {
                name: item.path.split("/").pop(),
                path: item.path,
                url: item.url,
                sha: item.sha,
                size: item.size
            },
            configuracao
        );

        if (!arquivo) continue;

        const chave = normalizarTexto(pastaUsuario);

        if (!resultado.pastas.has(chave)) {
            resultado.pastas.set(chave, {
                nome: pastaUsuario,
                arquivos: []
            });
        }

        resultado.pastas
            .get(chave)
            .arquivos
            .push(arquivo);
    }

    return resultado;
}

async function listarPastaViaContentsRecursivo(
    caminho,
    configuracao
) {
    const url =
        `https://api.github.com/repos/` +
        `${encodeURIComponent(configuracao.owner)}/` +
        `${encodeURIComponent(configuracao.repo)}/contents/` +
        `${caminho
            .split("/")
            .map(encodeURIComponent)
            .join("/")}` +
        `?ref=${encodeURIComponent(configuracao.branch)}`;

    const dados = await githubFetch(url);

    if (!Array.isArray(dados)) {
        return [];
    }

    let resultados = [];

    for (const item of dados) {
        if (!item) continue;

        if (item.type === "dir") {
            const filhos =
                await listarPastaViaContentsRecursivo(
                    item.path,
                    configuracao
                );

            resultados = resultados.concat(filhos);
            continue;
        }

        if (item.type !== "file") continue;

        const arquivo = criarArquivo(item, configuracao);

        if (arquivo) {
            resultados.push(arquivo);
        }
    }

    return resultados;
}

function separarConteudo(todosArquivos, usuario) {
    const resultado = {
        publico: {
            fotos: [],
            audios: [],
            videos: []
        },
        exclusivo: {
            fotos: [],
            audios: [],
            videos: []
        }
    };

    const prefixo = `${REPOSITORIO.pastaMidia}/`;

    const usuarioNormalizado = normalizarTexto(usuario);

    for (const arquivo of todosArquivos) {
        if (!arquivo || !arquivo.caminho) continue;

        if (!arquivo.caminho.startsWith(prefixo)) {
            continue;
        }

        const relativo =
            arquivo.caminho.slice(prefixo.length);

        const partes = relativo.split("/");

        if (partes.length === 1) {
            resultado.publico[arquivo.tipo].push(arquivo);
            continue;
        }

        if (
            usuarioNormalizado &&
            normalizarTexto(partes[0]) === usuarioNormalizado
        ) {
            resultado.exclusivo[arquivo.tipo].push(arquivo);
        }
    }

    return resultado;
}

async function carregarCatalogoPorContents(configuracao) {
    const todosArquivos =
        await listarPastaViaContentsRecursivo(
            configuracao.pastaMidia,
            configuracao
        );

    return separarConteudo(
        todosArquivos,
        estado.usuario
    );
}

function localizarPastaUsuario(pastas, usuario) {
    if (!usuario) return null;

    const usuarioTexto = String(usuario).trim();

    for (const pasta of pastas.values()) {
        if (
            String(pasta.nome).trim().toLowerCase() ===
            usuarioTexto.toLowerCase()
        ) {
            return pasta;
        }
    }

    const chave = normalizarTexto(usuarioTexto);

    for (const pasta of pastas.values()) {
        if (normalizarTexto(pasta.nome) === chave) {
            return pasta;
        }
    }

    return null;
}

async function carregarCatalogo() {
    estado.usuario = obterUsuarioAtual();

    const configuracao =
        await obterConfiguracaoEfetiva();

    estado.configuracao = configuracao;

    let catalogo =
        await listarCatalogoViaTree(configuracao);

    if (catalogo) {
        const pastaUsuario =
            localizarPastaUsuario(
                catalogo.pastas,
                estado.usuario
            );

        estado.publico = catalogo.publico;

        estado.exclusivo = {
            fotos: [],
            audios: [],
            videos: []
        };

        if (pastaUsuario) {
            for (const arquivo of pastaUsuario.arquivos) {
                if (
                    estado.exclusivo[arquivo.tipo]
                ) {
                    estado.exclusivo[arquivo.tipo].push(
                        arquivo
                    );
                }
            }
        }
    } else {
        const catalogoContents =
            await carregarCatalogoPorContents(
                configuracao
            );

        estado.publico =
            catalogoContents.publico;

        estado.exclusivo =
            catalogoContents.exclusivo;
    }

    for (const tipo of ["fotos", "audios", "videos"]) {
        estado.publico[tipo].sort(compararNomes);
        estado.exclusivo[tipo].sort(compararNomes);
    }

    renderizarCatalogoGaleria();
}

function renderizarCatalogoGaleria() {
    const publico = estado.publico;
    const exclusivo = estado.exclusivo;

    const fotos = [
        ...publico.fotos,
        ...exclusivo.fotos
    ];

    const audios = [
        ...publico.audios,
        ...exclusivo.audios
    ];

    const videos = [
        ...publico.videos,
        ...exclusivo.videos
    ];

    estado.arquivos = {
        fotos,
        audios,
        videos
    };

    if (typeof atualizarResumo === "function") {
        atualizarResumo();
    }

    if (typeof renderizarFotos === "function") {
        renderizarFotos();
    }

    if (typeof renderizarAudios === "function") {
        renderizarAudios();
    }

    if (typeof renderizarVideos === "function") {
        renderizarVideos();
    }

    estado.carregando = false;
}

async function iniciarCarregamentoGaleria() {
    try {
        await carregarCatalogo();
    } catch (erro) {
        console.error(
            "Falha ao carregar galeria:",
            erro
        );

        estado.carregando = false;

        const carregamentos = [
            "fotoLoading",
            "audioLoading",
            "videoLoading"
        ];

        for (const id of carregamentos) {
            const elemento =
                document.getElementById(id);

            if (elemento) {
                elemento.remove();
            }
        }

        const vazios = [
            "fotoEmpty",
            "audioEmpty",
            "videoEmpty"
        ];

        for (const id of vazios) {
            const elemento =
                document.getElementById(id);

            if (elemento) {
                elemento.classList.add("visible");
            }
        }

        console.error(erro);
    }
}

iniciarCarregamentoGaleria();
</script>
