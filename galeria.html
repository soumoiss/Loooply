<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f0ff">
<meta name="color-scheme" content="light">
<title>Momentos</title>
<link rel="preconnect" href="https://raw.githubusercontent.com">
<link rel="preconnect" href="https://api.github.com">

<style>
@font-face {
    font-family: "Quillen";
    src: local("Quillen"), url("Quillen.otf") format("opentype");
    font-display: swap;
    font-style: normal;
    font-weight: 400;
}

:root {
    --bg: #f4f0ff;
    --bg-2: #eee8ff;
    --surface: rgba(255,255,255,.93);
    --surface-soft: #f8f5ff;
    --primary: #9b5de5;
    --primary-strong: #8750cf;
    --primary-pale: #f4edff;
    --text: #29252f;
    --muted: #817b89;
    --line: rgba(102,82,126,.12);
    --shadow-sm: 0 5px 18px rgba(80,56,115,.07);
    --shadow-md: 0 16px 38px rgba(80,56,115,.11);
    --shadow-lg: 0 28px 80px rgba(65,45,94,.18);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    min-height: 100%;
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    color: var(--text);
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
        radial-gradient(circle at 10% -8%, rgba(177,131,255,.22), transparent 31%),
        radial-gradient(circle at 94% 8%, rgba(220,204,255,.48), transparent 28%),
        linear-gradient(135deg, var(--bg), var(--bg-2));
    padding:
        max(18px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        max(30px, env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    opacity: .34;
    background-image:
        linear-gradient(rgba(255,255,255,.35) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.25) 1px, transparent 1px);
    background-size: 38px 38px;
    mask-image: linear-gradient(to bottom, black, transparent 76%);
    -webkit-mask-image: linear-gradient(to bottom, black, transparent 76%);
}

button,
a {
    font: inherit;
    -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
a:focus-visible,
[tabindex]:focus-visible {
    outline: 3px solid rgba(155,93,229,.30);
    outline-offset: 3px;
}

button {
    border: 0;
}

.app-shell {
    width: min(100%, 1180px);
    margin: 0 auto;
    animation: pageIn .45s ease both;
}

@keyframes pageIn {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.topbar {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
}

.navigation-button,
.music-button {
    min-height: 46px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: rgba(255,255,255,.82);
    color: var(--primary-strong);
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
}

.navigation-button {
    min-width: 46px;
    padding: 7px 10px;
    display: inline-flex;
    align-items: center;
    justify-content: flex-start;
    gap: 7px;
    overflow: hidden;
}

.navigation-button:hover,
.music-button:hover {
    transform: translateY(-2px);
    background: #fff;
    box-shadow: var(--shadow-md);
}

.navigation-button:active,
.music-button:active {
    transform: scale(.96);
}

.navigation-button svg {
    width: 21px;
    height: 21px;
    flex: 0 0 21px;
}

.navigation-label {
    max-width: 0;
    overflow: hidden;
    opacity: 0;
    white-space: nowrap;
    font-size: 11px;
    font-weight: 800;
    transition: max-width .20s ease, opacity .20s ease;
}

.navigation-button:hover .navigation-label,
.navigation-button:focus-visible .navigation-label {
    max-width: 90px;
    opacity: 1;
}

.music-button {
    padding: 0 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-size: 12px;
    font-weight: 800;
}

.music-button svg {
    width: 19px;
    height: 19px;
    flex: 0 0 19px;
}

.container {
    width: 100%;
    padding: clamp(20px,4vw,34px);
    border: 1px solid rgba(120,92,155,.10);
    border-radius: 28px;
    background: var(--surface);
    box-shadow: var(--shadow-lg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
}

.hero {
    text-align: center;
    margin-bottom: 25px;
}

.hero h1 {
    font-family: "Quillen", Georgia, "Times New Roman", serif;
    font-size: clamp(38px,8vw,62px);
    font-weight: 400;
    line-height: 1.05;
    letter-spacing: .01em;
}

.overview {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    margin-bottom: 15px;
}

.contador {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 118px;
    padding: 10px 13px;
    border-radius: 15px;
    background: var(--primary-pale);
    border: 1px solid rgba(155,93,229,.14);
    color: var(--primary-strong);
    font-size: 13px;
    font-weight: 800;
}

.media-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 17px;
}

.media-tab {
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 0 15px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: rgba(255,255,255,.84);
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    font-weight: 800;
    box-shadow: 0 3px 12px rgba(80,56,115,.04);
    transition: transform .18s ease, background .18s ease, color .18s ease, border-color .18s ease, box-shadow .18s ease;
}

.media-tab:hover {
    transform: translateY(-1px);
    color: var(--primary-strong);
    border-color: rgba(155,93,229,.20);
}

.media-tab.active {
    color: #fff;
    background: var(--primary);
    border-color: var(--primary);
    box-shadow: 0 8px 20px rgba(155,93,229,.20);
}

.media-tab svg {
    width: 17px;
    height: 17px;
}

.section {
    display: none;
}

.section.active {
    display: block;
    animation: sectionIn .25s ease both;
}

@keyframes sectionIn {
    from {
        opacity: .2;
        transform: translateY(4px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 3px 1px 13px;
}

.section-head h2 {
    font-size: 20px;
    letter-spacing: -.02em;
}

.section-head p {
    color: var(--muted);
    font-size: 12px;
}

.galeria {
    column-count: 5;
    column-gap: 15px;
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 1px;
}

.media-card {
    position: relative;
    display: block;
    break-inside: avoid;
    margin: 0 0 15px;
    cursor: zoom-in;
    animation: mediaIn .35s ease both;
}

@keyframes mediaIn {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.photo-shell {
    position: relative;
    overflow: hidden;
    border-radius: 18px;
    background: linear-gradient(135deg,#f1eaff,#fff);
    border: 1px solid rgba(102,82,126,.10);
    box-shadow: 0 7px 18px rgba(80,56,115,.08);
}

.photo-shell img {
    width: 100%;
    height: auto;
    display: block;
    object-fit: contain;
    transition: transform .30s ease, opacity .30s ease;
}

.media-card:hover .photo-shell img,
.media-card:focus-visible .photo-shell img {
    transform: scale(1.018);
    opacity: .94;
}

.photo-overlay {
    position: absolute;
    inset: auto 0 0 0;
    padding: 30px 11px 11px;
    opacity: 0;
    transform: translateY(5px);
    background: linear-gradient(transparent,rgba(35,26,46,.55));
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    transition: opacity .22s ease, transform .22s ease;
    pointer-events: none;
}

.media-card:hover .photo-overlay,
.media-card:focus-visible .photo-overlay {
    opacity: 1;
    transform: translateY(0);
}

.media-grid {
    display: grid;
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 13px;
}

.media-panel {
    min-width: 0;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 20px;
    background: linear-gradient(135deg,#fff,#fbf9ff);
    box-shadow: var(--shadow-sm);
}

.media-panel h3 {
    font-family: "Quillen",Georgia,serif;
    font-size: 23px;
    font-weight: 400;
    margin-bottom: 12px;
}

.audio-item,
.video-item,
.exclusive-item {
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--surface-soft);
    padding: 12px;
    margin-bottom: 9px;
}

.audio-item:last-child,
.video-item:last-child,
.exclusive-item:last-child {
    margin-bottom: 0;
}

.media-name {
    display: block;
    color: var(--text);
    font-size: 12px;
    font-weight: 800;
    line-height: 1.4;
    overflow-wrap: anywhere;
    margin-bottom: 8px;
}

audio,
video {
    width: 100%;
    display: block;
    border-radius: 12px;
}

audio {
    min-height: 42px;
}

video {
    background: #151018;
    max-height: 460px;
    object-fit: contain;
}

.exclusive-content {
    display: grid;
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 13px;
}

.exclusive-item img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 12px;
}

.exclusive-item video {
    max-height: 500px;
}

.error-state {
    display: grid;
    gap: 7px;
    margin: 0 0 17px;
    padding: 18px 16px;
    border: 1px solid rgba(190,72,106,.18);
    border-radius: 18px;
    background: rgba(255,244,248,.88);
    color: #75616a;
    text-align: center;
}

.error-state[hidden] {
    display: none;
}

.error-state strong {
    color: #6f3047;
    font-family: "Quillen", Georgia, serif;
    font-size: 20px;
    font-weight: 400;
}

.error-state span {
    font-size: 12px;
    line-height: 1.5;
}

.error-state button {
    justify-self: center;
    min-height: 40px;
    padding: 0 15px;
    border: 1px solid rgba(155,93,229,.18);
    border-radius: 13px;
    background: #fff;
    color: var(--primary-strong);
    cursor: pointer;
    font-size: 12px;
    font-weight: 800;
}

.loading-state {
    min-height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.loader-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--primary);
    animation: pulse 1s ease-in-out infinite;
}

@keyframes pulse {
    0%,100% {
        opacity: .35;
        transform: scale(.85);
    }
    50% {
        opacity: 1;
        transform: scale(1);
    }
}

.empty-state {
    display: none;
    padding: 30px 16px;
    text-align: center;
    color: var(--muted);
    border: 1px dashed rgba(117,101,132,.16);
    border-radius: 18px;
    background: rgba(255,255,255,.48);
}

.empty-state.visible {
    display: block;
}

.empty-state strong {
    display: block;
    color: var(--text);
    font-family: "Quillen",Georgia,serif;
    font-size: 20px;
    font-weight: 400;
}

.lightbox {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
    background: rgba(41,33,51,.80);
    backdrop-filter: blur(13px);
    -webkit-backdrop-filter: blur(13px);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .24s ease,visibility .24s ease;
}

.lightbox.aberto {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

.lightbox-content {
    position: relative;
    width: min(96vw,1400px);
    max-height: 94vh;
    max-height: 94dvh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.lightbox-img {
    max-width: 96vw;
    max-height: 88vh;
    max-height: 88dvh;
    width: auto;
    height: auto;
    object-fit: contain;
    border-radius: 12px;
    box-shadow: 0 28px 80px rgba(0,0,0,.40);
}

.lightbox-close {
    position: fixed;
    top: max(16px,env(safe-area-inset-top));
    right: max(16px,env(safe-area-inset-right));
    width: 46px;
    height: 46px;
    border: 1px solid rgba(255,255,255,.30);
    border-radius: 50%;
    background: rgba(255,255,255,.12);
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 25px;
    line-height: 1;
    cursor: pointer;
    z-index: 3;
}

.lightbox-caption {
    position: fixed;
    left: 50%;
    bottom: max(16px,env(safe-area-inset-bottom));
    transform: translateX(-50%);
    max-width: min(90vw,760px);
    padding: 9px 14px;
    border-radius: 999px;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.18);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    text-align: center;
    overflow-wrap: anywhere;
}

@media (max-width:1180px) {
    .galeria {
        column-count: 4;
    }
}

@media (max-width:900px) {
    .galeria {
        column-count: 3;
    }

    .media-grid,
    .exclusive-content {
        grid-template-columns: 1fr;
    }
}

@media (max-width:680px) {
    body {
        padding-top: max(12px,env(safe-area-inset-top));
    }

    .container {
        padding: 19px 13px 16px;
        border-radius: 24px;
    }

    .topbar {
        margin-bottom: 9px;
    }

    .navigation-button,
    .music-button {
        min-width: 43px;
        width: 43px;
        min-height: 43px;
        height: 43px;
        border-radius: 14px;
    }

    .navigation-label {
        display: none;
    }

    .music-button {
        padding: 0;
    }

    .music-button span {
        display: none;
    }

    .galeria {
        column-count: 2;
        column-gap: 9px;
        padding: 0;
    }

    .media-card {
        margin-bottom: 9px;
    }

    .photo-shell {
        border-radius: 14px;
    }

    .overview {
        justify-content: flex-start;
    }

    .media-tab {
        flex: 1 1 calc(50% - 8px);
    }
}

@media (max-width:390px) {
    .galeria {
        column-count: 1;
    }

    .media-tab {
        flex-basis: 100%;
    }

    .hero h1 {
        font-size: 39px;
    }
}
</style>
</head>

<body>

<main class="app-shell">

    <div class="topbar">
        <button class="navigation-button" type="button" id="btnVoltar" aria-label="Voltar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5"></path>
                <path d="m12 19-7-7 7-7"></path>
            </svg>
            <span class="navigation-label">Voltar</span>
        </button>

        <button class="music-button" type="button" id="btnMusica" aria-label="Continuar música" title="Continuar música">
            <svg id="iconeMusica" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="m7 4 12 8-12 8z"></path>
            </svg>
            <span id="textoMusica">Música</span>
        </button>
    </div>

    <section class="container">

        <header class="hero">
            <h1>Momentos</h1>
        </header>

        <div class="overview">
            <div class="contador" id="contador">0 mídias</div>
        </div>

        <div class="error-state" id="galleryError" role="alert" hidden>
            <strong id="galleryErrorTitle">Não foi possível carregar a galeria.</strong>
            <span id="galleryErrorText">Tente novamente.</span>
            <button type="button" id="galleryRetry">Tentar novamente</button>
        </div>

        <div class="media-tabs" id="mediaTabs" role="tablist">

            <button class="media-tab active" type="button" role="tab" aria-selected="true" data-section="fotos">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="16" rx="3"></rect>
                    <circle cx="8.5" cy="9" r="1.5"></circle>
                    <path d="m5.5 17 4.5-4.5 3.5-3.5 6 6"></path>
                </svg>
                Fotos
            </button>

            <button class="media-tab" type="button" role="tab" aria-selected="false" data-section="audios">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18V5l11-2v13"></path>
                    <circle cx="6" cy="18" r="3"></circle>
                    <circle cx="17" cy="16" r="3"></circle>
                </svg>
                Áudios
            </button>

            <button class="media-tab" type="button" role="tab" aria-selected="false" data-section="videos">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="5" width="13" height="14" rx="2"></rect>
                    <path d="m16 10 5-3v10l-5-3z"></path>
                </svg>
                Vídeos
            </button>

            <button class="media-tab" type="button" role="tab" aria-selected="false" data-section="exclusivo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="10" width="16" height="10" rx="2"></rect>
                    <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                </svg>
                Exclusivo
            </button>

        </div>

        <section class="section active" id="section-fotos" role="tabpanel">
            <div class="section-head">
                <h2>Fotos</h2>
                <p id="fotoStatus"></p>
            </div>

            <div class="galeria" id="galeria"></div>

            <div class="loading-state" id="fotoLoading">
                <span class="loader-dot"></span>
            </div>

            <div class="empty-state" id="fotoEmpty">
                <strong>Não há foto</strong>
            </div>
        </section>

        <section class="section" id="section-audios" role="tabpanel" hidden>
            <div class="section-head">
                <h2>Áudios</h2>
                <p id="audioStatus"></p>
            </div>

            <div id="audios" class="media-grid"></div>

            <div class="loading-state" id="audioLoading">
                <span class="loader-dot"></span>
            </div>

            <div class="empty-state" id="audioEmpty">
                <strong>Não há áudio</strong>
            </div>
        </section>

        <section class="section" id="section-videos" role="tabpanel" hidden>
            <div class="section-head">
                <h2>Vídeos</h2>
                <p id="videoStatus"></p>
            </div>

            <div id="videos" class="media-grid"></div>

            <div class="loading-state" id="videoLoading">
                <span class="loader-dot"></span>
            </div>

            <div class="empty-state" id="videoEmpty">
                <strong>Não há vídeo</strong>
            </div>
        </section>

        <section class="section" id="section-exclusivo" role="tabpanel" hidden>
            <div class="section-head">
                <h2>Exclusivo</h2>
                <p id="exclusiveStatus"></p>
            </div>

            <div id="exclusivo" class="exclusive-content"></div>

            <div class="loading-state" id="exclusiveLoading">
                <span class="loader-dot"></span>
            </div>

            <div class="empty-state" id="exclusiveEmpty">
                <strong>Não há conteúdo exclusivo</strong>
            </div>
        </section>

    </section>
</main>

<audio id="temaMusical" preload="auto" loop playsinline></audio>

<div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true">
    <button class="lightbox-close" type="button" id="lightboxClose" aria-label="Fechar">×</button>
    <div class="lightbox-content" id="lightboxContent"></div>
    <div class="lightbox-caption" id="lightboxCaption"></div>
</div>

<script>
"use strict";

const EXTENSOES = {
    fotos: new Set(["jpg","jpeg","png","webp","gif","avif","bmp","svg","heic","heif","jfif","tif","tiff"]),
    audios: new Set(["mp3","m4a","wav","ogg","oga","aac","flac","opus"]),
    videos: new Set(["mp4","webm","mov","m4v","ogv","avi","mkv"])
};

const MIME_POR_EXTENSAO = {
    jpg:"image/jpeg", jpeg:"image/jpeg", png:"image/png", webp:"image/webp", gif:"image/gif",
    avif:"image/avif", bmp:"image/bmp", svg:"image/svg+xml", heic:"image/heic", heif:"image/heif",
    jfif:"image/jpeg", tif:"image/tiff", tiff:"image/tiff", mp3:"audio/mpeg", m4a:"audio/mp4",
    wav:"audio/wav", ogg:"audio/ogg", oga:"audio/ogg", aac:"audio/aac", flac:"audio/flac",
    opus:"audio/opus", mp4:"video/mp4", webm:"video/webm", mov:"video/quicktime", m4v:"video/mp4",
    ogv:"video/ogg", avi:"video/x-msvideo", mkv:"video/x-matroska"
};

const REPOSITORIO = {

    pastaMidia: "midia"
};

const API_VERSION = "2026-03-10";

function obterUsuario() {
    const bruto = String(localStorage.getItem("username") || "").trim().toLowerCase();
    return USUARIOS_VALIDOS.has(bruto) ? bruto : "";
}

function normalizarCaminho(caminho) {
    return String(caminho || "").replace(/^\/+|\/+$/g, "");
}

function obterExtensao(nome) {
    const base = String(nome || "").split("/").pop();
    const posicao = base.lastIndexOf(".");
    return posicao === -1 ? "" : base.slice(posicao + 1).toLowerCase();
}

function obterNomeSemExtensao(nome) {
    const base = String(nome || "").split("/").pop();
    const posicao = base.lastIndexOf(".");
    return posicao <= 0 ? base : base.slice(0, posicao);
}

function classificarArquivo(nome) {
    const extensao = obterExtensao(nome);
    if (EXTENSOES.fotos.has(extensao)) return "fotos";
    if (EXTENSOES.audios.has(extensao)) return "audios";
    if (EXTENSOES.videos.has(extensao)) return "videos";
    return null;
}

function tipoMimePorArquivo(arquivo) {
    return arquivo.mime || MIME_POR_EXTENSAO[obterExtensao(arquivo.nome)] || "";
}

function compararArquivos(a, b) {
    return String(a.caminho).localeCompare(String(b.caminho), "pt-BR", {
        numeric: true,
        sensitivity: "base"
    });
}

function deduplicarArquivos(lista) {
    const vistos = new Set();
    return lista.filter(arquivo => {
        const chave = String(arquivo?.caminho || "");
        if (!chave || vistos.has(chave)) return false;
        vistos.add(chave);
        return true;
    });
}

function detectarRepositorioAutomaticamente() {
    const configuracao = { ...REPOSITORIO };
    const host = window.location.hostname;
    const caminho = window.location.pathname.split("/").filter(Boolean);

    if (!configuracao.owner && host.endsWith(".github.io")) {
        configuracao.owner = host.split(".")[0];
    }

    if (!configuracao.repo && host.endsWith(".github.io") && caminho[0]) {
        configuracao.repo = caminho[0];
    }

    return configuracao;
}

function validarRepositorio(configuracao) {
    if (!configuracao.owner || !configuracao.repo || !configuracao.pastaMidia) {
        throw criarErro("CONFIG_INVALIDA", "A configuração do repositório está incompleta.");
    }
}

function criarErro(codigo, mensagem, detalhes = {}) {
    const erro = new Error(mensagem);
    erro.codigo = codigo;
    Object.assign(erro, detalhes);
    return erro;
}

function construirRawUrl(caminho, configuracao) {
    const partes = normalizarCaminho(caminho).split("/").filter(Boolean).map(encodeURIComponent);
    const branch = String(configuracao.branch || "").trim();
    if (!branch || !partes.length) {
        throw criarErro("URL_INVALIDA", "Não foi possível construir a URL da mídia.");
    }
    return `https://raw.githubusercontent.com/${encodeURIComponent(configuracao.owner)}/${encodeURIComponent(configuracao.repo)}/${encodeURIComponent(branch)}/${partes.join("/")}`;
}

async function lerJsonSeguro(resposta) {
    const texto = await resposta.text();
    if (!texto) return null;
    try {
        return JSON.parse(texto);
    } catch {
        throw criarErro("JSON_INVALIDO", "O GitHub retornou uma resposta que não pôde ser interpretada como JSON.", { status: resposta.status });
    }
}

async function githubFetch(url) {
    let resposta;

    try {
        resposta = await fetch(url, {
            method: "GET",
            cache: "no-store",
            headers: {
                Accept: "application/vnd.github+json",
                "X-GitHub-Api-Version": API_VERSION
            }
        });
    } catch (erro) {
        throw criarErro("REDE", "Não foi possível conectar à GitHub API.", { causa: erro });
    }

    const dados = await lerJsonSeguro(resposta);

    if (!resposta.ok) {
        const restante = resposta.headers.get("x-ratelimit-remaining");
        const reset = resposta.headers.get("x-ratelimit-reset");
        const mensagemApi = String(dados?.message || "").trim();
        let codigo = "HTTP";

        if (resposta.status === 404) codigo = "HTTP_404";
        else if (resposta.status === 403 && restante === "0") codigo = "RATE_LIMIT";
        else if (resposta.status === 429) codigo = "RATE_LIMIT";
        else if (resposta.status === 403) codigo = "HTTP_403";

        throw criarErro(codigo, mensagemApi || `GitHub API respondeu HTTP ${resposta.status}.`, {
            status: resposta.status,
            apiMessage: mensagemApi,
            rateRemaining: restante,
            rateReset: reset
        });
    }

    return dados;
}

async function obterConfiguracaoEfetiva() {
    const configuracao = detectarRepositorioAutomaticamente();
    validarRepositorio(configuracao);

    const url = `https://api.github.com/repos/${encodeURIComponent(configuracao.owner)}/${encodeURIComponent(configuracao.repo)}`;
    const dados = await githubFetch(url);

    if (!dados || typeof dados !== "object" || !String(dados.default_branch || "").trim()) {
        throw criarErro("REPOSITORIO_INVALIDO", "A resposta do GitHub não informou um branch padrão válido.");
    }

    configuracao.branch = String(dados.default_branch).trim();

    console.info("[Galeria] Repositório:", `${configuracao.owner}/${configuracao.repo}`);
    console.info("[Galeria] Branch:", configuracao.branch);
    console.info("[Galeria] Pasta de mídia:", configuracao.pastaMidia);

    return configuracao;
}

function criarObjetoMedia(item, configuracao) {
    const caminho = normalizarCaminho(item?.path);
    const nome = caminho.split("/").pop();
    const tipo = classificarArquivo(nome);

    if (!caminho || !nome || !tipo || item?.type !== "blob") return null;

    return {
        nome,
        caminho,
        url: construirRawUrl(caminho, configuracao),
        apiUrl: String(item.url || ""),
        sha: String(item.sha || ""),
        tamanho: Number(item.size || 0),
        mime: String(item.mime_type || MIME_POR_EXTENSAO[obterExtensao(nome)] || ""),
        tipo
    };
}

function caminhoEhCompartilhado(caminho, pastaMidia) {
    const prefixo = `${normalizarCaminho(pastaMidia)}/`;
    const relativo = normalizarCaminho(caminho).slice(prefixo.length);
    return relativo.length > 0 && !relativo.includes("/");
}

function caminhoEhDoUsuario(caminho, pastaMidia, usuario) {
    if (!usuario) return false;

    const prefixo = `${normalizarCaminho(pastaMidia)}/`;
    const caminhoNormalizado = normalizarCaminho(caminho);
    const partes = caminhoNormalizado.split("/");

    if (partes.length < 3 || partes[0].toLowerCase() !== normalizarCaminho(pastaMidia).toLowerCase()) {
        return false;
    }

    return partes[1].toLowerCase() === usuario.toLowerCase() && caminhoNormalizado.toLowerCase().startsWith(prefixo.toLowerCase());
}

function montarCatalogoDaTree(dados, configuracao, usuario) {
    if (!dados || typeof dados !== "object" || !Array.isArray(dados.tree)) {
        throw criarErro("TREE_INVALIDA", "A GitHub API não retornou uma árvore válida do repositório.");
    }

    if (dados.truncated === true) {
        return null;
    }

    const pasta = normalizarCaminho(configuracao.pastaMidia);
    const prefixo = `${pasta}/`;
    const tema = `${prefixo}tema.mp3`.toLowerCase();
    const compartilhado = { fotos: [], audios: [], videos: [] };
    const exclusivo = [];

    for (const item of dados.tree) {
        if (!item || item.type !== "blob" || !item.path) continue;

        const caminho = normalizarCaminho(item.path);
        if (!caminho.toLowerCase().startsWith(prefixo.toLowerCase())) continue;

        if (caminho.toLowerCase() === tema) continue;

        const arquivo = criarObjetoMedia(item, configuracao);
        if (!arquivo) continue;

        if (caminhoEhCompartilhado(caminho, pasta)) {
            compartilhado[arquivo.tipo].push(arquivo);
        } else if (caminhoEhDoUsuario(caminho, pasta, usuario)) {
            exclusivo.push(arquivo);
        }
    }

    return {
        compartilhado: {
            fotos: deduplicarArquivos(compartilhado.fotos).sort(compararArquivos),
            audios: deduplicarArquivos(compartilhado.audios).sort(compararArquivos),
            videos: deduplicarArquivos(compartilhado.videos).sort(compararArquivos)
        },
        exclusivo: deduplicarArquivos(exclusivo).sort(compararArquivos)
    };
}

async function listarConteudoRecursivo(caminho, configuracao, resultado = []) {
    const caminhoSeguro = normalizarCaminho(caminho);
    const url = `https://api.github.com/repos/${encodeURIComponent(configuracao.owner)}/${encodeURIComponent(configuracao.repo)}/contents/${caminhoSeguro.split("/").map(encodeURIComponent).join("/")}?ref=${encodeURIComponent(configuracao.branch)}`;
    const dados = await githubFetch(url);

    if (!Array.isArray(dados)) {
        throw criarErro("CONTEUDO_INVALIDO", `O caminho ${caminhoSeguro} não retornou uma lista de conteúdo.`);
    }

    for (const item of dados) {
        if (!item || !item.type || !item.path) continue;
        if (item.type === "dir") {
            await listarConteudoRecursivo(item.path, configuracao, resultado);
            continue;
        }
        if (item.type === "file") resultado.push(item);
    }

    return resultado;
}

async function carregarCatalogoViaFallback(configuracao, usuario) {
    const itensMidia = await listarConteudoRecursivo(configuracao.pastaMidia, configuracao);
    const dados = { tree: itensMidia.map(item => ({
        type: "blob",
        path: item.path,
        sha: item.sha,
        size: item.size,
        url: item.url,
        mime_type: item.mime_type
    })) };
    return montarCatalogoDaTree(dados, configuracao, usuario);
}

async function carregarCatalogoDoGitHub() {
    const configuracao = await obterConfiguracaoEfetiva();
    const treeUrl = `https://api.github.com/repos/${encodeURIComponent(configuracao.owner)}/${encodeURIComponent(configuracao.repo)}/git/trees/${encodeURIComponent(configuracao.branch)}?recursive=1`;
    const dadosTree = await githubFetch(treeUrl);
    let catalogo = montarCatalogoDaTree(dadosTree, configuracao, estado.usuario);

    if (catalogo === null) {
        console.warn("[Galeria] A árvore recursiva foi truncada; usando consulta de conteúdo como fallback.");
        catalogo = await carregarCatalogoViaFallback(configuracao, estado.usuario);
    }

    if (!catalogo) {
        throw criarErro("CATALOGO_INVALIDO", "Não foi possível montar o catálogo de mídia.");
    }

    const total = catalogo.compartilhado.fotos.length + catalogo.compartilhado.audios.length + catalogo.compartilhado.videos.length;
    console.info("[Galeria] Usuário:", estado.usuario || "não identificado");
    console.info("[Galeria] Mídia compartilhada:", total);
    console.info("[Galeria] Fotos:", catalogo.compartilhado.fotos.length);
    console.info("[Galeria] Áudios:", catalogo.compartilhado.audios.length);
    console.info("[Galeria] Vídeos:", catalogo.compartilhado.videos.length);
    console.info("[Galeria] Exclusivos:", catalogo.exclusivo.length);

    return { configuracao, catalogo };
}

function mensagemDeErro(erro) {
    if (erro?.codigo === "RATE_LIMIT") {
        return ["Não foi possível carregar a galeria agora.", "O GitHub limitou temporariamente as consultas. Tente novamente mais tarde."];
    }
    if (erro?.codigo === "HTTP_404") {
        return ["Não foi possível carregar a galeria.", "O repositório ou o branch configurado não foi encontrado no GitHub."];
    }
    if (erro?.codigo === "HTTP_403") {
        return ["Não foi possível carregar a galeria.", "O GitHub recusou a consulta à API."];
    }
    if (erro?.codigo === "REDE") {
        return ["Não foi possível carregar a galeria.", "Não foi possível conectar à GitHub API. Verifique a conexão e tente novamente."];
    }
    if (erro?.codigo === "JSON_INVALIDO") {
        return ["Não foi possível carregar a galeria.", "O GitHub enviou uma resposta inesperada."];
    }
    return ["Não foi possível carregar a galeria.", "Falha ao consultar o GitHub API."];
}

function mostrarEstadoErro(erro) {
    const [titulo, texto] = mensagemDeErro(erro);
    galleryErrorTitle.textContent = titulo;
    galleryErrorText.textContent = texto;
    galleryError.hidden = false;
    console.error("[Galeria] Falha no carregamento:", erro);
}

function esconderEstadoErro() {
    galleryError.hidden = true;
}

function definirCarregando(ativo) {
    document.getElementById("fotoLoading").style.display = ativo ? "flex" : "none";
    document.getElementById("audioLoading").style.display = ativo ? "flex" : "none";
    document.getElementById("videoLoading").style.display = ativo ? "flex" : "none";
    document.getElementById("exclusiveLoading").style.display = ativo ? "flex" : "none";
}

function limparEstadosVazios() {
    ["fotoEmpty", "audioEmpty", "videoEmpty", "exclusiveEmpty"].forEach(id => {
        document.getElementById(id).classList.remove("visible");
    });
}

function aplicarCatalogo(resultado) {
    estado.configuracao = resultado.configuracao;
    estado.arquivos = resultado.catalogo.compartilhado;
    estado.exclusivo = resultado.catalogo.exclusivo;
    estado.carregamento = "success";
    estado.secoesRenderizadas = { fotos: false, audios: false, videos: false, exclusivo: false };

    atualizarResumo();
    limparEstadosVazios();
    definirCarregando(false);
    renderizarFotos();
    configurarMusica(estado.configuracao);
}

async function carregarCatalogo({ forcar = false } = {}) {
    if (!forcar && estado.carregamento === "success") return;
    if (!forcar && estado.promessaCatalogo) return estado.promessaCatalogo;

    estado.carregamento = "loading";
    esconderEstadoErro();
    limparEstadosVazios();
    definirCarregando(true);
    document.getElementById("galeria").replaceChildren();

    estado.promessaCatalogo = carregarCatalogoDoGitHub()
        .then(aplicarCatalogo)
        .catch(erro => {
            estado.carregamento = "error";
            estado.arquivos = { fotos: [], audios: [], videos: [] };
            estado.exclusivo = [];
            estado.configuracao = null;
            definirCarregando(false);
            atualizarResumo();
            mostrarEstadoErro(erro);
            atualizarBotaoMusica(false);
            throw erro;
        })
        .finally(() => {
            estado.promessaCatalogo = null;
        });

    return estado.promessaCatalogo;
}

function atualizarResumo() {
    const total = estado.arquivos.fotos.length + estado.arquivos.audios.length + estado.arquivos.videos.length;
    document.getElementById("contador").textContent = `${total} ${total === 1 ? "mídia" : "mídias"}`;
    document.getElementById("fotoStatus").textContent = `${estado.arquivos.fotos.length} ${estado.arquivos.fotos.length === 1 ? "foto" : "fotos"}`;
    document.getElementById("audioStatus").textContent = `${estado.arquivos.audios.length} ${estado.arquivos.audios.length === 1 ? "áudio" : "áudios"}`;
    document.getElementById("videoStatus").textContent = `${estado.arquivos.videos.length} ${estado.arquivos.videos.length === 1 ? "vídeo" : "vídeos"}`;
    document.getElementById("exclusiveStatus").textContent = `${estado.exclusivo.length} ${estado.exclusivo.length === 1 ? "arquivo" : "arquivos"}`;
}

function removerLoading(id) {
    document.getElementById(id)?.remove();
}

function renderizarFotos() {
    const container = document.getElementById("galeria");
    container.replaceChildren();
    removerLoading("fotoLoading");
    estado.secoesRenderizadas.fotos = true;

    const fotos = estado.arquivos.fotos;
    const vazio = document.getElementById("fotoEmpty");
    vazio.classList.toggle("visible", estado.carregamento === "success" && fotos.length === 0);

    if (!fotos.length) return;

    fotos.slice(0, 12).forEach((arquivo, index) => container.appendChild(criarCartaoFoto(arquivo, fotos, index)));

    let proximo = 12;
    const carregarLote = () => {
        const limite = Math.min(proximo + 12, fotos.length);
        for (let index = proximo; index < limite; index++) {
            container.appendChild(criarCartaoFoto(fotos[index], fotos, index));
        }
        proximo = limite;
        if (proximo < fotos.length) requestAnimationFrame(carregarLote);
    };
    if (proximo < fotos.length) requestAnimationFrame(carregarLote);
}

function criarCartaoFoto(arquivo, lista, index) {
    const card = document.createElement("article");
    card.className = "media-card";
    card.tabIndex = 0;
    card.setAttribute("role", "button");
    card.setAttribute("aria-label", `Abrir ${arquivo.nome}`);

    const shell = document.createElement("div");
    shell.className = "photo-shell";

    const imagem = document.createElement("img");
    imagem.loading = index < 8 ? "eager" : "lazy";
    imagem.decoding = "async";
    imagem.alt = arquivo.nome;
    imagem.src = arquivo.url;

    const overlay = document.createElement("div");
    overlay.className = "photo-overlay";
    overlay.textContent = obterNomeSemExtensao(arquivo.nome);

    imagem.addEventListener("error", () => {
        shell.classList.add("media-load-error");
        overlay.textContent = `${obterNomeSemExtensao(arquivo.nome)} • não foi possível exibir`;
    }, { once: true });

    shell.append(imagem, overlay);
    card.appendChild(shell);

    const abrir = () => abrirLightbox(arquivo, card);
    card.addEventListener("click", abrir);
    card.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            abrir();
        }
    });

    return card;
}

function renderizarAudios() {
    estado.secoesRenderizadas.audios = true;
    const container = document.getElementById("audios");
    container.replaceChildren();
    removerLoading("audioLoading");

    const vazio = document.getElementById("audioEmpty");
    vazio.classList.toggle("visible", estado.carregamento === "success" && estado.arquivos.audios.length === 0);
    if (!estado.arquivos.audios.length) return;

    const panel = document.createElement("article");
    panel.className = "media-panel";
    const titulo = document.createElement("h3");
    titulo.textContent = "Áudios";
    panel.appendChild(titulo);

    estado.arquivos.audios.forEach(arquivo => {
        const item = document.createElement("div");
        item.className = "audio-item";
        const nome = document.createElement("span");
        nome.className = "media-name";
        nome.textContent = arquivo.nome;
        const player = document.createElement("audio");
        player.controls = true;
        player.preload = "none";
        player.playsInline = true;
        player.src = arquivo.url;
        const falha = document.createElement("span");
        falha.className = "media-name";
        falha.hidden = true;
        falha.textContent = "Não foi possível reproduzir este áudio.";
        player.addEventListener("error", () => {
            falha.hidden = false;
            console.warn("[Galeria] Falha ao carregar áudio:", arquivo.caminho);
        }, { once: true });
        item.append(nome, player, falha);
        panel.appendChild(item);
    });
    container.appendChild(panel);
}

function renderizarVideos() {
    estado.secoesRenderizadas.videos = true;
    const container = document.getElementById("videos");
    container.replaceChildren();
    removerLoading("videoLoading");

    const vazio = document.getElementById("videoEmpty");
    vazio.classList.toggle("visible", estado.carregamento === "success" && estado.arquivos.videos.length === 0);
    if (!estado.arquivos.videos.length) return;

    const panel = document.createElement("article");
    panel.className = "media-panel";
    const titulo = document.createElement("h3");
    titulo.textContent = "Vídeos";
    panel.appendChild(titulo);

    estado.arquivos.videos.forEach(arquivo => {
        const item = document.createElement("div");
        item.className = "video-item";
        const nome = document.createElement("span");
        nome.className = "media-name";
        nome.textContent = arquivo.nome;
        const player = document.createElement("video");
        player.controls = true;
        player.preload = "metadata";
        player.playsInline = true;
        player.src = arquivo.url;
        const mime = tipoMimePorArquivo(arquivo);
        if (mime) player.setAttribute("type", mime);
        const falha = document.createElement("span");
        falha.className = "media-name";
        falha.hidden = true;
        falha.textContent = "Não foi possível reproduzir este vídeo.";
        player.addEventListener("error", () => {
            falha.hidden = false;
            console.warn("[Galeria] Falha ao carregar vídeo:", arquivo.caminho);
        }, { once: true });
        item.append(nome, player, falha);
        panel.appendChild(item);
    });
    container.appendChild(panel);
}

function renderizarExclusivo() {
    estado.secoesRenderizadas.exclusivo = true;
    const container = document.getElementById("exclusivo");
    container.replaceChildren();
    removerLoading("exclusiveLoading");

    const vazio = document.getElementById("exclusiveEmpty");
    vazio.classList.toggle("visible", estado.carregamento === "success" && estado.exclusivo.length === 0);
    if (!estado.exclusivo.length) return;

    estado.exclusivo.forEach(arquivo => {
        const item = document.createElement("article");
        item.className = "exclusive-item";
        const nome = document.createElement("span");
        nome.className = "media-name";
        nome.textContent = arquivo.nome;
        item.appendChild(nome);

        if (arquivo.tipo === "fotos") {
            const imagem = document.createElement("img");
            imagem.loading = "lazy";
            imagem.decoding = "async";
            imagem.src = arquivo.url;
            imagem.alt = arquivo.nome;
            imagem.addEventListener("error", () => {
                imagem.remove();
                const falha = document.createElement("span");
                falha.className = "media-name";
                falha.textContent = "Não foi possível exibir esta imagem.";
                item.appendChild(falha);
            }, { once: true });
            item.appendChild(imagem);
        } else if (arquivo.tipo === "audios") {
            const audio = document.createElement("audio");
            audio.controls = true;
            audio.preload = "none";
            audio.src = arquivo.url;
            audio.addEventListener("error", () => console.warn("[Galeria] Falha ao carregar áudio exclusivo:", arquivo.caminho), { once: true });
            item.appendChild(audio);
        } else {
            const video = document.createElement("video");
            video.controls = true;
            video.preload = "metadata";
            video.playsInline = true;
            video.src = arquivo.url;
            const mime = tipoMimePorArquivo(arquivo);
            if (mime) video.setAttribute("type", mime);
            video.addEventListener("error", () => console.warn("[Galeria] Falha ao carregar vídeo exclusivo:", arquivo.caminho), { once: true });
            item.appendChild(video);
        }
        container.appendChild(item);
    });
}

function atualizarBotaoMusica(tocando) {
    textoMusica.textContent = "Música";
    if (tocando) {
        btnMusica.title = "Pausar música";
        btnMusica.setAttribute("aria-label", "Pausar música");
        iconeMusica.innerHTML = '<rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect>';
    } else {
        btnMusica.title = "Continuar música";
        btnMusica.setAttribute("aria-label", "Continuar música");
        iconeMusica.innerHTML = '<path d="m7 4 12 8-12 8z"></path>';
    }
}

function configurarMusica(configuracao) {
    const url = construirRawUrl(`${configuracao.pastaMidia}/tema.mp3`, configuracao);
    audioTema.src = url;
    audioTema.loop = true;
    audioTema.preload = "none";
    audioTema.load();
    estado.musicaPausadaManualmente = false;
    tentarAutoplay();
}

async function tentarAutoplay() {
    if (!audioTema.src || estado.musicaPausadaManualmente) return;
    try {
        await audioTema.play();
        atualizarBotaoMusica(true);
        removerListenersDeAutoplay();
    } catch {
        atualizarBotaoMusica(false);
    }
}

function removerListenersDeAutoplay() {
    document.removeEventListener("pointerdown", lidarInteracaoAutoplay);
    document.removeEventListener("touchstart", lidarInteracaoAutoplay);
    document.removeEventListener("keydown", lidarInteracaoAutoplay);
}

function lidarInteracaoAutoplay(event) {
    if (event.target instanceof Element && event.target.closest("#btnMusica")) return;
    tentarAutoplay();
}

async function alternarMusica() {
    if (audioTema.paused) {
        estado.musicaPausadaManualmente = false;
        await tentarAutoplay();
    } else {
        estado.musicaPausadaManualmente = true;
        audioTema.pause();
        atualizarBotaoMusica(false);
    }
}

btnMusica.addEventListener("click", alternarMusica);
document.addEventListener("pointerdown", lidarInteracaoAutoplay);
document.addEventListener("touchstart", lidarInteracaoAutoplay);
document.addEventListener("keydown", lidarInteracaoAutoplay);
audioTema.addEventListener("play", () => atualizarBotaoMusica(true));
audioTema.addEventListener("pause", () => atualizarBotaoMusica(false));
audioTema.addEventListener("error", () => atualizarBotaoMusica(false));

function abrirLightbox(arquivo, origem) {
    const lightbox = document.getElementById("lightbox");
    const content = document.getElementById("lightboxContent");
    const caption = document.getElementById("lightboxCaption");
    estado.ultimaFocada = origem;
    estado.lightboxAberto = true;
    content.replaceChildren();

    const imagem = document.createElement("img");
    imagem.className = "lightbox-img";
    imagem.src = arquivo.url;
    imagem.alt = arquivo.nome;
    imagem.addEventListener("error", () => {
        content.textContent = "Não foi possível exibir esta imagem.";
        console.warn("[Galeria] Falha no lightbox:", arquivo.caminho);
    }, { once: true });

    content.appendChild(imagem);
    caption.textContent = arquivo.nome;
    lightbox.classList.add("aberto");
    lightbox.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";

    if (!history.state?.momentosLightbox) {
        history.pushState({ ...(history.state || {}), momentosLightbox: true }, "");
        estado.lightboxUsouHistorico = true;
    }
}

function fecharLightbox(viaHistorico = false) {
    const lightbox = document.getElementById("lightbox");
    if (!estado.lightboxAberto) return;
    estado.lightboxAberto = false;
    lightbox.classList.remove("aberto");
    lightbox.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    document.getElementById("lightboxContent").replaceChildren();
    document.getElementById("lightboxCaption").textContent = "";

    const foco = estado.ultimaFocada;
    estado.ultimaFocada = null;

    if (!viaHistorico && estado.lightboxUsouHistorico && history.state?.momentosLightbox) {
        estado.lightboxUsouHistorico = false;
        history.back();
        return;
    }
    estado.lightboxUsouHistorico = false;
    if (foco && typeof foco.focus === "function") requestAnimationFrame(() => foco.focus());
}

document.getElementById("lightboxClose").addEventListener("click", () => fecharLightbox());
document.getElementById("lightbox").addEventListener("click", event => {
    if (event.target.id === "lightbox") fecharLightbox();
});
document.addEventListener("keydown", event => {
    if (event.key === "Escape" && estado.lightboxAberto) fecharLightbox();
});
window.addEventListener("popstate", () => {
    if (estado.lightboxAberto) fecharLightbox(true);
});

function renderizarSecao(nome) {
    if (estado.carregamento !== "success") return;
    if (estado.secoesRenderizadas[nome]) return;
    if (nome === "audios") renderizarAudios();
    else if (nome === "videos") renderizarVideos();
    else if (nome === "exclusivo") renderizarExclusivo();
}

function trocarSecao(nome) {
    document.querySelectorAll(".media-tab").forEach(botao => {
        const ativo = botao.dataset.section === nome;
        botao.classList.toggle("active", ativo);
        botao.setAttribute("aria-selected", String(ativo));
    });
    document.querySelectorAll(".section").forEach(secao => {
        const ativo = secao.id === `section-${nome}`;
        secao.classList.toggle("active", ativo);
        secao.hidden = !ativo;
    });
    renderizarSecao(nome);
}

document.querySelectorAll(".media-tab").forEach(botao => {
    botao.addEventListener("click", () => trocarSecao(botao.dataset.section));
});

document.getElementById("btnVoltar").addEventListener("click", () => {
    window.location.href = "home.html";
});

galleryRetry.addEventListener("click", () => {
    carregarCatalogo({ forcar: true }).catch(() => {});
});

async function iniciar() {
    estado.usuario = obterUsuario();
    console.info("[Galeria] Usuário normalizado:", estado.usuario || "não identificado");
    try {
        await carregarCatalogo();
    } catch {
        // O estado visual e o console já foram atualizados por carregarCatalogo().
    }
}

iniciar();
</script>
