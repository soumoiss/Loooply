<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#17131c">
<title>Nossos Momentos</title>

<style>
@font-face {
    font-family: Quillen;
    src: url("Quillen.otf") format("opentype");
}

:root {
    --bg: #f8f4fb;
    --surface: #ffffff;
    --surface-soft: #fbf8fd;
    --primary: #9857dc;
    --primary-dark: #7740b6;
    --primary-soft: #f0e4fb;
    --accent: #d58fbf;
    --text: #28242d;
    --muted: #85808a;
    --border: #e8e2eb;
    --shadow: 0 12px 35px rgba(102, 58, 140, .10);
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top left, rgba(190, 137, 238, .14), transparent 32%),
        radial-gradient(circle at bottom right, rgba(222, 154, 196, .12), transparent 30%),
        var(--bg);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
}

button {
    font: inherit;
}

.app {
    width: min(100%, 760px);
    min-height: 100vh;
    margin: 0 auto;
    background: rgba(255, 255, 255, .82);
    box-shadow: 0 0 50px rgba(82, 46, 108, .08);
    overflow: hidden;
}

.topbar {
    position: sticky;
    top: 0;
    z-index: 30;
    height: 64px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 18px;
    background: rgba(255, 255, 255, .92);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(18px);
}

.back-button {
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 14px;
    display: grid;
    place-items: center;
    background: var(--primary-soft);
    color: var(--primary-dark);
    cursor: pointer;
    font-size: 24px;
    transition: .2s ease;
}

.back-button:active {
    transform: scale(.94);
}

.top-title {
    flex: 1;
    min-width: 0;
    font-family: Quillen, Georgia, serif;
    font-size: 24px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.hero {
    padding: 34px 24px 18px;
    text-align: center;
}

.hero-title {
    margin: 0;
    font-family: Quillen, Georgia, serif;
    font-size: clamp(34px, 8vw, 52px);
    line-height: 1;
    color: var(--primary-dark);
    font-weight: 400;
}

.hero-subtitle {
    max-width: 590px;
    margin: 15px auto 0;
    color: #77717c;
    font-size: 20px;
    line-height: 1.45;
}

.content {
    padding: 0 20px 40px;
}

.counter {
    width: fit-content;
    min-width: 150px;
    margin: 16px 0 22px;
    padding: 13px 25px;
    border: 1px solid #eadcf5;
    border-radius: 999px;
    background: var(--primary-soft);
    color: var(--primary-dark);
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
}

.tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 26px;
}

.tab {
    min-height: 64px;
    border: 1px solid var(--border);
    border-radius: 22px;
    background: var(--surface);
    color: #807b84;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 5px 18px rgba(91, 50, 120, .04);
    transition: .25s ease;
}

.tab.active {
    background: linear-gradient(135deg, #a45be2, #8e4fd0);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 12px 25px rgba(142, 79, 208, .23);
}

.tab-icon {
    font-size: 21px;
    line-height: 1;
}

.section {
    display: none;
}

.section.active {
    display: block;
    animation: appear .3s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.section-title {
    margin: 0 0 7px;
    font-family: Quillen, Georgia, serif;
    font-size: 31px;
    font-weight: 400;
    color: var(--text);
}

.section-status {
    margin: 0 0 18px;
    color: var(--muted);
    font-family: Arial, sans-serif;
    font-size: 14px;
}

.photo-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}

.photo-card {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    padding: 0;
    overflow: hidden;
    border: 0;
    border-radius: 20px;
    background: #eee8f1;
    box-shadow: var(--shadow);
    cursor: pointer;
}

.photo-card img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    transition: transform .45s ease;
}

.photo-card:active img {
    transform: scale(1.035);
}

.media-list {
    display: grid;
    gap: 12px;
}

.audio-card,
.video-card {
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 22px;
    background: var(--surface);
    box-shadow: var(--shadow);
}

.audio-card audio {
    width: 100%;
    display: block;
}

.video-card video {
    width: 100%;
    max-height: 430px;
    display: block;
    border-radius: 15px;
    background: #111;
}

.media-name {
    margin: 0 0 12px;
    color: var(--text);
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: 700;
    word-break: break-word;
}

.empty {
    padding: 54px 20px;
    border: 1px dashed #e4dce7;
    border-radius: 24px;
    background: rgba(255, 255, 255, .55);
    text-align: center;
}

.empty-title {
    margin: 0;
    color: #302b34;
    font-size: 25px;
}

.exclusive-box {
    margin-bottom: 20px;
    padding: 18px;
    border: 1px solid #e7d8f2;
    border-radius: 24px;
    background: linear-gradient(145deg, #fcf8ff, #f5ecfc);
}

.exclusive-title {
    margin: 0;
    color: var(--primary-dark);
    font-family: Arial, sans-serif;
    font-size: 16px;
    font-weight: 700;
}

.exclusive-tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 14px;
}

.exclusive-tab {
    min-height: 42px;
    border: 1px solid #e3d8eb;
    border-radius: 14px;
    background: #fff;
    color: #827b87;
    font-family: Arial, sans-serif;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
}

.exclusive-tab.active {
    border-color: transparent;
    background: var(--primary);
    color: #fff;
}

.exclusive-content {
    display: none;
}

.exclusive-content.active {
    display: block;
}

.lightbox {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(20, 14, 24, .94);
    backdrop-filter: blur(12px);
}

.lightbox.active {
    display: flex;
}

.lightbox img {
    max-width: 100%;
    max-height: 88vh;
    object-fit: contain;
    border-radius: 12px;
    box-shadow: 0 20px 70px rgba(0, 0, 0, .4);
}

.lightbox-close {
    position: fixed;
    top: 18px;
    right: 18px;
    width: 46px;
    height: 46px;
    border: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, .14);
    color: #fff;
    font-size: 28px;
    cursor: pointer;
}

.home-button {
    width: 100%;
    min-height: 52px;
    margin-top: 28px;
    border: 1px solid #dfd2e7;
    border-radius: 18px;
    background: #fff;
    color: var(--primary-dark);
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
}

@media (max-width: 560px) {
    .topbar {
        padding: 0 14px;
    }

    .hero {
        padding: 28px 18px 16px;
    }

    .hero-title {
        font-size: 38px;
    }

    .hero-subtitle {
        font-size: 18px;
    }

    .content {
        padding: 0 14px 34px;
    }

    .tabs {
        grid-template-columns: repeat(2, 1fr);
    }

    .tab {
        min-height: 58px;
    }

    .photo-grid {
        gap: 9px;
    }

    .exclusive-tabs {
        gap: 6px;
    }
}

@media (max-width: 360px) {
    .tabs {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="topbar">
        <button class="back-button" type="button" id="back-button" aria-label="Voltar">‹</button>
        <div class="top-title">Nossos Momentos</div>
    </header>

    <main>

        <section class="hero">
            <h1 class="hero-title">Nossos Momentos</h1>
            <p class="hero-subtitle">Pequenos pedacinhos de nós, quero deixar guardados aqui ♡</p>
        </section>

        <div class="content">

            <div class="counter" id="counter">0 mídias</div>

            <nav class="tabs">
                <button class="tab active" type="button" data-tab="fotos">
                    <span class="tab-icon">▧</span>
                    <span>Fotos</span>
                </button>

                <button class="tab" type="button" data-tab="audios">
                    <span class="tab-icon">♫</span>
                    <span>Áudios</span>
                </button>

                <button class="tab" type="button" data-tab="videos">
                    <span class="tab-icon">▹</span>
                    <span>Vídeos</span>
                </button>

                <button class="tab" type="button" data-tab="exclusivo">
                    <span class="tab-icon">♧</span>
                    <span>Exclusivo</span>
                </button>
            </nav>

            <section class="section active" id="section-fotos">
                <h2 class="section-title">Momentos</h2>
                <p class="section-status" id="foto-status">Carregando...</p>
                <div id="fotos-container"></div>
            </section>

            <section class="section" id="section-audios">
                <h2 class="section-title">Áudios</h2>
                <p class="section-status" id="audio-status">Carregando...</p>
                <div id="audios-container"></div>
            </section>

            <section class="section" id="section-videos">
                <h2 class="section-title">Vídeos</h2>
                <p class="section-status" id="video-status">Carregando...</p>
                <div id="videos-container"></div>
            </section>

            <section class="section" id="section-exclusivo">
                <div class="exclusive-box">
                    <h2 class="exclusive-title">Conteúdo Exclusivo</h2>

                    <div class="exclusive-tabs">
                        <button class="exclusive-tab active" type="button" data-exclusive="fotos">Fotos</button>
                        <button class="exclusive-tab" type="button" data-exclusive="audios">Áudios</button>
                        <button class="exclusive-tab" type="button" data-exclusive="videos">Vídeos</button>
                    </div>
                </div>

                <div class="exclusive-content active" id="exclusive-fotos">
                    <div id="exclusive-fotos-container"></div>
                </div>

                <div class="exclusive-content" id="exclusive-audios">
                    <div id="exclusive-audios-container"></div>
                </div>

                <div class="exclusive-content" id="exclusive-videos">
                    <div id="exclusive-videos-container"></div>
                </div>
            </section>

            <button class="home-button" type="button" id="home-button">
                Voltar para home
            </button>

        </div>

    </main>
</div>

<div class="lightbox" id="lightbox">
    <button class="lightbox-close" type="button" id="lightbox-close" aria-label="Fechar">×</button>
    <img id="lightbox-image" src="" alt="">
</div>

<script>
const REPOSITORIO = {
    owner: "",
    repo: "",
    branch: "",
    pastaMidia: "midia"
};

const EXTENSOES = {
    imagens: ["jpg", "jpeg", "png", "gif", "webp", "avif", "bmp", "svg"],
    audios: ["mp3", "wav", "ogg", "m4a", "aac", "flac", "opus"],
    videos: ["mp4", "webm", "mov", "m4v", "avi", "mkv"]
};

let catalogoPublico = {
    fotos: [],
    audios: [],
    videos: []
};

let catalogoExclusivo = {
    fotos: [],
    audios: [],
    videos: []
};

let branchAtual = "";
let repositorioAtual = {
    owner: "",
    repo: ""
};

let historicoLightbox = false;

function normalizarTexto(valor) {
    return String(valor || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[^a-z0-9]/g, "");
}

function extrairUsuario(valor) {
    if (!valor) {
        return "";
    }

    if (typeof valor === "object") {
        return valor.nome ||
            valor.username ||
            valor.usuario ||
            valor.user ||
            valor.name ||
            "";
    }

    const texto = String(valor).trim();

    try {
        const objeto = JSON.parse(texto);

        if (objeto && typeof objeto === "object") {
            return objeto.nome ||
                objeto.username ||
                objeto.usuario ||
                objeto.user ||
                objeto.name ||
                "";
        }
    } catch (_) {}

    return texto;
}

function obterUsuarioAtual() {
    const chaves = [
        "username",
        "usuarioAtual",
        "usuarioLogado",
        "currentUser",
        "loggedUser",
        "usuario",
        "user"
    ];

    for (const chave of chaves) {
        const valorLocal = localStorage.getItem(chave);
        const usuarioLocal = extrairUsuario(valorLocal);

        if (usuarioLocal) {
            return usuarioLocal;
        }

        const valorSessao = sessionStorage.getItem(chave);
        const usuarioSessao = extrairUsuario(valorSessao);

        if (usuarioSessao) {
            return usuarioSessao;
        }
    }

    return "";
}

async function testarRepositorio(owner, repo) {
    if (!owner || !repo) {
        return false;
    }

    try {
        const resposta = await fetch(
            `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`,
            {
                headers: {
                    "Accept": "application/vnd.github+json",
                    "X-GitHub-Api-Version": "2022-11-28"
                }
            }
        );

        return resposta.ok;
    } catch (_) {
        return false;
    }
}

async function descobrirRepositorio() {
    if (REPOSITORIO.owner && REPOSITORIO.repo) {
        return {
            owner: REPOSITORIO.owner,
            repo: REPOSITORIO.repo
        };
    }

    const host = window.location.hostname;
    const partes = window.location.pathname
        .split("/")
        .map(item => item.trim())
        .filter(Boolean);

    if (!host.endsWith(".github.io")) {
        return {
            owner: "",
            repo: ""
        };
    }

    const owner = host.split(".")[0];

    const primeiroSegmento = partes[0] || "";

    const eArquivo =
        primeiroSegmento.includes(".") ||
        primeiroSegmento.toLowerCase().endsWith(".html");

    if (!eArquivo && primeiroSegmento) {
        const projeto = primeiroSegmento;

        if (await testarRepositorio(owner, projeto)) {
            return {
                owner,
                repo: projeto
            };
        }
    }

    const repositorioPrincipal = `${owner}.github.io`;

    if (await testarRepositorio(owner, repositorioPrincipal)) {
        return {
            owner,
            repo: repositorioPrincipal
        };
    }

    if (primeiroSegmento) {
        return {
            owner,
            repo: primeiroSegmento
        };
    }

    return {
        owner,
        repo: repositorioPrincipal
    };
}

async function obterBranch(owner, repo) {
    if (REPOSITORIO.branch) {
        return REPOSITORIO.branch;
    }

    const resposta = await fetch(
        `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`,
        {
            headers: {
                "Accept": "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28"
            }
        }
    );

    if (!resposta.ok) {
        throw new Error("Repositorio não encontrado");
    }

    const dados = await resposta.json();

    return dados.default_branch || "main";
}

function obterExtensao(nome) {
    const partes = String(nome).toLowerCase().split(".");

    return partes.length > 1 ? partes.pop() : "";
}

function identificarTipo(nome) {
    const extensao = obterExtensao(nome);

    if (EXTENSOES.imagens.includes(extensao)) {
        return "fotos";
    }

    if (EXTENSOES.audios.includes(extensao)) {
        return "audios";
    }

    if (EXTENSOES.videos.includes(extensao)) {
        return "videos";
    }

    return "";
}

function ordenarArquivos(lista) {
    return [...lista].sort((a, b) =>
        a.name.localeCompare(b.name, "pt-BR", {
            numeric: true,
            sensitivity: "base"
        })
    );
}

function criarUrlRaw(path, branch) {
    const partes = String(path)
        .split("/")
        .map(encodeURIComponent)
        .join("/");

    return `https://raw.githubusercontent.com/${encodeURIComponent(repositorioAtual.owner)}/${encodeURIComponent(repositorioAtual.repo)}/${encodeURIComponent(branch)}/${partes}`;
}

function criarArquivo(path, nome, branch) {
    const tipo = identificarTipo(nome);

    if (!tipo) {
        return null;
    }

    return {
        name: nome,
        path,
        type: tipo,
        url: criarUrlRaw(path, branch),
        extensao: obterExtensao(nome)
    };
}

function localizarPastaUsuario(nomesPastas, usuario) {
    if (!usuario || !nomesPastas.length) {
        return "";
    }

    const usuarioNormalizado = normalizarTexto(usuario);

    const exata = nomesPastas.find(
        nome => String(nome).trim().toLowerCase() === String(usuario).trim().toLowerCase()
    );

    if (exata) {
        return exata;
    }

    const normalizada = nomesPastas.find(
        nome => normalizarTexto(nome) === usuarioNormalizado
    );

    return normalizada || "";
}

function processarArvore(tree, branch, usuario) {
    const raiz = REPOSITORIO.pastaMidia.replace(/^\/+|\/+$/g, "");
    const prefixo = `${raiz}/`;

    const publicos = {
        fotos: [],
        audios: [],
        videos: []
    };

    const exclusivos = {
        fotos: [],
        audios: [],
        videos: []
    };

    const pastas = new Set();

    for (const item of tree) {
        if (item.type !== "blob") {
            continue;
        }

        if (!item.path.startsWith(prefixo)) {
            continue;
        }

        const relativo = item.path.slice(prefixo.length);

        if (!relativo) {
            continue;
        }

        const partes = relativo.split("/");
        const nome = partes[partes.length - 1];

        if (partes.length > 1) {
            pastas.add(partes[0]);
        }

        const arquivo = criarArquivo(item.path, nome, branch);

        if (!arquivo) {
            continue;
        }

        if (partes.length === 1) {
            publicos[arquivo.type].push(arquivo);
        }
    }

    const pastaUsuario = localizarPastaUsuario(
        [...pastas],
        usuario
    );

    if (pastaUsuario) {
        const prefixoUsuario = `${prefixo}${pastaUsuario}/`;

        for (const item of tree) {
            if (item.type !== "blob") {
                continue;
            }

            if (!item.path.startsWith(prefixoUsuario)) {
                continue;
            }

            const partes = item.path.split("/");
            const nome = partes[partes.length - 1];

            const arquivo = criarArquivo(
                item.path,
                nome,
                branch
            );

            if (!arquivo) {
                continue;
            }

            exclusivos[arquivo.type].push(arquivo);
        }
    }

    return {
        publicos,
        exclusivos,
        truncada: false
    };
}

async function obterArvore(owner, repo, branch) {
    const url =
        `https://api.github.com/repos/` +
        `${encodeURIComponent(owner)}/` +
        `${encodeURIComponent(repo)}/git/trees/` +
        `${encodeURIComponent(branch)}?recursive=1`;

    const resposta = await fetch(url, {
        headers: {
            "Accept": "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28"
        }
    });

    if (!resposta.ok) {
        throw new Error("Falha ao obter árvore");
    }

    return await resposta.json();
}

async function obterConteudoPasta(owner, repo, caminho) {
    const caminhoCodificado = caminho
        .split("/")
        .map(encodeURIComponent)
        .join("/");

    const url =
        `https://api.github.com/repos/` +
        `${encodeURIComponent(owner)}/` +
        `${encodeURIComponent(repo)}/contents/${caminhoCodificado}` +
        `?ref=${encodeURIComponent(branchAtual)}`;

    const resposta = await fetch(url, {
        headers: {
            "Accept": "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28"
        }
    });

    if (!resposta.ok) {
        throw new Error("Falha ao obter pasta");
    }

    return await resposta.json();
}

async function buscarArquivosRecursivamente(owner, repo, itens) {
    const arquivos = [];

    for (const item of itens) {
        if (item.type === "file") {
            const tipo = identificarTipo(item.name);

            if (!tipo) {
                continue;
            }

            arquivos.push({
                name: item.name,
                path: item.path,
                type: tipo,
                url: item.download_url || criarUrlRaw(item.path, branchAtual),
                extensao: obterExtensao(item.name)
            });

            continue;
        }

        if (item.type === "dir") {
            try {
                const filhos = await obterConteudoPasta(
                    owner,
                    repo,
                    item.path
                );

                const encontrados =
                    await buscarArquivosRecursivamente(
                        owner,
                        repo,
                        filhos
                    );

                arquivos.push(...encontrados);
            } catch (_) {}
        }
    }

    return arquivos;
}

async function obterCatalogoPorContents(owner, repo, usuario) {
    const raiz = REPOSITORIO.pastaMidia.replace(/^\/+|\/+$/g, "");

    const itens = await obterConteudoPasta(
        owner,
        repo,
        raiz
    );

    const publicos = {
        fotos: [],
        audios: [],
        videos: []
    };

    const exclusivos = {
        fotos: [],
        audios: [],
        videos: []
    };

    const nomesPastas = [];

    for (const item of itens) {
        if (item.type === "file") {
            const tipo = identificarTipo(item.name);

            if (!tipo) {
                continue;
            }

            publicos[tipo].push({
                name: item.name,
                path: item.path,
                type: tipo,
                url: item.download_url || criarUrlRaw(item.path, branchAtual),
                extensao: obterExtensao(item.name)
            });

            continue;
        }

        if (item.type === "dir") {
            nomesPastas.push(item.name);
        }
    }

    const pastaUsuario = localizarPastaUsuario(
        nomesPastas,
        usuario
    );

    if (pastaUsuario) {
        const caminhoUsuario = `${raiz}/${pastaUsuario}`;

        try {
            const itensUsuario = await obterConteudoPasta(
                owner,
                repo,
                caminhoUsuario
            );

            const arquivos =
                await buscarArquivosRecursivamente(
                    owner,
                    repo,
                    itensUsuario
                );

            for (const arquivo of arquivos) {
                exclusivos[arquivo.type].push(arquivo);
            }
        } catch (_) {}
    }

    return {
        publicos,
        exclusivos
    };
}

function limparCatalogos() {
    catalogoPublico = {
        fotos: [],
        audios: [],
        videos: []
    };

    catalogoExclusivo = {
        fotos: [],
        audios: [],
        videos: []
    };
}

function carregarVazios() {
    limparCatalogos();
    atualizarInterface();
}

function carregarCatalogos(publicos, exclusivos) {
    catalogoPublico = {
        fotos: ordenarArquivos(publicos.fotos || []),
        audios: ordenarArquivos(publicos.audios || []),
        videos: ordenarArquivos(publicos.videos || [])
    };

    catalogoExclusivo = {
        fotos: ordenarArquivos(exclusivos.fotos || []),
        audios: ordenarArquivos(exclusivos.audios || []),
        videos: ordenarArquivos(exclusivos.videos || [])
    };
}

async function carregarCatalogo() {
    limparCatalogos();

    const repositorio = await descobrirRepositorio();

    repositorioAtual = {
        owner: repositorio.owner,
        repo: repositorio.repo
    };

    REPOSITORIO.owner = repositorio.owner;
    REPOSITORIO.repo = repositorio.repo;

    if (!repositorioAtual.owner || !repositorioAtual.repo) {
        atualizarInterface();
        return;
    }

    try {
        branchAtual = await obterBranch(
            repositorioAtual.owner,
            repositorioAtual.repo
        );

        const usuario = obterUsuarioAtual();

        const arvore = await obterArvore(
            repositorioAtual.owner,
            repositorioAtual.repo,
            branchAtual
        );

        if (arvore.truncated) {
            throw new Error("Árvore truncada");
        }

        const resultado = processarArvore(
            arvore.tree || [],
            branchAtual,
            usuario
        );

        carregarCatalogos(
            resultado.publicos,
            resultado.exclusivos
        );

        atualizarInterface();
    } catch (_) {
        try {
            const usuario = obterUsuarioAtual();

            const resultado =
                await obterCatalogoPorContents(
                    repositorioAtual.owner,
                    repositorioAtual.repo,
                    usuario
                );

            carregarCatalogos(
                resultado.publicos,
                resultado.exclusivos
            );

            atualizarInterface();
        } catch (_) {
            carregarVazios();
        }
    }
}

function criarVazio(texto) {
    const elemento = document.createElement("div");
    elemento.className = "empty";

    const titulo = document.createElement("p");
    titulo.className = "empty-title";
    titulo.textContent = texto;

    elemento.appendChild(titulo);

    return elemento;
}

function renderizarFotos(containerId, arquivos, texto) {
    const container = document.getElementById(containerId);

    container.innerHTML = "";

    if (!arquivos.length) {
        container.appendChild(criarVazio(texto));
        return;
    }

    const grid = document.createElement("div");
    grid.className = "photo-grid";

    for (const arquivo of arquivos) {
        const card = document.createElement("button");

        card.type = "button";
        card.className = "photo-card";
        card.setAttribute("aria-label", arquivo.name);

        const imagem = document.createElement("img");

        imagem.src = arquivo.url;
        imagem.alt = arquivo.name;
        imagem.loading = "lazy";
        imagem.decoding = "async";

        imagem.addEventListener("error", () => {
            card.remove();
        });

        card.appendChild(imagem);

        card.addEventListener("click", () => {
            abrirLightbox(
                arquivo.url,
                arquivo.name
            );
        });

        grid.appendChild(card);
    }

    container.appendChild(grid);
}

function renderizarAudios(containerId, arquivos, texto) {
    const container = document.getElementById(containerId);

    container.innerHTML = "";

    if (!arquivos.length) {
        container.appendChild(criarVazio(texto));
        return;
    }

    const lista = document.createElement("div");
    lista.className = "media-list";

    for (const arquivo of arquivos) {
        const card = document.createElement("article");
        card.className = "audio-card";

        const nome = document.createElement("p");
        nome.className = "media-name";
        nome.textContent = arquivo.name;

        const audio = document.createElement("audio");

        audio.controls = true;
        audio.preload = "metadata";
        audio.src = arquivo.url;

        card.appendChild(nome);
        card.appendChild(audio);

        lista.appendChild(card);
    }

    container.appendChild(lista);
}

function renderizarVideos(containerId, arquivos, texto) {
    const container = document.getElementById(containerId);

    container.innerHTML = "";

    if (!arquivos.length) {
        container.appendChild(criarVazio(texto));
        return;
    }

    const lista = document.createElement("div");
    lista.className = "media-list";

    for (const arquivo of arquivos) {
        const card = document.createElement("article");
        card.className = "video-card";

        const nome = document.createElement("p");
        nome.className = "media-name";
        nome.textContent = arquivo.name;

        const video = document.createElement("video");

        video.controls = true;
        video.preload = "metadata";
        video.playsInline = true;
        video.src = arquivo.url;

        card.appendChild(nome);
        card.appendChild(video);

        lista.appendChild(card);
    }

    container.appendChild(lista);
}

function atualizarInterface() {
    const totalPublico =
        catalogoPublico.fotos.length +
        catalogoPublico.audios.length +
        catalogoPublico.videos.length;

    document.getElementById("counter").textContent =
        `${totalPublico} ${totalPublico === 1 ? "mídia" : "mídias"}`;

    document.getElementById("foto-status").textContent =
        `${catalogoPublico.fotos.length} ${catalogoPublico.fotos.length === 1 ? "foto" : "fotos"}`;

    document.getElementById("audio-status").textContent =
        `${catalogoPublico.audios.length} ${catalogoPublico.audios.length === 1 ? "áudio" : "áudios"}`;

    document.getElementById("video-status").textContent =
        `${catalogoPublico.videos.length} ${catalogoPublico.videos.length === 1 ? "vídeo" : "vídeos"}`;

    renderizarFotos(
        "fotos-container",
        catalogoPublico.fotos,
        "Nenhuma foto encontrada"
    );

    renderizarAudios(
        "audios-container",
        catalogoPublico.audios,
        "Nenhum áudio encontrado"
    );

    renderizarVideos(
        "videos-container",
        catalogoPublico.videos,
        "Nenhum vídeo encontrado"
    );

    renderizarFotos(
        "exclusive-fotos-container",
        catalogoExclusivo.fotos,
        "Sem conteúdo exclusivo"
    );

    renderizarAudios(
        "exclusive-audios-container",
        catalogoExclusivo.audios,
        "Sem conteúdo exclusivo"
    );

    renderizarVideos(
        "exclusive-videos-container",
        catalogoExclusivo.videos,
        "Sem conteúdo exclusivo"
    );
}

function abrirLightbox(url, nome) {
    const lightbox = document.getElementById("lightbox");
    const imagem = document.getElementById("lightbox-image");

    imagem.src = url;
    imagem.alt = nome;

    lightbox.classList.add("active");
    document.body.style.overflow = "hidden";

    if (!historicoLightbox) {
        historicoLightbox = true;
        history.pushState(
            {
                lightbox: true
            },
            ""
        );
    }
}

function fecharLightbox() {
    const lightbox = document.getElementById("lightbox");

    if (!lightbox.classList.contains("active")) {
        return;
    }

    lightbox.classList.remove("active");

    document.getElementById("lightbox-image").src = "";

    document.body.style.overflow = "";

    if (historicoLightbox) {
        historicoLightbox = false;
        history.back();
    }
}

document.getElementById("back-button").addEventListener(
    "click",
    () => {
        window.location.href = "home.html";
    }
);

document.getElementById("home-button").addEventListener(
    "click",
    () => {
        window.location.href = "home.html";
    }
);

document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
        const alvo = tab.dataset.tab;

        document.querySelectorAll(".tab").forEach(item => {
            item.classList.remove("active");
        });

        document.querySelectorAll(".section").forEach(section => {
            section.classList.remove("active");
        });

        tab.classList.add("active");

        const section = document.getElementById(
            `section-${alvo}`
        );

        if (section) {
            section.classList.add("active");
        }
    });
});

document.querySelectorAll(".exclusive-tab").forEach(tab => {
    tab.addEventListener("click", () => {
        const alvo = tab.dataset.exclusive;

        document.querySelectorAll(".exclusive-tab").forEach(item => {
            item.classList.remove("active");
        });

        document.querySelectorAll(".exclusive-content").forEach(item => {
            item.classList.remove("active");
        });

        tab.classList.add("active");

        const conteudo = document.getElementById(
            `exclusive-${alvo}`
        );

        if (conteudo) {
            conteudo.classList.add("active");
        }
    });
});

document.getElementById("lightbox-close").addEventListener(
    "click",
    fecharLightbox
);

document.getElementById("lightbox").addEventListener(
    "click",
    evento => {
        if (evento.target.id === "lightbox") {
            fecharLightbox();
        }
    }
);

document.addEventListener("keydown", evento => {
    if (evento.key === "Escape") {
        fecharLightbox();
    }
});

window.addEventListener("popstate", () => {
    historicoLightbox = false;

    const lightbox =
        document.getElementById("lightbox");

    lightbox.classList.remove("active");

    document.getElementById(
        "lightbox-image"
    ).src = "";

    document.body.style.overflow = "";
});

carregarCatalogo();
</script>
