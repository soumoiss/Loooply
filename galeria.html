<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F5F0FA" />
  <meta name="color-scheme" content="light" />
  <title>Home - Loooply</title>
  <link rel="icon" href="icon.png" type="image/png" />
  <style>
    :root {
      --bg: #F5F0FA;
      --bg-2: #F0E0F0;
      --surface: rgba(255,255,255,.92);
      --surface-solid: #ffffff;
      --primary: #7010B0;
      --primary-strong: #6010A0;
      --primary-soft: #E8D8F0;
      --primary-pale: #F5F0FA;
      --text: #29252f;
      --muted: #817b89;
      --line: rgba(102,82,126,.12);
      --shadow-sm: 0 5px 18px rgba(80,56,115,.07);
      --shadow-md: 0 16px 38px rgba(80,56,115,.11);
      --shadow-lg: 0 28px 80px rgba(65,45,94,.18);
      --radius-lg: 28px;
      --radius-md: 20px;
      --radius-sm: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { min-height: 100%; scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      color: var(--text);
      font-family: Inter, 'Segoe UI', sans-serif;
      background:
        radial-gradient(circle at 10% -8%, rgba(177,131,255,.22), transparent 31%),
        radial-gradient(circle at 94% 8%, rgba(220,204,255,.48), transparent 28%),
        linear-gradient(135deg, var(--bg), var(--bg-2));
      padding: max(18px, env(safe-area-inset-top)) 14px max(30px, env(safe-area-inset-bottom)) 14px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      opacity: .34;
      background-image: linear-gradient(rgba(255,255,255,.35) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.25) 1px, transparent 1px);
      background-size: 38px 38px;
      mask-image: linear-gradient(to bottom, black, transparent 76%);
    }

    a, button, input { font: inherit; }
    button { cursor: pointer; }

    .app-shell { width: min(100%, 780px); margin: 0 auto; }
    .topbar {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px;
    }

    .navigation-stack {
      display: flex; flex-direction: column; align-items: flex-start; gap: 7px;
    }

    .icon-button, .navigation-button, .action-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 46px; border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,.78); color: var(--primary-strong); box-shadow: var(--shadow-sm); text-decoration: none; transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }

    .icon-button {
      width: 46px; height: 46px; flex: 0 0 46px;
    }
    .navigation-button {
      min-width: 46px; height: auto; padding: 7px 10px; justify-content: flex-start;
    }
    .navigation-button .navigation-label { max-width: 70px; overflow: hidden; white-space: nowrap; font-size: 11px; font-weight: 800; }
    .icon-button:hover, .navigation-button:hover, .action-btn:hover {
      transform: translateY(-2px); background: #fff; box-shadow: var(--shadow-md);
    }
    .icon-button svg, .navigation-button svg, .action-btn svg { width: 20px; height: 20px; }

    .container {
      width: 100%; padding: clamp(20px, 5vw, 34px); border: 1px solid rgba(120,92,155,.10); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-lg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    }

    .profile-wrap { display: flex; justify-content: center; margin: 4px 0 16px; }
    .profile-ring {
      width: clamp(124px, 31vw, 168px); height: clamp(124px, 31vw, 168px); padding: 5px; border-radius: 50%; background: linear-gradient(145deg, #c49af5, var(--primary), #b07ae9); box-shadow: 0 13px 34px rgba(131,83,189,.18);
    }
    .profile-pic {
      display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 4px solid rgba(255,255,255,.94); background: #eee8f7;
    }

    .eyebrow {
      text-align: center; color: var(--primary-strong); font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; margin-bottom: 7px;
    }

    h2 {
      text-align: center; font-size: clamp(25px, 6vw, 34px); line-height: 1.12; letter-spacing: -.03em; margin-bottom: 7px;
    }
    .subtitulo {
      max-width: 520px; margin: 0 auto; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.55;
    }

    .overview {
      display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: stretch; margin-top: 26px; margin-bottom: 14px;
    }
    .overview-card {
      min-width: 0; padding: 15px 17px; border-radius: var(--radius-sm); background: linear-gradient(135deg, #fff, #faf7ff); border: 1px solid var(--line); box-shadow: var(--shadow-sm);
    }
    .overview-label { color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }
    .lista-titulo { font-size: clamp(22px, 5vw, 28px); line-height: 1.05; font-weight: 800; letter-spacing: -.035em; }
    .collection-note { margin-top: 5px; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .contador {
      display: inline-flex; align-items: center; justify-content: center; min-width: 92px; padding: 10px 13px; border-radius: 15px; background: var(--primary-pale); border: 1px solid rgba(112,16,176,.14); color: var(--primary-strong); font-size: 13px; font-weight: 800; white-space: nowrap;
    }

    .filters {
      display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 16px;
    }
    .filter-button {
      min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 15px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.84); color: var(--muted); font-size: 13px; font-weight: 800; box-shadow: 0 3px 12px rgba(80,56,115,.04); transition: transform .18s ease, background .18s ease, color .18s ease, border-color .18s ease;
    }
    .filter-button.active { color: #fff; background: var(--primary); border-color: var(--primary); }

    .cards-grid {
      display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px;
    }
    .card {
      position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 20px; background: rgba(255,255,255,.86); box-shadow: var(--shadow-sm); transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .card:hover { transform: translateY(-3px); border-color: rgba(155,93,229,.20); box-shadow: var(--shadow-md); }
    .card-thumb {
      position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: linear-gradient(135deg,#eee8ff,#f8f5ff);
    }
    .card-thumb img {
      display: block; width: 100%; height: 100%; object-fit: cover; opacity: 1;
    }
    .card-badge {
      position: absolute; left: 10px; bottom: 10px; width: 38px; height: 38px; display: grid; place-items: center; border:1px solid rgba(255,255,255,.65); border-radius:13px; background: rgba(72,47,99,.78); color:#fff; box-shadow: 0 8px 22px rgba(49,33,68,.25);
    }
    .card-meta { padding: 12px 14px 14px; }
    .label { color: var(--primary-strong); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; font-weight: 850; }
    .title { margin-top: 6px; color: var(--text); font-size: 19px; line-height: 1.18; font-weight: 700; }

    .empty-state {
      display: none; padding: 32px 18px; border: 1px dashed rgba(117,101,132,.16); border-radius: 18px; background: rgba(255,255,255,.48); color: var(--muted); text-align: center;
    }
    .empty-state.visible { display: block; }
    .empty-state strong { display: block; color: var(--text); font-size: 22px; margin-bottom: 6px; }

    .status { min-height: 22px; margin: 18px 0 10px; color: var(--muted); font-size: 12px; font-weight: 700; text-align: center; }
    .status-dot { display: inline-block; width: 7px; height: 7px; border-radius:50%; background: var(--primary); margin-right: 8px; }

    @media (max-width: 640px) {
      .cards-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="navigation-stack">
        <a class="navigation-button" href="home.html" aria-label="Home">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="navigation-label">Home</span>
        </a>
        <a class="navigation-button" href="galeria.html" aria-label="Galeria">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M8 14l2.5-3 2.5 2.5 2.5-4 4 5.5H6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="navigation-label">Galeria</span>
        </a>
      </div>

      <a class="icon-button" id="logoutBtn" href="#" aria-label="Sair">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M16 17l5-5-5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </a>
    </header>

    <main class="container">
      <div class="profile-wrap">
        <div class="profile-ring">
          <img id="profilePic" class="profile-pic" alt="Perfil" />
        </div>
      </div>

      <div class="eyebrow">MoissWorld</div>
      <h2 id="welcomeTitle">Bem-vindo</h2>
      <p class="subtitulo">Seu cantinho especial com lembranças, músicas e momentos.</p>

      <section class="overview">
        <div class="overview-card">
          <div class="overview-label">Coleção</div>
          <div class="lista-titulo" id="collectionTitle">Momentos</div>
          <div class="collection-note">Tudo guardado com carinho.</div>
        </div>
        <div class="contador" id="cardCount">0 itens</div>
      </section>

      <div class="filters">
        <button class="filter-button active" data-filter="all" type="button">Todos</button>
        <button class="filter-button" data-filter="photos" type="button">Fotos</button>
        <button class="filter-button" data-filter="music" type="button">Músicas</button>
      </div>

      <div class="status"><span class="status-dot"></span><span id="statusText">Carregando momentos...</span></div>

      <section id="cardsGrid" class="cards-grid" aria-live="polite"></section>
      <div id="emptyState" class="empty-state">
        <strong>Nada por aqui</strong>
        Ainda não há itens para esta visão.
      </div>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="utils.js"></script>
  <script>
    const cards = [
      { id: 1, type: 'photos', title: 'Primeiro encontro', label: 'Foto', image: '20260921_123850.jpg', link: 'galeria.html' },
      { id: 2, type: 'photos', title: 'Noite especial', label: 'Foto', image: '20260921_150554.jpg', link: 'galeria.html' },
      { id: 3, type: 'photos', title: 'A viagem', label: 'Foto', image: '20260925_170903.jpg', link: 'galeria.html' },
      { id: 4, type: 'music', title: 'Coração em loop', label: 'Música', image: 'Screenshot_20260907_220115_Instagram.jpg', link: 'musicas.html' },
      { id: 5, type: 'photos', title: 'Risos e paz', label: 'Foto', image: '20260925_180500.jpg', link: 'galeria.html' },
      { id: 6, type: 'music', title: 'Playlist do momento', label: 'Música', image: 'IMG-20260930-WA0017.jpg', link: 'musicas.html' }
    ];

    const profilePic = document.getElementById('profilePic');
    const welcomeTitle = document.getElementById('welcomeTitle');
    const cardCount = document.getElementById('cardCount');
    const cardsGrid = document.getElementById('cardsGrid');
    const emptyState = document.getElementById('emptyState');
    const statusText = document.getElementById('statusText');
    const logoutBtn = document.getElementById('logoutBtn');

    if (!Utils.Auth.isLoggedIn()) {
      window.location.href = LOOOPLY_CONFIG.ROUTES.LOGIN;
    }

    const username = Utils.Auth.getCurrentUser();
    const userPic = Utils.Auth.getProfilePic() || 'user1_perf.png';
    profilePic.src = userPic;
    welcomeTitle.textContent = `Olá, ${username || 'amigo'}!`;

    const state = { filter: 'all' };

    function renderCards() {
      const filtered = cards.filter((card) => state.filter === 'all' || card.type === state.filter);
      cardsGrid.innerHTML = '';

      if (!filtered.length) {
        emptyState.classList.add('visible');
        cardsGrid.innerHTML = '';
        return;
      }

      emptyState.classList.remove('visible');
      filtered.forEach((card) => {
        const article = document.createElement('article');
        article.className = 'card';
        article.innerHTML = `
          <div class="card-thumb">
            <img src="${card.image}" alt="${card.title}" loading="lazy" />
            <div class="card-badge">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true"><path d="M8 6.5v11l9-5.5-9-5.5Z" fill="currentColor"/></svg>
            </div>
          </div>
          <div class="card-meta">
            <div class="label">${card.label}</div>
            <div class="title">${card.title}</div>
          </div>
        `;

        article.addEventListener('click', () => {
          window.location.href = card.link;
        });

        cardsGrid.appendChild(article);
      });

      cardCount.textContent = `${filtered.length} itens`;
      statusText.textContent = state.filter === 'all' ? 'Momentos prontos para você.' : `Mostrando ${state.filter === 'photos' ? 'fotos' : 'músicas'} no painel.`;
    }

    document.querySelectorAll('.filter-button').forEach((button) => {
      button.addEventListener('click', () => {
        state.filter = button.dataset.filter;
        document.querySelectorAll('.filter-button').forEach((btn) => btn.classList.toggle('active', btn === button));
        renderCards();
      });
    });

    logoutBtn.addEventListener('click', (event) => {
      event.preventDefault();
      localStorage.clear();
      window.location.href = LOOOPLY_CONFIG.ROUTES.LOGIN;
    });

    renderCards();
  </script>
</body>
</html>
