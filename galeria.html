<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f0ff">
<meta name="color-scheme" content="light">
<title>Momentos - Loooply</title>
<link rel="preconnect" href="https://raw.githubusercontent.com">
<link rel="preconnect" href="https://api.github.com">

<style>
@font-face {
    font-family: "Quillen";
    src: local("Quillen"), url("Quillen.otf") format("opentype");
    font-display: swap;
    font-style: normal;
    font-weight: 400;
}

:root {
    --bg: #f4f0ff;
    --bg-2: #eee8ff;
    --surface: rgba(255,255,255,.93);
    --surface-soft: #f8f5ff;
    --primary: #9b5de5;
    --primary-strong: #8750cf;
    --primary-pale: #f4edff;
    --text: #29252f;
    --muted: #817b89;
    --line: rgba(102,82,126,.12);
    --shadow-sm: 0 5px 18px rgba(80,56,115,.07);
    --shadow-md: 0 16px 38px rgba(80,56,115,.11);
    --shadow-lg: 0 28px 80px rgba(65,45,94,.18);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    min-height: 100%;
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    color: var(--text);
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
        radial-gradient(circle at 10% -8%, rgba(177,131,255,.22), transparent 31%),
        radial-gradient(circle at 94% 8%, rgba(220,204,255,.48), transparent 28%),
        linear-gradient(135deg, var(--bg), var(--bg-2));
    padding:
        max(18px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        max(30px, env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    opacity: .34;
    background-image:
        linear-gradient(rgba(255,255,255,.35) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.25) 1px, transparent 1px);
    background-size: 38px 38px;
    mask-image: linear-gradient(to bottom, black, transparent 76%);
    -webkit-mask-image: linear-gradient(to bottom, black, transparent 76%);
}

button,
a {
    font: inherit;
    -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
a:focus-visible,
[tabindex]:focus-visible {
    outline: 3px solid rgba(155,93,229,.30);
    outline-offset: 3px;
}

button {
    border: 0;
}

.app-shell {
    width: min(100%, 1180px);
    margin: 0 auto;
    animation: pageIn .45s ease both;
}

@keyframes pageIn {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.topbar {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
}

.topbar-right {
    display: flex;
    align-items: center;
    gap: 8px;
}

.navigation-button,
.music-button {
    min-height: 46px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: rgba(255,255,255,.82);
    color: var(--primary-strong);
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    text-decoration: none;
}

.navigation-button {
    min-width: 46px;
    padding: 7px 10px;
    display: inline-flex;
    align-items: center;
    justify-content: flex-start;
    gap: 7px;
    overflow: hidden;
}

.navigation-button:hover,
.music-button:hover {
    transform: translateY(-2px);
    background: #fff;
    box-shadow: var(--shadow-md);
}

.navigation-button:active,
.music-button:active {
    transform: scale(.96);
}

.navigation-button svg {
    width: 21px;
    height: 21px;
    flex: 0 0 21px;
}

.navigation-label {
    max-width: 0;
    overflow: hidden;
    opacity: 0;
    white-space: nowrap;
    font-size: 11px;
    font-weight: 800;
    transition: max-width .20s ease, opacity .20s ease;
}

.navigation-button:hover .navigation-label,
.navigation-button:focus-visible .navigation-label {
    max-width: 90px;
    opacity: 1;
}

.music-button {
    padding: 0 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-size: 12px;
    font-weight: 800;
}

.music-button.playing svg {
    animation: rotateDisk 4s linear infinite;
}

@keyframes rotateDisk {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.music-button svg {
    width: 19px;
    height: 19px;
    flex: 0 0 19px;
}

.container {
    width: 100%;
    padding: clamp(20px,4vw,34px);
    border: 1px solid rgba(120,92,155,.10);
    border-radius: 28px;
    background: var(--surface);
    box-shadow: var(--shadow-lg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
}

.hero {
    text-align: center;
    margin-bottom: 25px;
}

.hero h1 {
    font-family: "Quillen", Georgia, "Times New Roman", serif;
    font-size: clamp(38px,8vw,62px);
    font-weight: 400;
    line-height: 1.05;
    letter-spacing: .01em;
}

.overview {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    margin-bottom: 15px;
}

.contador {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 118px;
    padding: 10px 13px;
    border-radius: 15px;
    background: var(--primary-pale);
    border: 1px solid rgba(155,93,229,.14);
    color: var(--primary-strong);
    font-size: 13px;
    font-weight: 800;
}

.media-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 17px;
}

.media-tab {
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 0 15px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: rgba(255,255,255,.84);
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    font-weight: 800;
    box-shadow: 0 3px 12px rgba(80,56,115,.04);
    transition: transform .18s ease, background .18s ease, color .18s ease, border-color .18s ease, box-shadow .18s ease;
}

.media-tab:hover {
    transform: translateY(-1px);
    color: var(--primary-strong);
    border-color: rgba(155,93,229,.20);
}

.media-tab.active {
    color: #fff;
    background: var(--primary);
    border-color: var(--primary);
    box-shadow: 0 8px 20px rgba(155,93,229,.20);
}

.media-tab svg {
    width: 17px;
    height: 17px;
}

.section {
    display: none;
}

.section.active {
    display: block;
    animation: sectionIn .25s ease both;
}

@keyframes sectionIn {
    from {
        opacity: .2;
        transform: translateY(4px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 3px 1px 13px;
}

.section-head h2 {
    font-size: 20px;
    letter-spacing: -.02em;
}

.section-head p {
    color: var(--muted);
    font-size: 12px;
}

.galeria {
    column-count: 5;
    column-gap: 15px;
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 1px;
}

.media-card {
    position: relative;
    display: block;
    break-inside: avoid;
    margin: 0 0 15px;
    cursor: zoom-in;
    animation: mediaIn .35s ease both;
}

@keyframes mediaIn {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.photo-shell {
    position: relative;
    overflow: hidden;
    border-radius: 18px;
    background: linear-gradient(135deg,#f1eaff,#fff);
    border: 1px solid rgba(102,82,126,.10);
    box-shadow: 0 7px 18px rgba(80,56,115,.08);
}

.photo-shell img {
    width: 100%;
    height: auto;
    display: block;
    object-fit: contain;
    transition: transform .30s ease, opacity .30s ease;
}

.media-card:hover .photo-shell img,
.media-card:focus-visible .photo-shell img {
    transform: scale(1.018);
    opacity: .94;
}

.photo-overlay {
    position: absolute;
    inset: auto 0 0 0;
    padding: 30px 11px 11px;
    opacity: 0;
    transform: translateY(5px);
    background: linear-gradient(transparent,rgba(35,26,46,.55));
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    transition: opacity .22s ease, transform .22s ease;
    pointer-events: none;
}

.media-card:hover .photo-overlay,
.media-card:focus-visible .photo-overlay {
    opacity: 1;
    transform: translateY(0);
}

.media-grid {
    display: grid;
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 13px;
}

.media-panel {
    min-width: 0;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 20px;
    background: linear-gradient(135deg,#fff,#fbf9ff);
    box-shadow: var(--shadow-sm);
}

.media-panel h3 {
    font-family: "Quillen",Georgia,serif;
    font-size: 23px;
    font-weight: 400;
    margin-bottom: 12px;
}

.audio-item,
.video-item,
.exclusive-item {
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--surface-soft);
    padding: 12px;
    margin-bottom: 9px;
}

.audio-item:last-child,
.video-item:last-child,
.exclusive-item:last-child {
    margin-bottom: 0;
}

.media-name {
    display: block;
    color: var(--text);
    font-size: 12px;
    font-weight: 800;
    line-height: 1.4;
    overflow-wrap: anywhere;
    margin-bottom: 8px;
}

audio,
video {
    width: 100%;
    display: block;
    border-radius: 12px;
}

audio {
    min-height: 42px;
}

video {
    background: #151018;
    max-height: 460px;
    object-fit: contain;
}

.exclusive-content {
    display: grid;
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 13px;
}

.exclusive-item img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 12px;
}

.exclusive-item video {
    max-height: 500px;
}

.empty-state {
    display: none;
    padding: 30px 16px;
    text-align: center;
    color: var(--muted);
    border: 1px dashed rgba(117,101,132,.16);
    border-radius: 18px;
    background: rgba(255,255,255,.48);
}

.empty-state.visible {
    display: block;
}

.empty-state strong {
    display: block;
    color: var(--text);
    font-family: "Quillen",Georgia,serif;
    font-size: 20px;
    font-weight: 400;
}

.lightbox {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
    background: rgba(41,33,51,.80);
    backdrop-filter: blur(13px);
    -webkit-backdrop-filter: blur(13px);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .24s ease,visibility .24s ease;
}

.lightbox.aberto {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

.lightbox-content {
    position: relative;
    width: min(96vw,1400px);
    max-height: 94vh;
    max-height: 94dvh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.lightbox-img {
    max-width: 96vw;
    max-height: 88vh;
    max-height: 88dvh;
    width: auto;
    height: auto;
    object-fit: contain;
    border-radius: 12px;
    box-shadow: 0 28px 80px rgba(0,0,0,.40);
}

.lightbox-close {
    position: fixed;
    top: max(16px,env(safe-area-inset-top));
    right: max(16px,env(safe-area-inset-right));
    width: 46px;
    height: 46px;
    border: 1px solid rgba(255,255,255,.30);
    border-radius: 50%;
    background: rgba(255,255,255,.12);
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 25px;
    line-height: 1;
    cursor: pointer;
    z-index: 3;
}

.lightbox-caption {
    position: fixed;
    left: 50%;
    bottom: max(16px,env(safe-area-inset-bottom));
    transform: translateX(-50%);
    max-width: min(90vw,760px);
    padding: 9px 14px;
    border-radius: 999px;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.18);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    text-align: center;
    overflow-wrap: anywhere;
}

@media (max-width:1180px) {
    .galeria {
        column-count: 4;
    }
}

@media (max-width:900px) {
    .galeria {
        column-count: 3;
    }

    .media-grid,
    .exclusive-content {
        grid-template-columns: 1fr;
    }
}

@media (max-width:680px) {
    body {
        padding-top: max(12px,env(safe-area-inset-top));
    }

    .container {
        padding: 19px 13px 16px;
        border-radius: 24px;
    }

    .topbar {
        margin-bottom: 9px;
    }

    .navigation-button,
    .music-button {
        min-width: 43px;
        width: 43px;
        min-height: 43px;
        height: 43px;
        border-radius: 14px;
    }

    .navigation-label {
        display: none;
    }

    .music-button {
        padding: 0;
    }

    .music-button span {
        display: none;
    }

    .galeria {
        column-count: 2;
        column-gap: 9px;
        padding: 0;
    }

    .media-card {
        margin-bottom: 9px;
    }

    .photo-shell {
        border-radius: 14px;
    }

    .overview {
        justify-content: flex-start;
    }

    .media-tab {
        flex: 1 1 calc(50% - 8px);
    }
}

@media (max-width:390px) {
    .galeria {
        column-count: 1;
    }

    .media-tab {
        flex-basis: 100%;
    }

    .hero h1 {
        font-size: 39px;
    }
}
</style>
</head>

<body>

<main class="app-shell">

    <div class="topbar">
        <a class="navigation-button" href="home.html" id="btnVoltar" aria-label="Voltar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5"></path>
                <path d="m12 19-7-7 7-7"></path>
            </svg>
            <span class="navigation-label">Voltar</span>
        </a>

        <div class="topbar-right">
            <a class="navigation-button" href="musicas.html" aria-label="Músicas">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18V5l11-2v13"></path>
                    <circle cx="6" cy="18" r="3"></circle>
                    <circle cx="17" cy="16" r="3"></circle>
                </svg>
                <span class="navigation-label">Músicas</span>
            </a>

            <button class="music-button" type="button" id="btnMusica" aria-label="Continuar música" title="Continuar música">
                <svg id="iconeMusica" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m7 4 12 8-12 8z"></path>
                </svg>
                <span id="textoMusica">Música</span>
            </button>
        </div>
    </div>

    <section class="container">

        <header class="hero">
            <h1>Momentos</h1>
        </header>

        <div class="overview">
            <div class="contador" id="contador">0 mídias</div>
        </div>

        <div class="media-tabs" id="mediaTabs" role="tablist">

            <button class="media-tab active" type="button" role="tab" aria-selected="true" data-section="fotos">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="16" rx="3"></rect>
                    <circle cx="8.5" cy="9" r="1.5"></circle>
                    <path d="m5.5 17 4.5-4.5 3.5-3.5 6 6"></path>
                </svg>
                Fotos
            </button>

            <button class="media-tab" type="button" role="tab" aria-selected="false" data-section="audios">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18V5l11-2v13"></path>
                    <circle cx="6" cy="18" r="3"></circle>
                    <circle cx="17" cy="16" r="3"></circle>
                </svg>
                Áudios
            </button>

            <button class="media-tab" type="button" role="tab" aria-selected="false" data-section="videos">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="5" width="13" height="14" rx="2"></rect>
                    <path d="m16 10 5-3v10l-5-3z"></path>
                </svg>
                Vídeos
            </button>

            <button class="media-tab" type="button" role="tab" aria-selected="false" data-section="exclusivo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="10" width="16" height="10" rx="2"></rect>
                    <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                </svg>
                Exclusivo
            </button>

        </div>

        <section class="section active" id="section-fotos" role="tabpanel">
            <div class="section-head">
                <h2>Fotos</h2>
                <p id="fotoStatus">0 fotos</p>
            </div>

            <div class="galeria" id="galeria"></div>

            <div class="empty-state" id="fotoEmpty">
                <strong>Não há foto</strong>
            </div>
        </section>

        <section class="section" id="section-audios" role="tabpanel" hidden>
            <div class="section-head">
                <h2>Áudios</h2>
                <p id="audioStatus">0 áudios</p>
            </div>

            <div id="audios" class="media-grid"></div>

            <div class="empty-state" id="audioEmpty">
                <strong>Não há áudio</strong>
            </div>
        </section>

        <section class="section" id="section-videos" role="tabpanel" hidden>
            <div class="section-head">
                <h2>Vídeos</h2>
                <p id="videoStatus">0 vídeos</p>
            </div>

            <div id="videos" class="media-grid"></div>

            <div class="empty-state" id="videoEmpty">
                <strong>Não há vídeo</strong>
            </div>
        </section>

        <section class="section" id="section-exclusivo" role="tabpanel" hidden>
            <div class="section-head">
                <h2>Exclusivo</h2>
                <p id="exclusiveStatus">0 arquivos</p>
            </div>

            <div id="exclusivo" class="exclusive-content"></div>

            <div class="empty-state" id="exclusiveEmpty">
                <strong>Não há conteúdo exclusivo</strong>
            </div>
        </section>

    </section>
</main>

<audio id="bgAudio" loop preload="none"></audio>

<div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true">
    <button class="lightbox-close" type="button" id="lightboxClose" aria-label="Fechar">×</button>
    <div class="lightbox-content">
        <img id="lightboxImg" class="lightbox-img" src="" alt="Imagem ampliada">
    </div>
    <div class="lightbox-caption" id="lightboxCaption"></div>
</div>

<script>
(function() {
    "use strict";

    // CONFIGURAÇÃO DO REPOSITÓRIO
    const CONFIG = {
        owner: "soumoiss",
        repo: "Loooply",
        validUsers: ["Patati", "Misol", "Lilika", "YARA"],
        extensions: {
            fotos: [".jpg", ".jpeg", ".png", ".webp", ".gif", ".avif", ".bmp", ".svg", ".heic", ".heif", ".jfif", ".tif", ".tiff"],
            audios: [".mp3", ".m4a", ".wav", ".ogg", ".oga", ".aac", ".flac", ".opus"],
            videos: [".mp4", ".webm", ".mov", ".m4v", ".ogv", ".avi", ".mkv"]
        }
    };

    // ESTADO INTERNO
    const state = {
        username: null,
        defaultBranch: null,
        cache: {
            fotos: [],
            audios: [],
            videos: [],
            exclusivo: []
        },
        hasLoadedSuccessfully: false
    };

    // 1. OBTENÇÃO E VALIDAÇÃO DO USUÁRIO LOGADO
    function setupUser() {
        const stored = localStorage.getItem("username") || "";
        const cleanStored = stored.trim().toLowerCase();
        
        const matchedUser = CONFIG.validUsers.find(
            u => u.toLowerCase() === cleanStored
        );

        state.username = matchedUser || stored.trim();
    }

    // 2. CONSTRUÇÃO DA URL RAW SEGURA
    function buildRawUrl(filePath, branch) {
        const encodedPath = filePath
            .split('/')
            .map(segment => encodeURIComponent(segment))
            .join('/');
        return `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${branch}/${encodedPath}`;
    }

    // 3. OBTENÇÃO DA BRANCH PADRÃO DO GITHUB
    async function fetchDefaultBranch() {
        try {
            const res = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}`);
            if (!res.ok) return "main";
            const data = await res.json();
            return data.default_branch || "main";
        } catch (e) {
            return "main";
        }
    }

    // 4. LEITURA RECURSIVA DA ÁRVORE DE ARQUIVOS (GIT TREE API)
    async function fetchRepositoryTree(branch) {
        try {
            const url = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/git/trees/${branch}?recursive=1`;
            const res = await fetch(url);
            if (!res.ok) return null;
            const data = await res.json();
            if (!data.tree || !Array.isArray(data.tree)) return null;
            return data.tree;
        } catch (e) {
            return null;
        }
    }

    // 5. CLASSIFICAÇÃO DA MÍDIA COM BASE NA ESTRUTURA DE PASTAS E EXTENSÃO
    function processAndClassifyMedia(tree, branch) {
        const fotos = [];
        const audios = [];
        const videos = [];
        const exclusivo = [];
        const pathSet = new Set();

        const currentUserLower = state.username ? state.username.toLowerCase() : "";

        // Ordenação determinística por caminho para evitar reordenações visuais
        const sortedTree = tree.filter(item => item.type === "blob").sort((a, b) => a.path.localeCompare(b.path));

        for (const item of sortedTree) {
            const path = item.path;
            
            // Ignora itens fora de "midia/" ou o áudio de fundo
            if (!path.toLowerCase().startsWith("midia/")) continue;
            if (path.toLowerCase() === "midia/tema.mp3") continue;
            if (pathSet.has(path)) continue;
            
            pathSet.add(path);

            const rawUrl = buildRawUrl(path, branch);
            const ext = "." + path.split('.').pop().toLowerCase();
            const segments = path.split('/');
            const filename = segments[segments.length - 1];

            const mediaItem = {
                path: path,
                name: filename,
                url: rawUrl,
                extension: ext
            };

            // VERIFICAÇÃO DE CONTEÚDO EXCLUSIVO (midia/{username}/...)
            if (segments.length >= 3) {
                const folderUserLower = segments[1].toLowerCase();
                if (currentUserLower && folderUserLower === currentUserLower) {
                    exclusivo.push(mediaItem);
                    continue; // Exclusivos pertencem unicamente à sua aba
                }
            }

            // VERIFICAÇÃO DE CONTEÚDO COMPARTILHADO (diretamente em midia/)
            if (segments.length === 2) {
                if (CONFIG.extensions.fotos.includes(ext)) {
                    fotos.push(mediaItem);
                } else if (CONFIG.extensions.audios.includes(ext)) {
                    audios.push(mediaItem);
                } else if (CONFIG.extensions.videos.includes(ext)) {
                    videos.push(mediaItem);
                }
            }
        }

        state.cache.fotos = fotos;
        state.cache.audios = audios;
        state.cache.videos = videos;
        state.cache.exclusivo = exclusivo;
        state.hasLoadedSuccessfully = true;
    }

    // 6. RENDERIZAÇÃO DA INTERFACE
    function renderCategory(containerId, emptyId, items, type) {
        const container = document.getElementById(containerId);
        const emptyState = document.getElementById(emptyId);
        if (!container) return;

        container.innerHTML = "";

        // Só exibe "Não há..." se a API tiver respondido com sucesso e a lista for realmente vazia
        if (state.hasLoadedSuccessfully && (!items || items.length === 0)) {
            if (emptyState) emptyState.classList.add("visible");
            return;
        } else if (emptyState) {
            emptyState.classList.remove("visible");
        }

        if (!items || items.length === 0) return;

        const fragment = document.createDocumentFragment();

        if (type === "audio") {
            const panel = document.createElement("article");
            panel.className = "media-panel";
            panel.innerHTML = `<h3>Áudios</h3>`;

            items.forEach(item => {
                const div = document.createElement("div");
                div.className = "audio-item";
                div.innerHTML = `
                    <span class="media-name">${item.name}</span>
                    <audio controls preload="none">
                        <source src="${item.url}">
                    </audio>
                `;
                panel.appendChild(div);
            });
            fragment.appendChild(panel);
            container.appendChild(fragment);

        } else if (type === "video") {
            const panel = document.createElement("article");
            panel.className = "media-panel";
            panel.innerHTML = `<h3>Vídeos</h3>`;

            items.forEach(item => {
                const div = document.createElement("div");
                div.className = "video-item";
                div.innerHTML = `
                    <span class="media-name">${item.name}</span>
                    <video controls preload="metadata" playsinline src="${item.url}"></video>
                `;
                panel.appendChild(div);
            });
            fragment.appendChild(panel);
            container.appendChild(fragment);

        } else if (type === "exclusivo") {
            items.forEach(item => {
                const ext = item.extension;
                const article = document.createElement("article");
                article.className = "exclusive-item";

                let mediaHtml = "";
                if (CONFIG.extensions.fotos.includes(ext)) {
                    mediaHtml = `<img src="${item.url}" alt="${item.name}" loading="lazy" decoding="async" onerror="this.parentElement.remove()">`;
                } else if (CONFIG.extensions.audios.includes(ext)) {
                    mediaHtml = `<audio controls preload="none" src="${item.url}"></audio>`;
                } else if (CONFIG.extensions.videos.includes(ext)) {
                    mediaHtml = `<video controls preload="metadata" playsinline src="${item.url}"></video>`;
                }

                article.innerHTML = `
                    <span class="media-name">${item.name}</span>
                    ${mediaHtml}
                `;
                fragment.appendChild(article);
            });
            container.appendChild(fragment);

        } else {
            // Renderização das Fotos
            items.forEach(item => {
                const card = document.createElement("article");
                card.className = "media-card";
                card.tabIndex = 0;
                card.setAttribute("role", "button");
                card.setAttribute("aria-label", `Abrir ${item.name}`);

                card.innerHTML = `
                    <div class="photo-shell">
                        <img src="${item.url}" alt="${item.name}" loading="lazy" decoding="async" onerror="this.parentElement.parentElement.remove()">
                        <div class="photo-overlay">${item.name}</div>
                    </div>
                `;

                card.addEventListener("click", () => openLightbox(item.url, item.name));
                card.addEventListener("keydown", (e) => {
                    if (e.key === "Enter" || e.key === " ") {
                        e.preventDefault();
                        openLightbox(item.url, item.name);
                    }
                });

                fragment.appendChild(card);
            });
            container.appendChild(fragment);
        }
    }

    function updateCounters() {
        const total = state.cache.fotos.length + state.cache.audios.length + state.cache.videos.length;
        document.getElementById("contador").textContent = `${total} ${total === 1 ? "mídia" : "mídias"}`;
        document.getElementById("fotoStatus").textContent = `${state.cache.fotos.length} ${state.cache.fotos.length === 1 ? "foto" : "fotos"}`;
        document.getElementById("audioStatus").textContent = `${state.cache.audios.length} ${state.cache.audios.length === 1 ? "áudio" : "áudios"}`;
        document.getElementById("videoStatus").textContent = `${state.cache.videos.length} ${state.cache.videos.length === 1 ? "vídeo" : "vídeos"}`;
        document.getElementById("exclusiveStatus").textContent = `${state.cache.exclusivo.length} ${state.cache.exclusivo.length === 1 ? "arquivo" : "arquivos"}`;
    }

    function renderAll() {
        updateCounters();
        renderCategory("galeria", "fotoEmpty", state.cache.fotos, "foto");
        renderCategory("audios", "audioEmpty", state.cache.audios, "audio");
        renderCategory("videos", "videoEmpty", state.cache.videos, "video");
        renderCategory("exclusivo", "exclusiveEmpty", state.cache.exclusivo, "exclusivo");
    }

    // 7. GERENCIAMENTO DAS ABAS
    function setupTabs() {
        const tabButtons = document.querySelectorAll(".media-tab");
        const sections = document.querySelectorAll(".section");

        tabButtons.forEach(btn => {
            btn.addEventListener("click", () => {
                const targetSection = btn.getAttribute("data-section");

                tabButtons.forEach(b => {
                    b.classList.remove("active");
                    b.setAttribute("aria-selected", "false");
                });

                sections.forEach(s => {
                    s.classList.remove("active");
                    s.hidden = true;
                });

                btn.classList.add("active");
                btn.setAttribute("aria-selected", "true");

                const activeSection = document.getElementById(`section-${targetSection}`);
                if (activeSection) {
                    activeSection.classList.add("active");
                    activeSection.hidden = false;
                }
            });
        });
    }

    // 8. GERENCIAMENTO DO LIGHTBOX
    function setupLightbox() {
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = document.getElementById("lightboxImg");
        const lightboxCaption = document.getElementById("lightboxCaption");
        const closeBtn = document.getElementById("lightboxClose");

        window.openLightbox = function(url, caption) {
            if (!lightboxImg || !lightbox) return;
            lightboxImg.src = url;
            lightboxCaption.textContent = caption || "";
            lightbox.classList.add("aberto");
            lightbox.setAttribute("aria-hidden", "false");
            document.body.style.overflow = "hidden";
        };

        function close() {
            if (!lightbox) return;
            lightbox.classList.remove("aberto");
            lightbox.setAttribute("aria-hidden", "true");
            lightboxImg.src = "";
            lightboxCaption.textContent = "";
            document.body.style.overflow = "";
        }

        if (closeBtn) closeBtn.addEventListener("click", close);
        if (lightbox) {
            lightbox.addEventListener("click", (e) => {
                if (e.target === lightbox) close();
            });
        }
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && lightbox && lightbox.classList.contains("aberto")) {
                close();
            }
        });
    }

    // 9. CONTROLE DA MÚSICA DE FUNDO (midia/tema.mp3)
    function setupBackgroundAudio(branch) {
        const bgAudio = document.getElementById("bgAudio");
        const btnMusica = document.getElementById("btnMusica");
        const iconeMusica = document.getElementById("iconeMusica");
        if (!bgAudio || !btnMusica) return;

        bgAudio.src = buildRawUrl("midia/tema.mp3", branch);

        btnMusica.addEventListener("click", () => {
            if (bgAudio.paused) {
                bgAudio.play().then(() => {
                    btnMusica.classList.add("playing");
                    btnMusica.title = "Pausar música";
                    if (iconeMusica) {
                        iconeMusica.innerHTML = '<rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect>';
                    }
                }).catch(() => {});
            } else {
                bgAudio.pause();
                btnMusica.classList.remove("playing");
                btnMusica.title = "Continuar música";
                if (iconeMusica) {
                    iconeMusica.innerHTML = '<path d="m7 4 12 8-12 8z"></path>';
                }
            }
        });
    }

    // 10. INICIALIZAÇÃO SILENCIOSA E ROBUSTA
    async function init() {
        setupUser();
        setupTabs();
        setupLightbox();

        // Obtém Branch padrão
        state.defaultBranch = await fetchDefaultBranch();

        // Configura música de fundo
        setupBackgroundAudio(state.defaultBranch);

        // Busca árvore do repositório via GitHub API
        const tree = await fetchRepositoryTree(state.defaultBranch);

        if (tree) {
            processAndClassifyMedia(tree, state.defaultBranch);
            renderAll();
        }
    }

    document.addEventListener("DOMContentLoaded", init);
})();
</script>
