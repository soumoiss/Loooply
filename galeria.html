<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f0ff" />
  <meta name="color-scheme" content="light" />
  <title>Momentos - Loooply</title>
  <style>
    :root {
      --bg: #f4f0ff;
      --bg-2: #eee8ff;
      --surface: rgba(255,255,255,.94);
      --primary: #9b5de5;
      --primary-strong: #8750cf;
      --primary-pale: #f4edff;
      --text: #29252f;
      --muted: #817b89;
      --line: rgba(102,82,126,.12);
      --shadow-sm: 0 5px 18px rgba(80,56,115,.07);
      --shadow-md: 0 16px 38px rgba(80,56,115,.11);
      --shadow-lg: 0 28px 80px rgba(65,45,94,.18);
      --radius: 20px;
      --gap: 14px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% -8%, rgba(177,131,255,.22), transparent 31%),
        radial-gradient(circle at 94% 8%, rgba(220,204,255,.48), transparent 28%),
        linear-gradient(135deg, var(--bg), var(--bg-2));
      padding: max(18px, env(safe-area-inset-top))
               max(14px, env(safe-area-inset-right))
               max(30px, env(safe-area-inset-bottom))
               max(14px, env(safe-area-inset-left));
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      opacity: .34;
      background-image:
        linear-gradient(rgba(255,255,255,.35) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.25) 1px, transparent 1px);
      background-size: 38px 38px;
      mask-image: linear-gradient(to bottom, black, transparent 76%);
      -webkit-mask-image: linear-gradient(to bottom, black, transparent 76%);
    }

    a, button, input, select {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    img, video { max-width: 100%; display: block; }

    .app-shell {
      width: min(100%, 1240px);
      margin: 0 auto;
      animation: pageIn .35s ease both;
    }

    @keyframes pageIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-btn, .action-btn, .sort-btn, .tab-btn {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,.86);
      color: var(--primary-strong);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all .2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
    }

    .nav-btn { padding: 7px 14px; gap: 8px; }
    .action-btn, .sort-btn, .tab-btn { padding: 0 16px; }

    .nav-btn:hover, .action-btn:hover, .sort-btn:hover, .tab-btn:hover {
      transform: translateY(-2px);
      background: #fff;
      box-shadow: var(--shadow-md);
    }

    .container {
      width: 100%;
      padding: clamp(20px, 4vw, 36px);
      border: 1px solid rgba(120,92,155,.12);
      border-radius: 32px;
      background: var(--surface);
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .hero { text-align: center; margin-bottom: 18px; }
    .hero h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(40px, 8vw, 68px);
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, var(--text), var(--primary-strong));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .search-box {
      position: relative;
      flex: 1 1 260px;
      max-width: 440px;
    }

    .search-box input {
      width: 100%;
      height: 44px;
      padding: 0 16px 0 42px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.9);
      color: var(--text);
      font-size: 13px;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(155,93,229,.15);
      background: #fff;
    }

    .search-box svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--muted);
      pointer-events: none;
    }

    .controls-right {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      flex-wrap: wrap;
    }

    .contador {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      border-radius: 14px;
      background: var(--primary-pale);
      border: 1px solid rgba(155,93,229,.18);
      color: var(--primary-strong);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .view-switcher {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.86);
    }

    .view-btn {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 12px;
      display: grid;
      place-items: center;
      cursor: pointer;
      background: transparent;
      color: var(--muted);
      transition: all .2s ease;
    }

    .view-btn.active {
      color: #fff;
      background: var(--primary);
      box-shadow: 0 5px 15px rgba(155,93,229,.25);
    }

    .sort-wrap { position: relative; }

    .sort-btn {
      min-height: 44px;
      gap: 7px;
      font-size: 12px;
      font-weight: 800;
      padding: 0 12px;
    }

    .sort-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      z-index: 80;
      min-width: 190px;
      padding: 7px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.98);
      box-shadow: var(--shadow-lg);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-5px);
      transition: all .18s ease;
    }

    .sort-menu.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .sort-option {
      width: 100%;
      min-height: 38px;
      padding: 0 10px;
      border: none;
      border-radius: 10px;
      background: transparent;
      text-align: left;
      cursor: pointer;
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
    }

    .sort-option.active, .sort-option:hover {
      color: var(--primary-strong);
      background: var(--primary-pale);
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .tab-btn {
      min-height: 46px;
      padding: 0 18px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      border-radius: 16px;
      background: rgba(255,255,255,.85);
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 8px 24px rgba(155,93,229,.28);
    }

    .section { display: none; }
    .section.active { display: block; animation: sectionIn .24s ease both; }

    @keyframes sectionIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .gallery {
      width: 100%;
      max-width: 100%;
      column-count: 4;
      column-gap: var(--gap);
    }

    .gallery.grid {
      column-count: initial;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--gap);
    }

    .gallery.list {
      column-count: initial;
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .media-card {
      position: relative;
      break-inside: avoid;
      margin: 0 0 var(--gap);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid rgba(102,82,126,.12);
      background: linear-gradient(135deg, #f1eaff, #fff);
      box-shadow: 0 8px 22px rgba(80,56,115,.08);
      cursor: pointer;
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .gallery.grid .media-card {
      margin: 0;
    }

    .gallery.list .media-card {
      display: grid;
      grid-template-columns: 110px minmax(0, 1fr);
      align-items: center;
      gap: 14px;
      padding: 8px;
      margin: 0;
    }

    .media-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 36px rgba(80,56,115,.16);
    }

    .photo-shell {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #f0ebfa;
    }

    .gallery.grid .photo-shell {
      aspect-ratio: 1 / 1;
    }

    .gallery.list .photo-shell {
      width: 110px;
      height: 82px;
      border-radius: 14px;
      overflow: hidden;
    }

    .photo-shell img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform .3s ease, opacity .2s ease;
      opacity: 0.9;
    }

    .media-card:hover .photo-shell img {
      transform: scale(1.02);
    }

    .photo-overlay {
      position: absolute;
      inset: auto 0 0 0;
      padding: 38px 14px 14px;
      background: linear-gradient(transparent, rgba(25,18,35,.76));
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      opacity: 0;
      transform: translateY(8px);
      transition: all .25s ease;
      text-shadow: 0 2px 4px rgba(0,0,0,.4);
      pointer-events: none;
    }

    .media-card:hover .photo-overlay {
      opacity: 1;
      transform: translateY(0);
    }

    .gallery.list .photo-overlay {
      position: static;
      opacity: 1;
      transform: none;
      padding: 12px 8px 0 0;
      background: transparent;
      color: var(--text);
      text-shadow: none;
    }

    .empty-state {
      display: none;
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
      border: 2px dashed rgba(117,101,132,.18);
      border-radius: 24px;
      background: rgba(255,255,255,.4);
    }

    .empty-state.visible { display: block; }

    .status-bar {
      min-height: 26px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      text-align: center;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      background: rgba(18,14,24,.96);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .25s ease, visibility .25s ease;
    }

    .lightbox.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .lightbox-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      z-index: 10;
    }

    .lightbox-counter {
      font-size: 14px;
      font-weight: 800;
      background: rgba(255,255,255,.15);
      padding: 6px 14px;
      border-radius: 999px;
      backdrop-filter: blur(10px);
    }

    .lightbox-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .lightbox-btn {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,.15);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background .2s ease, transform .2s ease;
      text-decoration: none;
    }

    .lightbox-btn:hover {
      background: rgba(255,255,255,.3);
      transform: scale(1.05);
    }

    .lightbox-stage {
      position: relative;
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin: 10px 0;
    }

    .lightbox-media {
      max-width: 95vw;
      max-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .2s ease-out;
    }

    .lightbox-media img,
    .lightbox-media video {
      max-width: 95vw;
      max-height: 80vh;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,.6);
      background: #000;
    }

    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.15);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      backdrop-filter: blur(12px);
      font-size: 34px;
      line-height: 1;
    }

    .lightbox-nav.prev { left: 10px; }
    .lightbox-nav.next { right: 10px; }

    .lightbox-caption {
      color: rgba(255,255,255,.9);
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      padding: 8px 20px;
      background: rgba(255,255,255,.08);
      border-radius: 999px;
      max-width: 90vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 1100px) {
      .gallery { column-count: 3; }
      .gallery.grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 768px) {
      .gallery { column-count: 2; }
      .gallery.grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .controls-right { width: 100%; justify-content: space-between; margin-left: 0; }
      .search-box { max-width: 100%; }
    }

    @media (max-width: 440px) {
      .gallery { column-count: 1; }
      .gallery.grid { grid-template-columns: 1fr; }
      .gallery.list .media-card {
        grid-template-columns: 90px minmax(0,1fr);
      }
      .lightbox-nav { display: none; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div></div>
      <div class="topbar-right">
        <a class="nav-btn" href="home.html">Home</a>
        <a class="nav-btn" href="index.html">Loooply</a>
      </div>
    </header>

    <main class="container">
      <section class="hero">
        <h1>Momentos</h1>
        <div class="hero-subtitle">Memórias em fotos, vídeos e coleções</div>
      </section>

      <div class="toolbar">
        <label class="search-box" aria-label="Buscar mídia">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="6"></circle>
            <path d="M16 16L21 21"></path>
          </svg>
          <input id="search-input" type="search" placeholder="Buscar por nome..." />
        </label>

        <div class="controls-right">
          <span id="contador" class="contador">0 itens</span>

          <div class="view-switcher" aria-label="Alternar visualização">
            <button class="view-btn active" data-view="masonry" aria-label="Masonry">▦</button>
            <button class="view-btn" data-view="grid" aria-label="Grade">▣</button>
            <button class="view-btn" data-view="list" aria-label="Lista">☰</button>
          </div>

          <div class="sort-wrap">
            <button id="sort-btn" class="sort-btn" type="button" aria-expanded="false">
              Ordenar: mais recentes
            </button>
            <div id="sort-menu" class="sort-menu" role="menu">
              <button class="sort-option active" data-sort="recent" type="button">Mais recentes</button>
              <button class="sort-option" data-sort="oldest" type="button">Mais antigas</button>
              <button class="sort-option" data-sort="name" type="button">Nome</button>
            </div>
          </div>
        </div>
      </div>

      <div class="tabs" role="tablist" aria-label="Filtros de mídia">
        <button class="tab-btn active" type="button" data-tab="all">Todos</button>
        <button class="tab-btn" type="button" data-tab="foto">Fotos</button>
        <button class="tab-btn" type="button" data-tab="video">Vídeos</button>
        <button class="tab-btn" type="button" data-tab="Misol">Misol</button>
      </div>

      <section id="media-section" class="section active">
        <div id="gallery" class="gallery masonry" aria-live="polite"></div>
        <div id="empty-state" class="empty-state">
          <strong>Nenhum item encontrado</strong>
          Tente outra busca ou selecione outro filtro.
        </div>
        <div id="status-bar" class="status-bar" aria-live="polite"></div>
      </section>
    </main>
  </div>

  <div id="lightbox" class="lightbox" aria-modal="true" role="dialog">
    <div class="lightbox-header">
      <div class="lightbox-counter" id="lightbox-counter">1 / 1</div>
      <div class="lightbox-actions">
        <button class="lightbox-btn" id="lightbox-close" type="button" aria-label="Fechar">✕</button>
      </div>
    </div>

    <div class="lightbox-stage">
      <button class="lightbox-nav prev" id="lightbox-prev" type="button" aria-label="Anterior">‹</button>
      <div class="lightbox-media" id="lightbox-media"></div>
      <button class="lightbox-nav next" id="lightbox-next" type="button" aria-label="Próximo">›</button>
    </div>

    <div id="lightbox-caption" class="lightbox-caption"></div>
  </div>

  <script>
    const state = {
      items: [],
      filtered: [],
      activeTab: 'all',
      view: 'masonry',
      sort: 'recent',
      query: '',
      currentIndex: 0,
      lightboxOpen: false
    };

    const galleryEl = document.getElementById('gallery');
    const emptyStateEl = document.getElementById('empty-state');
    const statusBarEl = document.getElementById('status-bar');
    const contadorEl = document.getElementById('contador');
    const sortBtn = document.getElementById('sort-btn');
    const sortMenu = document.getElementById('sort-menu');
    const searchInput = document.getElementById('search-input');

    function normalizeMediaItem(item, fallbackGroup = 'all') {
      const fileName = item.name || item.path?.split('/').pop() || 'arquivo';
      const isVideo = (item.type || '').toLowerCase() === 'video' || /\.mp4$/i.test(fileName) || /\.webm$/i.test(fileName);
      const isImage = (item.type || '').toLowerCase() === 'foto' || /\.(jpe?g|png|webp|gif|bmp)$/i.test(fileName);

      return {
        id: item.path || fileName,
        name: fileName,
        path: item.path || '',
        type: isVideo ? 'video' : (isImage ? 'foto' : 'foto'),
        group: item.group || fallbackGroup,
        modified: item.modified || null,
        width: item.width || null,
        height: item.height || null,
        ratio: item.ratio || null
      };
    }

    function collectMedia(data) {
      const items = [];
      const fotoList = Array.isArray(data.fotos) ? data.fotos : [];
      const videoList = Array.isArray(data.videos) ? data.videos : [];
      const exclusivo = data.exclusivo || {};

      fotoList.forEach(item => items.push(normalizeMediaItem(item, 'all')));
      videoList.forEach(item => items.push(normalizeMediaItem(item, 'all')));

      Object.entries(exclusivo).forEach(([group, list]) => {
        if (Array.isArray(list)) {
          list.forEach(item => items.push(normalizeMediaItem(item, group)));
        }
      });

      return items
        .filter(item => item.path)
        .sort((a, b) => {
          const ta = new Date(a.modified || 0).getTime();
          const tb = new Date(b.modified || 0).getTime();
          return tb - ta;
        });
    }

    function applySort() {
      const sorted = [...state.filtered];
      if (state.sort === 'oldest') {
        return sorted.sort((a, b) => new Date(a.modified || 0) - new Date(b.modified || 0));
      }
      if (state.sort === 'name') {
        return sorted.sort((a, b) => a.name.localeCompare(b.name));
      }
      return sorted.sort((a, b) => new Date(b.modified || 0) - new Date(a.modified || 0));
    }

    function applyFilters() {
      const q = state.query.trim().toLowerCase();
      let filtered = state.items.filter(item => {
        const matchesTab =
          state.activeTab === 'all' ||
          item.type === state.activeTab ||
          (state.activeTab === 'Misol' && item.group === 'Misol');

        const matchesSearch = !q || item.name.toLowerCase().includes(q);
        return matchesTab && matchesSearch;
      });

      state.filtered = filtered;
      render();
    }

    function render() {
      const sorted = applySort();
      const total = sorted.length;
      contadorEl.textContent = `${total} item${total === 1 ? '' : 's'}`;

      galleryEl.className = `gallery ${state.view}`;
      galleryEl.innerHTML = '';

      if (!total) {
        emptyStateEl.classList.add('visible');
        statusBarEl.textContent = 'Nenhum item corresponde ao filtro atual.';
      } else {
        emptyStateEl.classList.remove('visible');
        statusBarEl.textContent = '';
      }

      sorted.forEach((item, index) => {
        const card = document.createElement('article');
        card.className = 'media-card';
        card.tabIndex = 0;
        card.setAttribute('role', 'button');
        card.setAttribute('aria-label', `Abrir ${item.name}`);

        const shell = document.createElement('div');
        shell.className = 'photo-shell';

        if (item.type === 'video') {
          const media = document.createElement('video');
          media.muted = true;
          media.preload = 'metadata';
          media.playsInline = true;
          media.src = item.path;
          shell.appendChild(media);
        } else {
          const img = document.createElement('img');
          img.loading = 'lazy';
          img.src = item.path;
          img.alt = item.name;
          img.onerror = () => {
            shell.innerHTML = '<div style="min-height:180px;display:grid;place-items:center;color:#817b89;">Imagem indisponível</div>';
          };
          shell.appendChild(img);
        }

        const overlay = document.createElement('div');
        overlay.className = 'photo-overlay';
        overlay.textContent = item.name;
        shell.appendChild(overlay);

        card.appendChild(shell);

        card.addEventListener('click', () => openLightbox(index, sorted));
        card.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            openLightbox(index, sorted);
          }
        });

        galleryEl.appendChild(card);
      });
    }

    function openLightbox(index, list = state.filtered) {
      if (!list.length) return;
      state.currentIndex = index;
      state.lightboxOpen = true;
      const lightbox = document.getElementById('lightbox');
      const mediaContainer = document.getElementById('lightbox-media');
      const counter = document.getElementById('lightbox-counter');
      const caption = document.getElementById('lightbox-caption');

      const item = list[state.currentIndex];
      counter.textContent = `${state.currentIndex + 1} / ${list.length}`;
      caption.textContent = item.name;
      mediaContainer.innerHTML = '';

      if (item.type === 'video') {
        const video = document.createElement('video');
        video.src = item.path;
        video.controls = true;
        video.autoplay = true;
        video.muted = false;
        video.playsInline = true;
        mediaContainer.appendChild(video);
      } else {
        const img = document.createElement('img');
        img.src = item.path;
        img.alt = item.name;
        img.onerror = () => {
          mediaContainer.innerHTML = '<div style="color:#fff;padding:40px 20px;">Imagem indisponível</div>';
        };
        mediaContainer.appendChild(img);
      }

      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
      document.body.style.overflow = '';
      state.lightboxOpen = false;
    }

    function changeLightbox(delta) {
      const list = state.filtered;
      if (!list.length) return;
      const nextIndex = (state.currentIndex + delta + list.length) % list.length;
      state.currentIndex = nextIndex;
      const mediaContainer = document.getElementById('lightbox-media');
      const counter = document.getElementById('lightbox-counter');
      const caption = document.getElementById('lightbox-caption');
      const item = list[state.currentIndex];

      counter.textContent = `${state.currentIndex + 1} / ${list.length}`;
      caption.textContent = item.name;
      mediaContainer.innerHTML = '';

      if (item.type === 'video') {
        const video = document.createElement('video');
        video.src = item.path;
        video.controls = true;
        video.autoplay = true;
        video.muted = false;
        video.playsInline = true;
        mediaContainer.appendChild(video);
      } else {
        const img = document.createElement('img');
        img.src = item.path;
        img.alt = item.name;
        mediaContainer.appendChild(img);
      }
    }

    function setupSortMenu() {
      document.querySelectorAll('.sort-option').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.sort-option').forEach(el => el.classList.remove('active'));
          btn.classList.add('active');
          state.sort = btn.dataset.sort;
          const labelMap = {
            recent: 'Ordenar: mais recentes',
            oldest: 'Ordenar: mais antigas',
            name: 'Ordenar: nome'
          };
          sortBtn.textContent = labelMap[state.sort];
          sortMenu.classList.remove('open');
          sortBtn.setAttribute('aria-expanded', 'false');
          render();
        });
      });

      sortBtn.addEventListener('click', () => {
        const isOpen = sortMenu.classList.contains('open');
        sortMenu.classList.toggle('open', !isOpen);
        sortBtn.setAttribute('aria-expanded', String(!isOpen));
      });
    }

    function setupTabs() {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
          btn.classList.add('active');
          state.activeTab = btn.dataset.tab;
          applyFilters();
        });
      });
    }

    function setupViewButtons() {
      document.querySelectorAll('.view-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.view-btn').forEach(el => el.classList.remove('active'));
          btn.classList.add('active');
          state.view = btn.dataset.view;
          render();
        });
      });
    }

    function setupSearch() {
      searchInput.addEventListener('input', (event) => {
        state.query = event.target.value;
        applyFilters();
      });
    }

    async function loadData() {
      const status = document.getElementById('status-bar');
      status.textContent = 'Carregando mídia...';

      try {
        const url = new URL('midia-index.json', window.location.href);
        const response = await fetch(url.href, { cache: 'no-store' });

        if (!response.ok) {
          throw new Error(`Falha ao buscar midia-index.json (${response.status})`);
        }

        const data = await response.json();
        state.items = collectMedia(data);
        state.filtered = [...state.items];
        applyFilters();
        status.textContent = '';
      } catch (err) {
        console.error(err);
        status.textContent = 'Não foi possível carregar a galeria. Verifique os arquivos locais e o servidor.';
        emptyStateEl.classList.add('visible');
      }
    }

    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    document.getElementById('lightbox-prev').addEventListener('click', () => changeLightbox(-1));
    document.getElementById('lightbox-next').addEventListener('click', () => changeLightbox(1));
    document.addEventListener('keydown', (event) => {
      if (!state.lightboxOpen) return;
      if (event.key === 'Escape') closeLightbox();
      if (event.key === 'ArrowRight') changeLightbox(1);
      if (event.key === 'ArrowLeft') changeLightbox(-1);
    });

    setupSortMenu();
    setupTabs();
    setupViewButtons();
    setupSearch();
    loadData();
  </script>
</body>
</html>
