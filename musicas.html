<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f0ff" />
  <meta name="description" content="Galeria de momentos do Loooply." />
  <title>Momentos - Loooply</title>
  <link rel="icon" href="icon.png" type="image/png" />
  <style>
    :root {
      --bg: #f4f0ff;
      --bg-2: #eee8ff;
      --surface: rgba(255,255,255,.94);
      --surface-soft: #f8f5ff;
      --primary: #9b5de5;
      --primary-strong: #8750cf;
      --text: #29252f;
      --muted: #817b89;
      --line: rgba(102,82,126,.12);
      --shadow-sm: 0 5px 18px rgba(80,56,115,.07);
      --shadow-md: 0 16px 38px rgba(80,56,115,.11);
      --shadow-lg: 0 28px 80px rgba(65,45,94,.18);
      --radius: 20px;
      --gap: 14px;
      --columns: 4;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { min-height: 100%; scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      color: var(--text);
      font-family: Inter, ui-sans-serif, sans-serif;
      background:
        radial-gradient(circle at 10% -8%, rgba(177,131,255,.22), transparent 31%),
        radial-gradient(circle at 94% 8%, rgba(220,204,255,.48), transparent 28%),
        linear-gradient(135deg, var(--bg), var(--bg-2));
      padding: max(18px, env(safe-area-inset-top)) 14px max(30px, env(safe-area-inset-bottom)) 14px;
    }

    button, input, a { font: inherit; }
    img { max-width: 100%; display: block; }
    .app-shell { width: min(100%, 1240px); margin: 0 auto; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .topbar-right { display: flex; align-items: center; gap: 8px; }

    .navigation-button, .music-button, .action-btn, .sort-btn {
      min-height: 46px; border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,.86); color: var(--primary-strong); cursor: pointer; box-shadow: var(--shadow-sm); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; transition: all .2s ease;
    }
    .navigation-button { padding: 7px 14px; gap: 8px; }
    .navigation-button:hover, .music-button:hover, .action-btn:hover, .sort-btn:hover { transform: translateY(-2px); background: #fff; box-shadow: var(--shadow-md); }
    .navigation-button svg, .music-button svg, .action-btn svg, .sort-btn svg { width: 20px; height: 20px; flex-shrink: 0; }
    .navigation-label { font-size: 13px; font-weight: 800; }

    .container {
      width: 100%; padding: clamp(20px, 4vw, 36px); border: 1px solid rgba(120,92,155,.12); border-radius: 32px; background: var(--surface); box-shadow: var(--shadow-lg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    }

    .hero { text-align: center; margin-bottom: 22px; }
    .hero h1 {
      font-size: clamp(40px, 8vw, 68px); font-weight: 400; line-height: 1.05; background: linear-gradient(135deg, var(--text), var(--primary-strong)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .hero-subtitle { margin-top: 8px; color: var(--muted); font-size: 12px; font-weight: 650; }

    .toolbar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px;
    }
    .search-box { position: relative; flex: 1 1 260px; max-width: 440px; }
    .search-box input {
      width: 100%; height: 44px; padding: 0 16px 0 42px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.9); font-size: 13px; color: var(--text); transition: all .2s ease;
    }
    .search-box input:focus { background: #fff; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(155,93,229,.15); }
    .search-box svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
    .controls-right { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
    .contador {
      display: inline-flex; align-items: center; justify-content: center; padding: 10px 14px; border-radius: 14px; background: var(--primary-pale); border: 1px solid rgba(155,93,229,.18); color: var(--primary-strong); font-size: 13px; font-weight: 800; white-space: nowrap;
    }

    .galeria {
      column-count: var(--columns); column-gap: var(--gap); width: 100%; max-width: 100%; margin: 0 auto;
    }
    .media-card {
      position: relative; cursor: pointer; border-radius: var(--radius); overflow: hidden; background: linear-gradient(135deg, #f1eaff, #fff); border: 1px solid rgba(102,82,126,.12); box-shadow: 0 8px 22px rgba(80,56,115,.08); transition: transform .25s ease, box-shadow .25s ease; margin: 0 0 var(--gap); display: block; break-inside: avoid; -webkit-column-break-inside: avoid;
    }
    .media-card:hover { transform: translateY(-3px) scale(1.006); box-shadow: 0 16px 36px rgba(80,56,115,.16); }
    .photo-shell { position: relative; width: 100%; overflow: hidden; background: #f0ebfa; }
    .photo-shell img { width: 100%; display: block; object-fit: cover; transition: transform .4s ease, opacity .2s ease; }
    .photo-overlay {
      position: absolute; inset: auto 0 0 0; padding: 38px 14px 14px; background: linear-gradient(transparent, rgba(25,18,35,.76)); color: #fff; font-size: 12px; font-weight: 700; opacity: 0; transform: translateY(8px); transition: all .25s ease; pointer-events: none; text-shadow: 0 2px 4px rgba(0,0,0,.4);
    }
    .media-card:hover .photo-overlay { opacity: 1; transform: translateY(0); }

    .empty-state {
      display: none; padding: 40px 20px; text-align: center; color: var(--muted); border: 2px dashed rgba(117,101,132,.18); border-radius: 24px; background: rgba(255,255,255,.5);
    }
    .empty-state.visible { display: block; }

    .lightbox {
      position: fixed; inset: 0; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 20px; background: rgba(18,14,24,.96); opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .25s ease, visibility .25s ease;
    }
    .lightbox.aberto { opacity: 1; visibility: visible; pointer-events: auto; }
    .lightbox-header { width: 100%; display: flex; align-items: center; justify-content: space-between; color: #fff; z-index: 10; }
    .lightbox-counter { font-size: 14px; font-weight: 800; background: rgba(255,255,255,.15); padding: 6px 14px; border-radius: 999px; }
    .lightbox-actions { display: flex; align-items: center; gap: 10px; }
    .lightbox-btn {
      width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.15); color: #fff; display: grid; place-items: center; cursor: pointer; transition: background .2s ease, transform .2s ease; text-decoration: none; border: none;
    }
    .lightbox-btn:hover { background: rgba(255,255,255,.3); transform: scale(1.05); }
    .lightbox-stage { position: relative; width: 100%; flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; margin: 10px 0; }
    .lightbox-media-container { max-width: 95vw; max-height: 80vh; display: flex; align-items: center; justify-content: center; transition: transform .2s ease-out; }
    .lightbox-img { max-width: 95vw; max-height: 80vh; width: auto; height: auto; object-fit: contain; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
    .lightbox-nav-btn {
      position: absolute; top: 50%; transform: translateY(-50%); width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,.15); color: #fff; display: grid; place-items: center; cursor: pointer; border: 1px solid rgba(255,255,255,.2); transition: all .2s ease; z-index: 5; font-size: 36px; line-height: 1;
    }
    .lightbox-nav-btn.prev { left: 10px; }
    .lightbox-nav-btn.next { right: 10px; }
    .lightbox-caption { color: rgba(255,255,255,.9); font-size: 13px; font-weight: 700; text-align: center; padding: 8px 20px; background: rgba(255,255,255,.1); border-radius: 999px; max-width: 90vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    @media (max-width: 1100px) { :root { --columns: 3; } }
    @media (max-width: 768px) { :root { --columns: 2; --gap: 10px; } }
    @media (max-width: 440px) { :root { --columns: 1; } }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="navigation-button" href="home.html" aria-label="Voltar para home">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="navigation-label">Home</span>
      </a>
      <div class="topbar-right">
        <a class="music-button" href="musicas.html" aria-label="Ir para músicas">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 18V6l11-2v12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="1.8"/><circle cx="17" cy="16" r="3" stroke="currentColor" stroke-width="1.8"/></svg>
          <span>Músicas</span>
        </a>
      </div>
    </header>

    <main class="container">
      <section class="hero">
        <h1>Momentos</h1>
        <p class="hero-subtitle">Lembranças que ficaram no coração.</p>
      </section>

      <div class="toolbar">
        <label class="search-box" aria-label="Buscar fotos">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input id="searchInput" type="search" placeholder="Buscar por nome ou frase..." />
        </label>

        <div class="controls-right">
          <div class="contador" id="galleryCount">0 fotos</div>
        </div>
      </div>

      <section id="gallery" class="galeria" aria-live="polite"></section>
      <div id="emptyGallery" class="empty-state">
        <strong>Nenhuma foto encontrada</strong>
        Tente outra busca ou volte mais tarde.
      </div>
    </main>
  </div>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lightbox-header">
      <div class="lightbox-counter" id="lightboxCounter">1 / 1</div>
      <div class="lightbox-actions">
        <button class="lightbox-btn" id="closeLightbox" aria-label="Fechar">✕</button>
      </div>
    </div>
    <div class="lightbox-stage">
      <button class="lightbox-nav-btn prev" id="prevPhoto" aria-label="Anterior">‹</button>
      <div class="lightbox-media-container" id="lightboxMedia"></div>
      <button class="lightbox-nav-btn next" id="nextPhoto" aria-label="Próxima">›</button>
    </div>
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>

  <script src="config.js"></script>
  <script src="utils.js"></script>
  <script>
    if (!Utils.Auth.isLoggedIn()) {
      window.location.href = LOOOPLY_CONFIG.ROUTES.LOGIN;
    }

    const photoList = [
      { name: '20260921_123850.jpg', title: 'Primeiro encontro' },
      { name: '20260921_150554.jpg', title: 'Noite especial' },
      { name: '20260925_170903.jpg', title: 'A viagem' },
      { name: '20260925_180500.jpg', title: 'Risos e paz' },
      { name: 'IMG-20260930-WA0017.jpg', title: 'Momentos em família' },
      { name: 'Screenshot_20260907_220115_Instagram.jpg', title: 'Registro do nosso mundo' }
    ];

    const galleryEl = document.getElementById('gallery');
    const searchInput = document.getElementById('searchInput');
    const galleryCount = document.getElementById('galleryCount');
    const emptyGallery = document.getElementById('emptyGallery');
    const lightbox = document.getElementById('lightbox');
    const lightboxMedia = document.getElementById('lightboxMedia');
    const lightboxCaption = document.getElementById('lightboxCaption');
    const lightboxCounter = document.getElementById('lightboxCounter');

    let currentIndex = 0;
    const filteredPhotos = [...photoList];

    function renderGallery(list = filteredPhotos) {
      galleryEl.innerHTML = '';
      galleryCount.textContent = `${list.length} foto${list.length === 1 ? '' : 's'}`;

      if (!list.length) {
        emptyGallery.classList.add('visible');
        return;
      }

      emptyGallery.classList.remove('visible');

      list.forEach((photo, index) => {
        const card = document.createElement('article');
        card.className = 'media-card';
        card.setAttribute('tabindex', '0');
        card.setAttribute('role', 'button');
        card.setAttribute('aria-label', photo.title);
        card.innerHTML = `
          <div class="photo-shell">
            <img src="${photo.name}" alt="${photo.title}" loading="lazy" />
            <div class="photo-overlay">${photo.title}</div>
          </div>
        `;

        card.addEventListener('click', () => openLightbox(index, list));
        card.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            openLightbox(index, list);
          }
        });

        galleryEl.appendChild(card);
      });
    }

    function openLightbox(index, list) {
      currentIndex = index;
      const item = list[index];
      lightboxMedia.innerHTML = `<img class="lightbox-img" src="${item.name}" alt="${item.title}" />`;
      lightboxCaption.textContent = item.title;
      lightboxCounter.textContent = `${index + 1} / ${list.length}`;
      lightbox.classList.add('aberto');
      lightbox.setAttribute('aria-hidden', 'false');
    }

    function closeLightbox() {
      lightbox.classList.remove('aberto');
      lightbox.setAttribute('aria-hidden', 'true');
    }

    function updateLightbox(step) {
      const visibleItems = filteredPhotos.filter((photo) => {
        const query = searchInput.value.trim().toLowerCase();
        if (!query) return true;
        return photo.title.toLowerCase().includes(query) || photo.name.toLowerCase().includes(query);
      });

      if (!visibleItems.length) return;
      currentIndex = (currentIndex + step + visibleItems.length) % visibleItems.length;
      const item = visibleItems[currentIndex];
      const globalIndex = filteredPhotos.findIndex((photo) => photo.name === item.name && photo.title === item.title);
      lightboxMedia.innerHTML = `<img class="lightbox-img" src="${item.name}" alt="${item.title}" />`;
      lightboxCaption.textContent = item.title;
      lightboxCounter.textContent = `${globalIndex + 1} / ${filteredPhotos.length}`;
    }

    searchInput.addEventListener('input', () => {
      const query = searchInput.value.trim().toLowerCase();
      const filtered = filteredPhotos.filter((photo) => {
        return photo.title.toLowerCase().includes(query) || photo.name.toLowerCase().includes(query);
      });
      renderGallery(filtered);
    });

    document.getElementById('closeLightbox').addEventListener('click', closeLightbox);
    document.getElementById('prevPhoto').addEventListener('click', () => updateLightbox(-1));
    document.getElementById('nextPhoto').addEventListener('click', () => updateLightbox(1));

    document.addEventListener('keydown', (event) => {
      if (!lightbox.classList.contains('aberto')) return;
      if (event.key === 'Escape') closeLightbox();
      if (event.key === 'ArrowRight') updateLightbox(1);
      if (event.key === 'ArrowLeft') updateLightbox(-1);
    });

    renderGallery(filteredPhotos);
  </script>
</body>
</html>
