<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f0ff">
<title>Nossas Músicas</title>
<style>
@font-face{
    font-family:"Quillen";
    src:local("Quillen"),url("Quillen.otf") format("opentype");
    font-display:swap;
    font-style:normal;
    font-weight:400;
}

:root{
    --bg:#f4f0ff;
    --bg-2:#eee8ff;
    --surface:rgba(255,255,255,.92);
    --surface-solid:#fff;
    --surface-soft:#f8f5ff;
    --surface-lilac:#f1eaff;
    --primary:#9b5de5;
    --primary-strong:#8750cf;
    --primary-soft:#eadcff;
    --primary-pale:#f4edff;
    --text:#29252f;
    --muted:#817b89;
    --muted-2:#aaa4b0;
    --line:rgba(102,82,126,.12);
    --line-strong:rgba(125,91,164,.20);
    --danger:#9d5f71;
    --shadow-sm:0 5px 18px rgba(80,56,115,.07);
    --shadow-md:0 16px 38px rgba(80,56,115,.11);
    --shadow-lg:0 28px 80px rgba(65,45,94,.18);
    --radius-lg:28px;
    --radius-md:20px;
    --radius-sm:16px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    min-height:100%;
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    min-height:100dvh;
    overflow-x:hidden;
    color:var(--text);
    font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
        radial-gradient(circle at 10% -8%,rgba(177,131,255,.22),transparent 31%),
        radial-gradient(circle at 94% 8%,rgba(220,204,255,.48),transparent 28%),
        linear-gradient(135deg,var(--bg),var(--bg-2));
    padding:
        max(18px,env(safe-area-inset-top))
        max(14px,env(safe-area-inset-right))
        max(30px,env(safe-area-inset-bottom))
        max(14px,env(safe-area-inset-left));
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-1;
    opacity:.34;
    background-image:
        linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.25) 1px,transparent 1px);
    background-size:38px 38px;
    mask-image:linear-gradient(to bottom,black,transparent 76%);
}

button{
    font:inherit;
    -webkit-tap-highlight-color:transparent;
}

button:focus-visible,
a:focus-visible{
    outline:3px solid rgba(155,93,229,.30);
    outline-offset:3px;
}

.app-shell{
    width:min(100%,780px);
    margin:0 auto;
    animation:pageIn .45s ease both;
}

@keyframes pageIn{
    from{opacity:0;transform:translateY(12px)}
    to{opacity:1;transform:translateY(0)}
}

.topbar{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    margin-bottom:14px;
}

.navigation-stack{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:7px;
}

.icon-button{
    width:46px;
    height:46px;
    flex:0 0 46px;
    display:grid;
    place-items:center;
    border:1px solid var(--line);
    border-radius:16px;
    background:rgba(255,255,255,.78);
    color:var(--primary-strong);
    cursor:pointer;
    box-shadow:var(--shadow-sm);
    transition:transform .18s ease,box-shadow .18s ease,background .18s ease;
    text-decoration:none;
}

.icon-button:hover{
    transform:translateY(-2px);
    background:#fff;
    box-shadow:var(--shadow-md);
}

.icon-button:active{
    transform:scale(.96);
}

.icon-button svg{
    width:21px;
    height:21px;
}

.navigation-button{
    width:auto;
    min-width:46px;
    min-height:42px;
    height:auto;
    padding:7px 10px;
    display:inline-flex;
    align-items:center;
    justify-content:flex-start;
    gap:7px;
    border-radius:14px;
}

.navigation-label{
    max-width:70px;
    overflow:hidden;
    opacity:1;
    white-space:nowrap;
    font-size:11px;
    font-weight:800;
}

.container{
    width:100%;
    padding:clamp(20px,5vw,34px);
    border:1px solid rgba(120,92,155,.10);
    border-radius:var(--radius-lg);
    background:var(--surface);
    box-shadow:var(--shadow-lg);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
}

.eyebrow{
    text-align:center;
    color:var(--primary-strong);
    font-size:11px;
    font-weight:800;
    letter-spacing:.18em;
    text-transform:uppercase;
    margin-bottom:7px;
}

h1{
    text-align:center;
    font-family:"Quillen",Georgia,"Times New Roman",serif;
    font-size:clamp(34px,7vw,48px);
    line-height:1.05;
    font-weight:400;
    letter-spacing:-.025em;
    color:var(--text);
}

.subtitulo{
    margin:9px auto 0;
    max-width:58ch;
    text-align:center;
    font-family:"Quillen",Georgia,"Times New Roman",serif;
    font-size:16px;
    line-height:1.55;
    color:#776f7e;
}

.overview{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    align-items:stretch;
    gap:10px;
    margin-top:24px;
}

.overview-card{
    min-width:0;
    padding:17px;
    border:1px solid var(--line);
    border-radius:20px;
    background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(248,245,255,.88));
    box-shadow:var(--shadow-sm);
}

.overview-label{
    color:var(--muted);
    font-size:11px;
    font-weight:850;
    letter-spacing:.08em;
    text-transform:uppercase;
}

.lista-titulo{
    margin-top:3px;
    font-family:"Quillen",Georgia,serif;
    font-size:24px;
    line-height:1.1;
}

.collection-note{
    margin-top:5px;
    color:var(--muted);
    font-size:12px;
}

.contador{
    align-self:center;
    padding:10px 13px;
    border:1px solid var(--line);
    border-radius:14px;
    background:var(--primary-pale);
    color:var(--primary-strong);
    font-size:12px;
    font-weight:850;
    white-space:nowrap;
}

.status{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    min-height:22px;
    margin:18px 0 10px;
    color:var(--muted);
    font-size:12px;
    font-weight:700;
    text-align:center;
}

.status-dot{
    width:7px;
    height:7px;
    flex:0 0 7px;
    border-radius:50%;
    background:var(--primary);
    box-shadow:0 0 0 5px rgba(155,93,229,.10);
}

.music-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
    margin-top:14px;
}

.music-card{
    position:relative;
    min-width:0;
    overflow:hidden;
    border:1px solid var(--line);
    border-radius:20px;
    background:rgba(255,255,255,.86);
    box-shadow:var(--shadow-sm);
    cursor:pointer;
    transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}

.music-card:hover{
    transform:translateY(-3px);
    border-color:rgba(155,93,229,.20);
    box-shadow:var(--shadow-md);
}

.music-card:active{
    transform:scale(.985);
}

.thumbnail-wrap{
    position:relative;
    aspect-ratio:16/9;
    overflow:hidden;
    background:
        linear-gradient(135deg,#eee8ff,#f8f5ff);
}

.thumbnail{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    transition:opacity .25s ease,transform .35s ease;
}

.music-card:hover .thumbnail{
    transform:scale(1.025);
}

.thumbnail.loaded{
    opacity:1;
}

.thumbnail-fallback{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    color:var(--primary-strong);
}

.thumbnail-fallback svg{
    width:42px;
    height:42px;
}

.play-badge{
    position:absolute;
    left:10px;
    bottom:10px;
    width:38px;
    height:38px;
    display:grid;
    place-items:center;
    border:1px solid rgba(255,255,255,.65);
    border-radius:13px;
    background:rgba(72,47,99,.78);
    color:#fff;
    box-shadow:0 8px 22px rgba(49,33,68,.25);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
}

.play-badge svg{
    width:17px;
    height:17px;
    margin-left:2px;
}

.music-position{
    position:absolute;
    top:10px;
    right:10px;
    padding:5px 8px;
    border:1px solid rgba(255,255,255,.62);
    border-radius:10px;
    background:rgba(72,47,99,.72);
    color:#fff;
    font-size:10px;
    font-weight:850;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
}

.music-info{
    min-height:91px;
    padding:13px 14px 14px;
}

.music-label{
    color:var(--primary-strong);
    font-size:10px;
    font-weight:850;
    letter-spacing:.08em;
    text-transform:uppercase;
}

.music-title{
    display:-webkit-box;
    overflow:hidden;
    margin-top:5px;
    color:var(--text);
    font-family:"Quillen",Georgia,"Times New Roman",serif;
    font-size:19px;
    line-height:1.18;
    font-weight:400;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
}

.empty-state,
.error-state{
    display:none;
    margin-top:14px;
    padding:26px 16px;
    border:1px dashed rgba(117,101,132,.16);
    border-radius:18px;
    background:rgba(255,255,255,.48);
    color:var(--muted);
    line-height:1.6;
    text-align:center;
}

.empty-state.visible,
.error-state.visible{
    display:block;
}

.empty-state strong,
.error-state strong{
    display:block;
    margin-bottom:4px;
    color:var(--text);
    font-family:"Quillen",Georgia,serif;
    font-size:21px;
    font-weight:400;
}

.error-state{
    border-style:solid;
    background:#fff4f6;
    color:var(--danger);
}

.error-state strong{
    color:#704353;
}

.skeleton{
    overflow:hidden;
    border:1px solid var(--line);
    border-radius:20px;
    background:rgba(255,255,255,.78);
    box-shadow:var(--shadow-sm);
}

.skeleton-thumb,
.skeleton-line{
    position:relative;
    overflow:hidden;
    background:#eee8f7;
}

.skeleton-thumb{
    aspect-ratio:16/9;
}

.skeleton-info{
    padding:13px 14px 16px;
}

.skeleton-line{
    height:9px;
    margin-top:8px;
    border-radius:999px;
}

.skeleton-line.short{
    width:55%;
    margin-top:0;
}

.skeleton-line.long{
    width:84%;
}

.skeleton-thumb::after,
.skeleton-line::after{
    content:"";
    position:absolute;
    inset:0;
    transform:translateX(-100%);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
    animation:shimmer 1.25s infinite;
}

@keyframes shimmer{
    100%{transform:translateX(100%)}
}

.footer-actions{
    display:flex;
    justify-content:center;
    margin-top:20px;
}

.back-button{
    min-height:44px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:0 16px;
    border:1px solid var(--line);
    border-radius:15px;
    background:#fff;
    color:#6f6876;
    text-decoration:none;
    font-size:13px;
    font-weight:850;
    box-shadow:var(--shadow-sm);
    transition:transform .18s ease,background .18s ease,color .18s ease,box-shadow .18s ease;
}

.back-button:hover{
    transform:translateY(-1px);
    color:var(--primary-strong);
    background:var(--primary-pale);
    box-shadow:var(--shadow-md);
}

.back-button svg{
    width:17px;
    height:17px;
}

.hidden{
    display:none!important;
}

@media (max-width:560px){
    body{
        padding-top:max(12px,env(safe-area-inset-top));
    }

    .container{
        padding:19px 13px 16px;
        border-radius:24px;
    }

    .topbar{
        margin-bottom:9px;
    }

    .icon-button{
        width:43px;
        height:43px;
        flex-basis:43px;
        border-radius:14px;
    }

    .navigation-label{
        max-width:64px;
    }

    .music-grid{
        grid-template-columns:1fr;
        gap:11px;
    }

    .music-info{
        min-height:84px;
    }

    .music-title{
        font-size:20px;
    }
}

@media (max-width:380px){
    .overview{
        grid-template-columns:1fr;
    }

    .contador{
        justify-self:start;
    }

    h1{
        font-size:34px;
    }
}

@media (prefers-reduced-motion:reduce){
    *,
    *::before,
    *::after{
        scroll-behavior:auto!important;
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
    }
}
</style>

<script>
"use strict";

const YOUTUBE_API_KEY = "AIzaSyDrJdOQ9y5SxLR_1_nNt8fY5DGNIg8pskU";
const PLAYLIST_URL = "https://youtube.com/playlist?list=PLMeQ_QyqhY7s&si=uPKgxxgFpAnX2xIP";
const PLAYLIST_ID = "PLMeQ_QyqhY7s";
const YOUTUBE_API_URL = "https://www.googleapis.com/youtube/v3/playlistItems";
const MAX_RESULTS = 50;

const musicGrid = document.getElementById("musicGrid");
const emptyState = document.getElementById("emptyState");
const errorState = document.getElementById("errorState");
const errorText = document.getElementById("errorText");
const statusText = document.getElementById("statusText");
const contador = document.getElementById("contador");
const collectionNote = document.getElementById("collectionNote");

function extrairPlaylistId(valor){
    const texto = String(valor || "").trim();

    if(!texto){
        return "";
    }

    if(!texto.includes("youtube.com") && !texto.includes("youtu.be")){
        return texto;
    }

    try{
        const url = new URL(texto);
        const id = url.searchParams.get("list");
        return id ? id.trim() : "";
    }catch{
        const match = texto.match(/[?&]list=([^&#]+)/i);
        return match ? decodeURIComponent(match[1]).trim() : "";
    }
}

function escaparTexto(valor){
    return String(valor || "").replace(/\s+/g," ").trim();
}

function thumbnailDaMusica(item,videoId){
    const thumbnails = item?.snippet?.thumbnails || {};

    return (
        thumbnails.maxres?.url ||
        thumbnails.standard?.url ||
        thumbnails.high?.url ||
        thumbnails.medium?.url ||
        thumbnails.default?.url ||
        `https://i.ytimg.com/vi/${encodeURIComponent(videoId)}/hqdefault.jpg`
    );
}

function ehItemInvalido(item){
    const videoId = item?.snippet?.resourceId?.videoId || "";
    const privacy = item?.status?.privacyStatus || "";

    if(!videoId){
        return true;
    }

    if(privacy === "private"){
        return true;
    }

    const titulo = escaparTexto(item?.snippet?.title || "").toLowerCase();

    return (
        titulo === "deleted video" ||
        titulo === "private video" ||
        titulo === "[deleted video]" ||
        titulo === "[private video]"
    );
}

function transformarItem(item){
    if(ehItemInvalido(item)){
        return null;
    }

    const snippet = item.snippet;
    const videoId = snippet.resourceId.videoId;

    return {
        videoId,
        title: escaparTexto(snippet.title) || "Vídeo sem título",
        thumbnail: thumbnailDaMusica(item,videoId),
        position: Number.isFinite(Number(snippet.position))
            ? Number(snippet.position)
            : Number.MAX_SAFE_INTEGER,
        url: `https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}&list=${encodeURIComponent(PLAYLIST_ID)}`
    };
}

async function consultarPaginaPlaylist(playlistId,pageToken=""){
    const params = new URLSearchParams({
        part:"snippet,status",
        playlistId,
        maxResults:String(MAX_RESULTS),
        key:YOUTUBE_API_KEY
    });

    if(pageToken){
        params.set("pageToken",pageToken);
    }

    const resposta = await fetch(`${YOUTUBE_API_URL}?${params.toString()}`,{
        method:"GET",
        cache:"no-store",
        headers:{
            "Accept":"application/json"
        }
    });

    let dados = null;

    try{
        dados = await resposta.json();
    }catch{
        throw new Error(`Resposta inválida da API (${resposta.status}).`);
    }

    if(!resposta.ok || dados?.error){
        const apiError = dados?.error;
        const motivo = apiError?.errors?.[0]?.reason || "";
        const mensagem = apiError?.message || `HTTP ${resposta.status}`;

        const erro = new Error(mensagem);
        erro.status = resposta.status;
        erro.reason = motivo;
        erro.apiMessage = mensagem;
        throw erro;
    }

    return dados;
}

async function obterTodosOsVideos(playlistId){
    const itens = [];
    let pageToken = "";
    let paginas = 0;

    do{
        paginas += 1;

        if(paginas > 200){
            throw new Error("Número inesperado de páginas da playlist.");
        }

        const dados = await consultarPaginaPlaylist(playlistId,pageToken);

        if(Array.isArray(dados.items)){
            itens.push(...dados.items);
        }

        pageToken = dados.nextPageToken || "";

        statusText.textContent =
            pageToken
                ? `Carregando playlist... ${itens.length} itens`
                : "Organizando músicas...";
    }while(pageToken);

    return itens;
}

function criarIconePlay(){
    const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("viewBox","0 0 24 24");
    svg.setAttribute("fill","currentColor");
    svg.setAttribute("aria-hidden","true");

    const path = document.createElementNS("http://www.w3.org/2000/svg","path");
    path.setAttribute("d","M8 5.5v13l10-6.5z");

    svg.appendChild(path);
    return svg;
}

function criarIconeNota(){
    const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("viewBox","0 0 24 24");
    svg.setAttribute("fill","none");
    svg.setAttribute("stroke","currentColor");
    svg.setAttribute("stroke-width","1.7");
    svg.setAttribute("stroke-linecap","round");
    svg.setAttribute("stroke-linejoin","round");
    svg.setAttribute("aria-hidden","true");

    const path = document.createElementNS("http://www.w3.org/2000/svg","path");
    path.setAttribute("d","M9 18V5l11-2v13");

    const c1 = document.createElementNS("http://www.w3.org/2000/svg","circle");
    c1.setAttribute("cx","6");
    c1.setAttribute("cy","18");
    c1.setAttribute("r","3");

    const c2 = document.createElementNS("http://www.w3.org/2000/svg","circle");
    c2.setAttribute("cx","17");
    c2.setAttribute("cy","16");
    c2.setAttribute("r","3");

    svg.append(path,c1,c2);
    return svg;
}

function criarCard(musica){
    const card = document.createElement("article");
    card.className = "music-card";
    card.tabIndex = 0;
    card.setAttribute("role","link");
    card.setAttribute("aria-label",`Abrir ${musica.title} no YouTube`);

    const thumbWrap = document.createElement("div");
    thumbWrap.className = "thumbnail-wrap";

    const fallback = document.createElement("div");
    fallback.className = "thumbnail-fallback";
    fallback.appendChild(criarIconeNota());

    const img = document.createElement("img");
    img.className = "thumbnail";
    img.alt = `Capa de ${musica.title}`;
    img.loading = "lazy";
    img.decoding = "async";
    img.src = musica.thumbnail;

    img.addEventListener("load",()=>{
        img.classList.add("loaded");
        fallback.remove();
    },{once:true});

    img.addEventListener("error",()=>{
        img.remove();
    },{once:true});

    const playBadge = document.createElement("span");
    playBadge.className = "play-badge";
    playBadge.appendChild(criarIconePlay());

    const position = document.createElement("span");
    position.className = "music-position";
    position.textContent = `#${musica.position + 1}`;

    thumbWrap.append(fallback,img,playBadge,position);

    const info = document.createElement("div");
    info.className = "music-info";

    const label = document.createElement("div");
    label.className = "music-label";
    label.textContent = "Música • Vídeo";

    const title = document.createElement("div");
    title.className = "music-title";
    title.textContent = musica.title;

    info.append(label,title);
    card.append(thumbWrap,info);

    const abrir = ()=>{
        window.open(musica.url,"_blank","noopener,noreferrer");
    };

    card.addEventListener("click",abrir);

    card.addEventListener("keydown",(event)=>{
        if(event.key === "Enter" || event.key === " "){
            event.preventDefault();
            abrir();
        }
    });

    return card;
}

function renderizarMusicas(musicas){
    musicGrid.replaceChildren();

    const fragment = document.createDocumentFragment();

    for(const musica of musicas){
        fragment.appendChild(criarCard(musica));
    }

    musicGrid.appendChild(fragment);
    musicGrid.setAttribute("aria-busy","false");

    contador.textContent =
        `${musicas.length} ${musicas.length === 1 ? "música" : "músicas"}`;

    collectionNote.textContent =
        `${musicas.length} ${musicas.length === 1 ? "item disponível" : "itens disponíveis"}`;

    emptyState.classList.toggle("visible",musicas.length === 0);
}

function normalizarErro(erro){
    const status = Number(erro?.status || 0);
    const reason = String(erro?.reason || "").toLowerCase();
    const mensagem = String(erro?.apiMessage || erro?.message || "").toLowerCase();

    if(reason.includes("quota") || mensagem.includes("quota")){
        return "A cota diária da YouTube Data API foi atingida.";
    }

    if(
        reason.includes("keyinvalid") ||
        reason.includes("keyinvalid") ||
        mensagem.includes("api key not valid")
    ){
        return "A chave da YouTube Data API não foi aceita pelo Google Cloud.";
    }

    if(
        reason.includes("iprefererblocked") ||
        reason.includes("refererblocked") ||
        mensagem.includes("referer")
    ){
        return "A chave da API está bloqueada pela restrição de aplicativo.";
    }

    if(
        reason.includes("playlistnotfound") ||
        status === 404 ||
        mensagem.includes("playlist not found")
    ){
        return "A playlist não foi encontrada ou não está acessível.";
    }

    if(
        reason.includes("playlistitemsnotaccessible") ||
        mensagem.includes("playlist items")
    ){
        return "Os itens dessa playlist não estão acessíveis pela API.";
    }

    if(status === 403){
        return "O Google recusou a consulta à YouTube Data API.";
    }

    if(status === 400){
        return "A consulta enviada para a YouTube Data API foi recusada.";
    }

    if(mensagem.includes("failed to fetch")){
        return "Não foi possível conectar à YouTube Data API. Verifique a conexão e o acesso da página à internet.";
    }

    return "Não foi possível consultar a playlist agora.";
}

async function iniciar(){
    const playlistId = extrairPlaylistId(PLAYLIST_URL) || PLAYLIST_ID;

    if(!playlistId){
        throw new Error("ID da playlist ausente.");
    }

    const itens = await obterTodosOsVideos(playlistId);

    const musicas = itens
        .map(transformarItem)
        .filter(Boolean)
        .sort((a,b)=>a.position-b.position);

    renderizarMusicas(musicas);

    statusText.textContent =
        musicas.length
            ? `${musicas.length} ${musicas.length === 1 ? "música carregada" : "músicas carregadas"}`
            : "Playlist consultada";
}

async function carregar(){
    errorState.classList.remove("visible");
    emptyState.classList.remove("visible");
    musicGrid.setAttribute("aria-busy","true");
    statusText.textContent = "Carregando músicas...";

    try{
        await iniciar();
    }catch(erro){
        console.error("Erro ao carregar a playlist do YouTube:",erro);
        musicGrid.replaceChildren();
        musicGrid.setAttribute("aria-busy","false");
        contador.textContent = "—";
        collectionNote.textContent = "Não foi possível carregar";
        statusText.textContent = "Não foi possível carregar a playlist";
        errorText.textContent = normalizarErro(erro);
        errorState.classList.add("visible");
    }
}

document.addEventListener("DOMContentLoaded",carregar);
</script>
