<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7010B0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<title>Looply</title>

<link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch&display=swap" rel="stylesheet">

<style>

:root {
  --primary: #7010B0;
  --primary-dark: #6010A0;
  --primary-deep: #503090;
  --deep-purple: #302050;

  --white: #FFFFFF;

  --surface: #F5F0FA;
  --surface-lilac: #F0E0F0;

  --text-primary: #403050;
  --text-secondary: #7010B0;
  --text-muted: #AAA2B0;

  --border: #DED6E5;

  --success: #35C878;
  --error: #E63232;

  --logo-color: #7010B0;
  --logo-glow: rgba(112,16,176,.70);
  --logo-glow-soft: rgba(112,16,176,.35);

  --radius-sm: 12px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-xl: 32px;
  --radius-pill: 999px;

  --shadow-soft: 0 8px 24px rgba(70,30,100,.10);
  --shadow-logo: 0 0 12px rgba(112,16,176,.45);
}


html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 48%, var(--surface) 48%, var(--surface) 100%);
  font-family: 'Cabin Sketch', cursive, sans-serif;
  color: var(--text-primary);
  overflow: hidden;
}

body {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  text-align: center;
}

body::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 52%;
  transform: translate(-50%, -50%);
  width: min(46vw, 560px);
  height: min(46vw, 560px);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.18), rgba(255,255,255,0.02) 58%, transparent 72%);
  filter: blur(12px);
}

.logo-wrap {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  animation: logoFloat 1.6s ease-out forwards;
}

.logo-ring {
  position: relative;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: rgba(255,255,255,0.04);
  border: 8px solid var(--primary);
  box-shadow: var(--shadow-logo), 0 0 18px rgba(112,16,176,.2);
}

.logo-ring::before,
.logo-ring::after {
  content: "";
  position: absolute;
  inset: -12px;
  border-radius: 50%;
  border: 1px solid rgba(112,16,176,.35);
}

.logo-ring::after {
  inset: -24px;
  border-color: rgba(112,16,176,.15);
}

.logo-ring .mark {
  width: 62px;
  height: 62px;
  position: relative;
  display: block;
}

.logo-ring .mark::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: 5px solid var(--primary);
  border-top-color: transparent;
  border-right-color: transparent;
  transform: translate(-50%, -50%) rotate(30deg);
  box-shadow: 0 0 10px rgba(112,16,176,.4);
}

.brand {
  font-size: clamp(2.7rem, 7vw, 5rem);
  color: var(--white);
  letter-spacing: 0.04em;
  text-shadow: 0 0 24px rgba(112,16,176,.60);
  font-weight: 700;
}

.subtitle {
  position: absolute;
  bottom: 76px;
  left: 50%;
  transform: translateX(-50%);
  color: var(--text-secondary);
  font-size: clamp(1.1rem, 4vw, 1.7rem);
  text-align: center;
  width: min(80vw, 520px);
  opacity: 0;
  animation: fadeUp 0.7s ease 0.7s forwards;
}

.footer-tag {
  position: absolute;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  color: var(--text-secondary);
  font-size: clamp(.8rem, 2.5vw, 1.1rem);
  letter-spacing: 0.08em;
  opacity: 0.9;
}

@keyframes logoFloat {
  0% { opacity: 0; transform: translateY(15px) scale(0.96); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translate(-50%, 10px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

</style>
</head>
<body>
  <div class="logo-wrap" aria-label="Looply logo">
    <div class="logo-ring" aria-hidden="true">
      <span class="mark"></span>
    </div>
    <div class="brand">Looply</div>
  </div>

  <div class="subtitle">Cartas aos amigos ;)</div>
  <div class="footer-tag">MoissWorld</div>

  <script>
    const loginPage = 'login.html';
    const homePage = 'home.html';

    const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';

    setTimeout(() => {
      window.location.href = isLoggedIn ? homePage : loginPage;
    }, 1800);
  </script>
</body>
</html>
