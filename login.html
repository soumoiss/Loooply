<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F5F0FA">
  <link rel="stylesheet" href="assets/css/app.css">
  <title>Looply — Login</title>
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="login-brand">
        <div class="login-logo" aria-hidden="true">
          <div class="circle">
            <svg viewBox="0 0 100 100" fill="none"><path d="M50 15A35 35 0 0 1 85 50" stroke="currentColor" stroke-width="5"/></svg>
          </div>
        </div>
        <div class="login-brand-name" id="loginTitle">Looply</div>
        <div class="login-brand-subtitle">Cartas aos amigos ;)</div>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-field">
          <label class="form-label" for="username">Usuário</label>
          <div class="input-wrap"><input class="input" id="username" name="username" type="text" placeholder="Digite seu usuário" autocomplete="username" required></div>
        </div>

        <div class="form-field">
          <label class="form-label" for="password">Senha</label>
          <div class="input-wrap">
            <input class="input password-input" id="password" name="password" type="password" placeholder="Digite sua senha" autocomplete="current-password" required>
            <button class="toggle-password" id="togglePassword" type="button" aria-label="Mostrar senha">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>
            </button>
          </div>
        </div>

        <div class="forgot"><a href="https://wa.me/558589069191?text=esqueci%20minha%20senha" target="_blank" rel="noopener noreferrer">Esqueci minha senha</a></div>
        <button class="login-button" id="loginButton" type="submit">Entrar</button>
        <div class="form-message" id="message" role="alert">Usuários alterados, bebê! Solicite novo usuário e nova senha ao ADM Moiss hehe.</div>
      </form>

      <div class="login-footer"><strong>Looply</strong> · MoissWorld</div>
    </section>
  </main>

  <script type="module">
    import { authenticate, createSession, redirectIfAuthenticated } from "./assets/js/session.js";

    const form = document.getElementById("loginForm");
    const username = document.getElementById("username");
    const password = document.getElementById("password");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");
    const toggle = document.getElementById("togglePassword");
    const eye = document.getElementById("eyeIcon");

    redirectIfAuthenticated();

    toggle.addEventListener("click", () => {
      const showing = password.type === "text";
      password.type = showing ? "password" : "text";
      toggle.setAttribute("aria-label", showing ? "Mostrar senha" : "Ocultar senha");
      eye.innerHTML = showing
        ? '<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.5"></circle>'
        : '<path d="M3 3l18 18"></path><path d="M10.6 6.2A10.8 10.8 0 0 1 12 6c6.5 0 10 6 10 6a18.6 18.6 0 0 1-3.1 3.7"></path><path d="M6.6 6.7C3.7 8.4 2 12 2 12s3.5 6 10 6a10.8 10.8 0 0 0 4-.8"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>';
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.classList.remove("show");
      button.disabled = true;
      button.textContent = "Entrando…";
      try {
        const user = await authenticate(username.value, password.value);
        if (!user || !createSession(user.username)) throw new Error("invalid");
        window.location.replace("home.html");
      } catch {
        message.classList.add("show");
        password.focus();
        setTimeout(() => message.classList.remove("show"), 3200);
      } finally {
        button.disabled = false;
        button.textContent = "Entrar";
      }
    });
  </script>
</body>
</html>
