name: Atualizar índice da galeria

on:
  workflow_dispatch:
  push:
    paths:
      - "midia/**"
      - "scripts/gerar-midia-index.py"
      - ".github/workflows/atualizar-galeria.yml"

permissions:
  contents: write

concurrency:
  group: atualizar-galeria-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gerar-indice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Gerar índice
        run: python scripts/gerar-midia-index.py

      - name: Validar JSON
        run: python -m json.tool data/midia-index.json >/dev/null

      - name: Commitar alterações
        run: |
          if git diff --quiet -- data/midia-index.json; then
            echo "Índice já está atualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/midia-index.json
          git commit -m "chore: atualizar índice da galeria"
          # Reintegra commits concorrentes antes de publicar; nunca usa force push.
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "Conflito durante rebase; nenhuma alteração foi forçada." >&2
              exit 1
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push concorrente; nova tentativa ${attempt}/3."
          done
          echo "Não foi possível publicar o índice após 3 tentativas." >&2
          exit 1
