name: Atualizar Índice da Galeria

on:
  push:
    paths:
      - "midia/**"
      - ".github/workflows/atualizar-galeria.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-indice-galeria
  cancel-in-progress: true

jobs:
  update-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar Pillow
        run: |
          python -m pip install --disable-pip-version-check --no-input Pillow

      - name: Criar gerador do índice
        shell: bash
        run: |
          cat > /tmp/gerar_indice.py <<'PY'
          import os
          import json
          from datetime import datetime, timezone

          try:
              from PIL import Image
          except Exception:
              Image = None

          EXT_FOTOS = {
              ".jpg",
              ".jpeg",
              ".png",
              ".webp",
              ".gif",
              ".avif",
              ".bmp",
              ".svg",
              ".heic",
              ".heif",
              ".jfif",
              ".tif",
              ".tiff"
          }

          EXT_AUDIOS = {
              ".mp3",
              ".m4a",
              ".wav",
              ".ogg",
              ".oga",
              ".aac",
              ".flac",
              ".opus"
          }

          EXT_VIDEOS = {
              ".mp4",
              ".webm",
              ".mov",
              ".m4v",
              ".ogv",
              ".avi",
              ".mkv"
          }

          USERS = [
              "Patati",
              "Misol",
              "Lilika",
              "YARA"
          ]

          def is_ignored_file(filename):
              lower = filename.lower()

              return (
                  lower == "01"
                  or lower.startswith("01.")
              )

          def get_dimensions(path):
              if Image is None:
                  return 0, 0

              try:
                  with Image.open(path) as image:
                      return (
                          int(image.width),
                          int(image.height)
                      )
              except Exception:
                  return 0, 0

          def get_metadata(path):
              try:
                  stat = os.stat(path)

                  return (
                      int(stat.st_size),
                      float(stat.st_mtime)
                  )
              except Exception:
                  return 0, 0

          def create_item(relative_path, filename, extension):
              size, mtime = get_metadata(relative_path)

              if extension in EXT_FOTOS:
                  width, height = get_dimensions(relative_path)
                  media_type = "foto"

              elif extension in EXT_AUDIOS:
                  width = 0
                  height = 0
                  media_type = "audio"

              else:
                  width = 0
                  height = 0
                  media_type = "video"

              if width > 0 and height > 0:
                  ratio = round(
                      width / height,
                      6
                  )
              else:
                  ratio = 0

              if mtime:
                  modified = datetime.fromtimestamp(
                      mtime,
                      tz=timezone.utc
                  ).isoformat()
              else:
                  modified = None

              return {
                  "path": relative_path.replace("\\", "/"),
                  "name": filename,
                  "extension": extension,
                  "type": media_type,
                  "width": width,
                  "height": height,
                  "ratio": ratio,
                  "bytes": size,
                  "mtime": mtime,
                  "modified": modified
              }

          def sort_key(item):
              return (
                  item.get(
                      "name",
                      ""
                  ).casefold(),
                  item.get(
                      "path",
                      ""
                  ).casefold()
              )

          data = {
              "generatedAt": datetime.now(
                  timezone.utc
              ).isoformat(),

              "repository": {
                  "owner": "soumoiss",
                  "repo": "Loooply",
                  "branch": "main"
              },

              "schemaVersion": 3,

              "fotos": [],
              "audios": [],
              "videos": [],

              "exclusivo": {
                  user: []
                  for user in USERS
              }
          }

          midia_dir = "midia"

          if os.path.isdir(midia_dir):

              for root, dirs, files in os.walk(midia_dir):

                  dirs[:] = sorted(
                      directory
                      for directory in dirs
                      if not directory.startswith(".")
                  )

                  for filename in sorted(
                      files,
                      key=lambda value: value.casefold()
                  ):

                      if filename.startswith("."):
                          continue

                      if is_ignored_file(filename):
                          continue

                      absolute_path = os.path.join(
                          root,
                          filename
                      )

                      relative_path = os.path.relpath(
                          absolute_path,
                          "."
                      ).replace("\\", "/")

                      if (
                          relative_path.lower()
                          == "midia/tema.mp3"
                      ):
                          continue

                      extension = os.path.splitext(
                          filename
                      )[1].lower()

                      supported = (
                          EXT_FOTOS
                          | EXT_AUDIOS
                          | EXT_VIDEOS
                      )

                      if extension not in supported:
                          continue

                      item = create_item(
                          relative_path,
                          filename,
                          extension
                      )

                      parts = relative_path.split("/")

                      matched_user = None

                      if len(parts) >= 3:

                          folder_user = parts[1]

                          for user in USERS:

                              if (
                                  user.lower()
                                  == folder_user.lower()
                              ):
                                  matched_user = user
                                  break

                      if matched_user:
                          data[
                              "exclusivo"
                          ][matched_user].append(item)

                      elif extension in EXT_FOTOS:
                          data["fotos"].append(item)

                      elif extension in EXT_AUDIOS:
                          data["audios"].append(item)

                      elif extension in EXT_VIDEOS:
                          data["videos"].append(item)

          data["fotos"].sort(
              key=sort_key
          )

          data["audios"].sort(
              key=sort_key
          )

          data["videos"].sort(
              key=sort_key
          )

          for user in USERS:
              data["exclusivo"][user].sort(
                  key=sort_key
              )

          with open(
              "midia-index.json",
              "w",
              encoding="utf-8",
              newline="\n"
          ) as file:

              json.dump(
                  data,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

              file.write("\n")

          print(
              "Índice criado com sucesso."
          )

          print(
              "Fotos:",
              len(data["fotos"])
          )

          print(
              "Áudios:",
              len(data["audios"])
          )

          print(
              "Vídeos:",
              len(data["videos"])
          )

          for user in USERS:
              print(
                  "Exclusivo",
                  user + ":",
                  len(
                      data["exclusivo"][user]
                  )
              )
          PY

      - name: Gerar midia-index.json
        env:
          PYTHONUTF8: "1"
        run: |
          python /tmp/gerar_indice.py

      - name: Verificar índice
        run: |
          test -f midia-index.json
          python -m json.tool midia-index.json > /dev/null

          echo "midia-index.json validado com sucesso."

      - name: Commit e Push das alterações
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for tentativa in 1 2 3 4 5; do

            echo ""
            echo "========================================"
            echo "Tentativa ${tentativa}/5"
            echo "========================================"

            echo ""
            echo "Sincronizando com origin/main..."

            git fetch origin main

            echo ""
            echo "Atualizando checkout para o main mais recente..."

            git reset --hard origin/main

            echo ""
            echo "Regenerando midia-index.json..."

            python /tmp/gerar_indice.py

            echo ""
            echo "Validando JSON..."

            python -m json.tool midia-index.json > /dev/null

            echo ""
            echo "Preparando alteração..."

            git add midia-index.json

            if git diff --cached --quiet; then
              echo ""
              echo "Nenhuma alteração no midia-index.json."
              echo "Nada para enviar."
              exit 0
            fi

            echo ""
            echo "Criando commit..."

            git commit \
              -m "chore: atualizar midia-index.json [skip ci]"

            echo ""
            echo "Enviando para origin/main..."

            if git push origin HEAD:main; then

              echo ""
              echo "========================================"
              echo "Índice enviado com sucesso."
              echo "========================================"

              exit 0
            fi

            echo ""
            echo "O branch main mudou durante o push."
            echo "Sincronizando novamente..."

            git fetch origin main

            git reset --hard origin/main

          done

          echo ""
          echo "========================================"
          echo "ERRO: não foi possível enviar o índice."
          echo "Foram realizadas 5 tentativas."
          echo "========================================"

          exit 1
