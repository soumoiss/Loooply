name: Atualizar índice da galeria

on:
  workflow_dispatch:
  push:
    paths:
      - "midia/**"
      - "scripts/gerar-midia-index.py"
      - ".github/workflows/atualizar-galeria.yml"

permissions:
  contents: write

concurrency:
  group: atualizar-galeria-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gerar-indice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Gerar índice
        run: python scripts/gerar-midia-index.py

      - name: Validar JSON
        run: python -m json.tool data/midia-index.json >/dev/null

      - name: Commitar alterações
        run: |
          if git diff --quiet -- data/midia-index.json; then
            echo "Índice já está atualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/midia-index.json
          git commit -m "chore: atualizar índice da galeria"
          git push
